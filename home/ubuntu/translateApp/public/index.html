<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IntuitionTrades Two-Party Translator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    /*──────────────────────────────────────────────────────────────────────────
      Basic two-column layout with controls on top and panes below
    ──────────────────────────────────────────────────────────────────────────*/
    html, body {
      margin: 0;
      height: 100%;
      font-family: sans-serif;
      background: #111;
      color: #eee;
    }
    #container {
      display: flex;
      height: 100%;
    }
    .col {
      flex: 1;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    .col:first-child { border-left: none; }

    .header {
      background: #222;
      padding: 0.75rem;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    .header label, .header button {
      font-size: 1rem;
      margin: 0 0.5rem;
    }
    .header select {
      background: #444;
      color: #eee;
      padding: 0.5rem;
      border: none;
      border-radius: 4px;
    }
    .header button {
      background: #27e835;
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    .header button.listening {
      background: #ff5252;
      color: #fff;
    }

    .panes {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      white-space: pre-wrap;
      border-bottom: 1px solid #333;
    }
    .pane:last-child { border-bottom: none; }

    .pane-title {
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .pane-content {
      /* This is where dynamic text will appear */
    }

    button:disabled {
      background: #555;
      color: #aaa;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!--────────────────────────────────────────────────────────────────────────
    Two Columns: Speaker A (left) and Speaker B (right)
  ─────────────────────────────────────────────────────────────────────────-->
  <div id="container">

    <!-- ─── Speaker A Column ─────────────────────────────────────────────────── -->
    <div class="col" id="colA">
      <div class="header">
        <label>
          A speaks:
          <select id="srcLangA">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="ru">Russian</option>
          </select>
        </label>
        <label>
          A hears:
          <select id="tgtLangA">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="ru">Russian</option>
          </select>
        </label>
        <button id="toggleA" disabled>Start A</button>
      </div>
      <div class="panes">
        <div class="pane">
          <div class="pane-title">A: Recognized</div>
          <div id="origA" class="pane-content"></div>
        </div>
        <div class="pane">
          <div class="pane-title">A: Received Translation</div>
          <div id="transA" class="pane-content"></div>
        </div>
      </div>
    </div>

    <!-- ─── Speaker B Column ─────────────────────────────────────────────────── -->
    <div class="col" id="colB">
      <div class="header">
        <label>
          B speaks:
          <select id="srcLangB">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="ru">Russian</option>
          </select>
        </label>
        <label>
          B hears:
          <select id="tgtLangB">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="ru">Russian</option>
          </select>
        </label>
        <button id="toggleB" disabled>Start B</button>
      </div>
      <div class="panes">
        <div class="pane">
          <div class="pane-title">B: Recognized</div>
          <div id="origB" class="pane-content"></div>
        </div>
        <div class="pane">
          <div class="pane-title">B: Received Translation</div>
          <div id="transB" class="pane-content"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Socket.IO client & our custom client.js -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
