<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upgrade to Premium | Intuition Trades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Minimal CSS (matching the YouTube/login style) -->
  <style>
    /* Basic reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #222;
      padding: 10px 20px;
      position: relative;
    }
    .site-title {
      font-size: 20px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #userStatus {
      cursor: pointer;
      font-size: 16px;
    }
    /* Account dropdown styling */
    #accountDropdown {
      position: absolute;
      top: 50px;
      right: 20px;
      background: #222;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 4px;
      display: none;
      z-index: 1000;
    }
    #accountDropdown a,
    #accountDropdown button {
      display: block;
      margin-bottom: 5px;
      background: none;
      border: none;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
    }
    #accountDropdown a:hover,
    #accountDropdown button:hover {
      text-decoration: underline;
    }
    /* MAIN CONTENT */
    main {
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 80px);
    }
    .upgrade-container {
      background: #222;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .upgrade-container h1 {
      margin-bottom: 20px;
    }
    .upgrade-container p {
      margin-bottom: 20px;
    }
    .upgrade-container button {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    .cancel-link {
      margin-top: 10px;
      color: #16a34a;
      text-decoration: underline;
      cursor: pointer;
    }
    /* FOOTER */
    footer {
      text-align: center;
      padding: 10px;
      background: #222;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="site-title">Intuition Trades</div>
    <div class="header-right">
      <div id="userStatus" onclick="toggleDropdown()">Loading...</div>
    </div>
    <div id="accountDropdown">
      <a href="index.html">Home</a>
      <button id="signOutBtn">Sign Out</button>
    </div>
  </header>

  <!-- MAIN UPGRADE CONTENT -->
  <main>
    <div class="upgrade-container">
      <h1>Upgrade to Premium</h1>
      <p>Unlock exclusive premium tools such as our Top Stocks Scanner. Enjoy enhanced features and priority support.</p>
      <button id="upgradeBtn">Upgrade Now</button>
      <div class="cancel-link" onclick="location.href='index.html'">Cancel</div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 Intuition Trades. All rights reserved.</p>
  </footer>
  
  <!-- Firebase and Upgrade Script -->
  <script type="module">
    // Import necessary Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getDatabase, ref, update, get } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
    
    // Firebase configuration – update with your project settings
    const firebaseConfig = {
      apiKey: "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
      authDomain: "persuasive-net-456607-g8.firebaseapp.com",
      projectId: "persuasive-net-456607-g8",
      storageBucket: "persuasive-net-456607-g8.appspot.com",
      messagingSenderId: "1019332250475",
      appId: "1:1019332250475:web:3b931ad7fd0a72e1949a2e",
      databaseURL: "https://persuasive-net-456607-g8-default-rtdb.firebaseio.com"
    };

    // Initialize Firebase
    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getDatabase(appFirebase);
    
    // Ensure only signed-in users can access premium.html
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // Redirect to login if not signed in
        window.location.href = "login.html";
      } else {
        // Update header status with display name
        const userStatus = document.getElementById("userStatus");
        if (user.displayName) {
          userStatus.textContent = "Hello, " + user.displayName;
        } else {
          userStatus.textContent = "Basic User";
        }
      }
    });
    
    // Toggle account dropdown
    function toggleDropdown() {
      const dropdown = document.getElementById("accountDropdown");
      dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    }
    window.toggleDropdown = toggleDropdown;
    
    // Upgrade button: update user role to "premium" in the Firebase database
    const upgradeBtn = document.getElementById("upgradeBtn");
    upgradeBtn.addEventListener("click", async () => {
      const user = auth.currentUser;
      if (!user) {
        alert("Please sign in to upgrade.");
        window.location.href = "login.html";
        return;
      }
      try {
        const userRef = ref(db, "users/" + user.uid);
        // Update the user's role to "premium"
        await update(userRef, { role: "premium" });
        alert("Upgrade successful! Redirecting to Home...");
        window.location.href = "index.html";
      } catch (error) {
        console.error("Upgrade error:", error);
        alert("Error upgrading membership. Please try again.");
      }
    });
    
    // Sign out button handling
    document.getElementById("signOutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.href = "login.html";
      } catch (error) {
        console.error("Sign out error:", error);
      }
    });
  </script>
</body>
</html>
