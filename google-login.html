<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Sign-In Test</title>
  <style>
    /* Container that holds the sign-in button, right aligned */
    #google-signin-button {
      display: flex;
      justify-content: flex-end;
      margin: 20px;
    }
  </style>
</head>
<body>
  <!-- Div where the Google Sign-In button will be rendered -->
  <div id="google-signin-button"></div>
  
  <!-- Include the Google Identity Services JS Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <script>
    // Ensure the code runs after everything, including the Google script, is loaded.
    window.onload = function() {
      // Initialize Google Identity Services with your Client ID and callback.
      google.accounts.id.initialize({
        client_id: "989729012898-33u478nul5lg3s6fvat2mk6ahgmp4pg5.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });
      // Render the Google Sign-In button.
      google.accounts.id.renderButton(
        document.getElementById("google-signin-button"),
        {
          theme: "filled_black",
          size: "large",
          logo_alignment: "right"
        }
      );
    };

    // Callback function to handle the token response.
    function handleCredentialResponse(response) {
      console.log("Encoded JWT ID token: " + response.credential);
      alert("Sign-in successful!\nToken: " + response.credential);
      // Here you might send the token to your backend, etc.
    }
  </script>
</body>
</html>
