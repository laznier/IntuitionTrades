<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Tools Demo</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #user-type-indicator {
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    .tool-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .tool-card {
      background: #333;
      padding: 20px;
      border-radius: 5px;
      position: relative;
      width: 250px;
    }
    .tool-card h2 {
      margin-top: 0;
    }
    .tool-card p {
      font-size: 0.95rem;
    }
    .tool-button {
      background: #005fa3;
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin-top: 10px;
      text-decoration: none;
      display: inline-block;
    }
    /* Premium tool overlay: visible by default on the premium tool card */
    .premium-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 1.1rem;
      border-radius: 5px;
      transition: opacity 0.3s ease;
    }
    /* When unlocked, the overlay is hidden */
    .unlocked .premium-overlay {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Indicator for user type (Basic or Premium) -->
  <div id="user-type-indicator">Not signed in</div>
  <!-- Container for the Google sign‑in button -->
  <div id="google-signin-button"></div>

  <h1>Tool Demo</h1>
  <div class="tool-grid">
    <!-- Basic Tool Card (always accessible) -->
    <div class="tool-card basic">
      <h2>Basic Tool</h2>
      <p>This tool is available for all users.</p>
      <a href="/basic-tool" class="tool-button">Open Basic Tool</a>
    </div>
    <!-- Premium Tool Card (locked by default) -->
    <div class="tool-card premium" id="premiumCard">
      <h2>Premium Tool</h2>
      <p>This tool is available only for premium users.</p>
      <!-- Premium overlay which hides the tool if locked -->
      <div class="premium-overlay" id="premiumOverlay">Premium Locked</div>
      <a href="/premium-tool" class="tool-button">Open Premium Tool</a>
    </div>
  </div>

  <!-- Load the Google Identity Services library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Global flag to track if the premium tool button was clicked.
    let premiumToolClicked = false;

    // Initialize Google Sign-In and auto-select any previously signed in account.
    window.onload = function() {
      google.accounts.id.initialize({
        client_id: "989729012898-33u478nul5lg3s6fvat2mk6ahgmp4pg5.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });
      // Render the sign-in button into its container.
      const signInContainer = document.getElementById("google-signin-button");
      if (signInContainer) {
        google.accounts.id.renderButton(
          signInContainer,
          { theme: "filled_black", size: "large" }
        );
      }
      // Force auto-select to sign in immediately if the user is already signed in.
      google.accounts.id.prompt({ auto_select: true });
    };

    // If the user clicks the premium tool button, force re-authentication.
    document.addEventListener("DOMContentLoaded", () => {
      // For this demo, clicking anywhere on the premium tool card will trigger premium flow.
      const premiumCard = document.getElementById("premiumCard");
      if (premiumCard) {
        premiumCard.addEventListener("click", () => {
          premiumToolClicked = true;
          google.accounts.id.prompt(); // Forces re-authentication.
        });
      }
    });

    // Handle the sign-in response from Google.
    function handleCredentialResponse(response) {
      console.log("Received JWT token:", response.credential);
      // Send the token to your backend verification endpoint.
      fetch('/api/verify-google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: response.credential })
      })
      .then(res => res.json())
      .then(data => {
        console.log("Verification response:", data);
        // If the premium tool was clicked, use that flow.
        if (premiumToolClicked) {
          if (data.isPremium) {
            // Unlock the premium card by removing the overlay.
            document.getElementById("premiumCard").classList.add("unlocked");
            // Optionally redirect immediately:
            // window.location.href = "/premium-tool";
          } else {
            alert("Access denied – this tool is available for Premium Users only.");
            // Reset the premium flow flag.
            premiumToolClicked = false;
          }
        } else {
          // Normal sign-in flow on page load.
          if (data.isPremium) {
            document.getElementById("user-type-indicator").textContent = "Premium User";
            // Unlock any premium content.
            document.getElementById("premiumCard").classList.add("unlocked");
          } else {
            document.getElementById("user-type-indicator").textContent = "Basic User";
          }
        }
      })
      .catch(err => {
        console.error("Error verifying user:", err);
      });
    }
  </script>
</body>
</html>
