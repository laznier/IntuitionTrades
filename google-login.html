<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Sign-In Test</title>
  <style>
    /* Container that holds the sign-in button, right aligned */
    #google-signin-button {
      display: flex;
      justify-content: flex-end;
      margin: 20px;
    }
  </style>
</head>
<body>
  <!-- Div where the Google Sign-In button will be rendered -->
  <div id="google-signin-button"></div>

  <!-- Include the Google Identity Services JS Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    // Ensure this runs after the Google script has fully loaded
    window.onload = function() {
      google.accounts.id.initialize({
        client_id: "989729012898-33u478nul5lg3s6fvat2mk6ahgmp4pg5.apps.googleusercontent.com",
        // Use a callback function to capture the token
        callback: handleCredentialResponse
      });
      // Render the sign-in button
      google.accounts.id.renderButton(
        document.getElementById("google-signin-button"),
        {
          theme: "filled_black",
          size: "large",
          logo_alignment: "right"
        }
      );
    };

    // Callback function that receives the token and redirects to the callback page
    function handleCredentialResponse(response) {
      console.log("Encoded JWT ID token: " + response.credential);
      // Redirect to the callback page with the token appended as a query parameter.
      window.location.href = "/auth/callback?credential=" + encodeURIComponent(response.credential);
    }
  </script>
</body>
</html>
