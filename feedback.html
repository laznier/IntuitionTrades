<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback | Intuition Trades</title>
  <meta name="description" content="Send us your thoughts, suggestions, or questions." />
  <style>
    :root {
      --font-family: 'Arial', sans-serif;
      --text-color: #fff;
      --primary-bg: #333;
      --secondary-bg: #444;
      --section-bg: rgba(0, 0, 0, 0.33);
      --accent-color: #16a34a;
      --border-radius: 4px;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font-family);
      background-color: #111;
      color: var(--text-color);
      line-height: 1.6;
    }
    header, footer {
      background-color: var(--primary-bg);
      text-align: center;
      padding: 1rem;
    }
    .hero {
      text-align: center;
      padding: 3rem 1rem;
      background: rgba(0, 0, 0, 0.7);
    }
    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .hero p {
      color: #ccc;
    }
    .content-container {
      max-width: 600px;
      margin: 2rem auto;
      background: var(--section-bg);
      padding: 2rem;
      border-radius: var(--border-radius);
    }
    label {
      display: block;
      margin: 1rem 0 0.5rem;
      font-weight: bold;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: var(--border-radius);
      background-color: #222;
      color: #fff;
    }
    button {
      display: block;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--border-radius);
      cursor: pointer;
      margin: 0 auto;
    }
    button:hover {
      background-color: #128a3c;
    }
    .note {
      font-size: 0.9rem;
      color: #bbb;
      text-align: center;
      margin-top: 1rem;
    }
    footer ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding: 0;
      margin-top: 0.5rem;
    }
    footer ul a {
      color: #aaa;
      text-decoration: none;
    }
    footer ul a:hover {
      color: var(--accent-color);
    }
  </style>
</head>
<body>
  <header>
    <h1>Intuition Trades</h1>
  </header>

  <section class="hero">
    <h1>We'd Love Your Feedback</h1>
    <p>Share your thoughts, suggestions, or any issues you're experiencing.</p>
  </section>

  <main>
    <div class="content-container">
      <form action="https://formspree.io/f/mvgzdrgl" method="POST">
        <label for="name">Your Name (optional):</label>
        <input type="text" id="name" name="name" placeholder="e.g. John Doe" />

        <label for="email">Your Email (optional):</label>
        <input type="email" id="email" name="email" placeholder="example@domain.com" />

        <label for="message">Your Feedback:</label>
        <textarea id="message" name="message" rows="5" placeholder="Your feedback here..."></textarea>

        <button type="submit">Send Feedback</button>
      </form>

      <p class="note">For business or payment issues, please visit our <a href="/contact.html">contact page</a>.</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Intuition Trades. All rights reserved.</p>
    <ul>
      <li><a href="/privacy.html">Privacy</a></li>
      <li><a href="/terms.html">Terms</a></li>
      <li><a href="/disclaimer.html">Disclaimer</a></li>
      <li><a href="/contact.html">Contact</a></li>
    </ul>
  </footer>
</body>
</html>
