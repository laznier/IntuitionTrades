<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Intuition Trades | Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Minimal CSS for a YouTube-like UI -->
    <style>
      /* Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
      }
      
      /* Header styling similar to YouTube */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #222;
        padding: 10px 20px;
      }
      .site-title {
        font-size: 20px;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      /* Sign in area */
      #userDisplay {
        cursor: pointer;
        font-size: 16px;
      }
      /* We'll use a standard button that uses Google's official dark logo */
      #signInBtn {
        background: transparent;
        border: none;
        cursor: pointer;
      }
      /* Use an official Google dark logo provided by Google’s Identity documentation – update the src if needed */
      #signInBtn img {
        width: 24px;
        height: 24px;
      }
      /* Account dropdown (shown when user is signed in) */
      #accountDropdown {
        position: absolute;
        top: 50px;
        right: 20px;
        background: #222;
        border: 1px solid #444;
        padding: 10px;
        border-radius: 4px;
        display: none;
        z-index: 1000;
      }
      #accountDropdown a,
      #accountDropdown button {
        display: block;
        margin-bottom: 5px;
        background: none;
        border: none;
        color: #fff;
        text-align: left;
        cursor: pointer;
      }
      #accountDropdown a:hover,
      #accountDropdown button:hover {
        text-decoration: underline;
      }
      
      /* Main content area */
      main {
        padding: 20px;
      }
      .tool-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }
      .tool-card {
        background: #222;
        border: 1px solid #444;
        border-radius: 8px;
        width: 300px;
        padding: 15px;
        position: relative;
      }
      .tool-card h2 {
        margin-bottom: 10px;
      }
      .tool-card p {
        margin-bottom: 15px;
      }
      .tool-button {
        background: #16a34a;
        color: #fff;
        border: none;
        padding: 10px;
        width: 100%;
        border-radius: 4px;
        cursor: pointer;
      }
      /* Premium overlay for premium tool */
      .premium-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: #fff;
        z-index: 2;
      }
      /* When premium tool is unlocked, hide overlay */
      .unlocked .premium-overlay {
        display: none;
      }
      
      /* Footer */
      footer {
        text-align: center;
        padding: 10px;
        background: #222;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <div class="site-title">Intuition Trades</div>
      <!-- Header Right: Sign in area -->
      <div class="header-right">
        <!-- If not signed in, shows "Sign in" text and the official Google dark button -->
        <div id="userDisplay" onclick="location.href='login.html'">Sign in</div>
        <button id="signInBtn" onclick="location.href='login.html'">
          <!-- Official Google dark logo -->
          <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Sign-In">
        </button>
      </div>
      <!-- Account Dropdown (displayed if a user is signed in) -->
      <div id="accountDropdown">
        <a href="premium.html">Upgrade Membership</a>
        <a href="feedback.html">Send Feedback</a>
        <button id="signOutBtn">Sign Out</button>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <div class="tool-grid">
        <!-- Premium Tool Card -->
        <div class="tool-card premium" id="premiumTool">
          <h2>Premium Tool</h2>
          <p>This tool is available only for premium users.</p>
          <div class="premium-overlay">Premium Locked</div>
          <button class="tool-button" onclick="location.href='premium-tool.html'">Open Premium Tool</button>
        </div>
        <!-- Regular Tool Card -->
        <div class="tool-card basic">
          <h2>Regular Tool</h2>
          <p>This tool is available for all users.</p>
          <button class="tool-button" onclick="location.href='regular-tool.html'">Open Regular Tool</button>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 Intuition Trades. All rights reserved.</p>
    </footer>
    
    <!-- Firebase and Authentication Scripts -->
    <script type="module">
      // Import Firebase modules (v9+ modular SDK)
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
      import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
      
      // Firebase configuration (update these with your values)
      const firebaseConfig = {
        apiKey: "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
        authDomain: "persuasive-net-456607-g8.firebaseapp.com",
        projectId: "persuasive-net-456607-g8",
        storageBucket: "persuasive-net-456607-g8.appspot.com",
        messagingSenderId: "1019332250475",
        appId: "1:1019332250475:web:3b931ad7fd0a72e1949a2e",
        databaseURL: "https://persuasive-net-456607-g8-default-rtdb.firebaseio.com"
      };
      
      // Initialize Firebase
      const appFirebase = initializeApp(firebaseConfig);
      const auth = getAuth(appFirebase);
      const db = getDatabase(appFirebase);
      
      // Function to retrieve user role from the database (assumes a "role" field exists)
      async function getUserRole(uid) {
        try {
          const roleRef = ref(db, "users/" + uid + "/role");
          const snapshot = await get(roleRef);
          return snapshot.exists() ? snapshot.val() : "basic";
        } catch (error) {
          console.error("Error retrieving user role:", error);
          return "basic";
        }
      }
      
      // Check auth state and update header accordingly
      onAuthStateChanged(auth, async (user) => {
        const userDisplay = document.getElementById("userDisplay");
        const accountDropdown = document.getElementById("accountDropdown");
        const premiumTool = document.getElementById("premiumTool");
        if (user) {
          // User is signed in – update header display
          let displayName = user.displayName ? "Hello, " + user.displayName : "Basic User";
          // Get role from database
          const role = await getUserRole(user.uid);
          // For premium users, change display and unlock premium tool
          if (role === "premium") {
            userDisplay.textContent = displayName;
            userDisplay.style.color = "#00008B"; // dark blue
            userDisplay.style.fontWeight = "bold";
            // Unlock premium tool by removing the overlay (adding 'unlocked' class)
            premiumTool.classList.add("unlocked");
          } else {
            userDisplay.textContent = displayName;
            userDisplay.style.color = "#90EE90"; // light green
            userDisplay.style.fontWeight = "normal";
            // Keep premium tool locked
            premiumTool.classList.remove("unlocked");
          }
          // Show account dropdown on click of the user display
          userDisplay.onclick = () => {
            // Toggle dropdown visibility
            accountDropdown.style.display = (accountDropdown.style.display === "none" || accountDropdown.style.display === "") ? "block" : "none";
          };
          // Also remove sign-in redirection (since user is signed in)
          document.getElementById("signInBtn").onclick = () => {};
        } else {
          // Not signed in – show default "Sign in" text and style
          userDisplay.textContent = "Sign in";
          userDisplay.style.color = "";
          userDisplay.style.fontWeight = "";
          // Clicking header sign in area or button should redirect to login page
          userDisplay.onclick = () => { window.location.href = "login.html"; };
          document.getElementById("signInBtn").onclick = () => { window.location.href = "login.html"; };
          // Ensure premium tool remains locked (overlay visible)
          premiumTool.classList.remove("unlocked");
        }
      });
      
      // Sign out functionality for the account dropdown
      document.getElementById("signOutBtn").addEventListener("click", async () => {
        try {
          await signOut(auth);
          // After sign out, force a page reload (or update UI accordingly)
          window.location.reload();
        } catch (error) {
          console.error("Error signing out:", error);
        }
      });
    </script>
  </body>
</html>
