<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Tools Demo</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    /* Container for the sign-in indicator and button */
    #user-type-indicator {
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    .tool-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .tool-card {
      background: #333;
      padding: 20px;
      border-radius: 5px;
      position: relative;
      width: 250px;
    }
    .tool-card h2 {
      margin-top: 0;
    }
    .tool-card p {
      font-size: 0.95rem;
    }
    .tool-button {
      background: #005fa3;
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin-top: 10px;
    }
    /* The premium tool lock overlay */
    .premium-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 1.1rem;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <!-- Section to show if the signed-in user is Premium or Basic -->
  <div id="user-type-indicator"></div>
  <!-- Container for the Google Sign-In button -->
  <div id="google-signin-button"></div>

  <h1>Tool Demo</h1>
  <div class="tool-grid">
    <!-- Basic Tool Card (always available) -->
    <div class="tool-card basic">
      <h2>Basic Tool</h2>
      <p>This tool is available to every user.</p>
      <!-- Link to basic tool page -->
      <a href="/basic-tool" class="tool-button">Open Basic Tool</a>
    </div>
    <!-- Premium Tool Card (locked by default) -->
    <div class="tool-card premium">
      <h2>Premium Tool</h2>
      <p>This tool is locked for premium users only.</p>
      <!-- The premium overlay (lock) -->
      <div class="premium-overlay">
        Premium Locked
      </div>
      <!-- Button to trigger sign-in for premium tool -->
      <button class="tool-button" id="premiumToolButton">Open Premium Tool</button>
    </div>
  </div>

  <!-- Load Google Identity Services Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Consolidated Google Sign-In and Premium Flow Script -->
  <script>
    // Global flag to track if the premium tool button was clicked.
    let premiumToolClicked = false;

    // Initialize Google Sign-In when the window loads.
    window.onload = function() {
      google.accounts.id.initialize({
        client_id: "YOUR_CLIENT_ID_HERE",
        callback: handleCredentialResponse
      });
      // Render the standard Google sign-in button.
      const signInContainer = document.getElementById("google-signin-button");
      if (signInContainer) {
        google.accounts.id.renderButton(signInContainer, {
          theme: "filled_black",
          size: "large"
        });
      }
    };

    // Set up the premium tool button to trigger a sign-in prompt
    document.addEventListener("DOMContentLoaded", () => {
      const premiumButton = document.getElementById("premiumToolButton");
      if (premiumButton) {
        premiumButton.addEventListener("click", () => {
          premiumToolClicked = true;
          // Force a fresh sign-in prompt.
          google.accounts.id.prompt();
        });
      }
    });

    // The common Google sign-in callback.
    function handleCredentialResponse(response) {
      console.log("Received JWT token:", response.credential);
      // Send a POST request with the token to the backend verification endpoint.
      fetch('/api/verify-google', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ token: response.credential })
      })
      .then(res => res.json())
      .then(data => {
        console.log("Verification response:", data);
        if (premiumToolClicked) {
          // Premium tool flow.
          if (data.isPremium) {
            // Remove the premium overlay.
            document.querySelectorAll('.tool-card.premium .premium-overlay').forEach(el => {
              el.style.display = "none";
            });
            // Redirect to the premium tool page.
            window.location.href = "/premium-tool";
          } else {
            alert("Access denied – this tool is available for Premium Users only.");
            window.location.href = "/";
          }
          premiumToolClicked = false;
        } else {
          // Normal sign-in flow; update the user type indicator.
          if (data.isPremium) {
            document.getElementById('user-type-indicator').textContent = "Premium User";
          } else {
            document.getElementById('user-type-indicator').textContent = "Basic User";
          }
        }
      })
      .catch(err => {
        console.error("Error verifying user:", err);
        window.location.href = "/";
      });
    }
  </script>
</body>
</html>
