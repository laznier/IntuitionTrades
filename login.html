<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | Intuition Trades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    button {
      margin: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #22c55e;
    }
    #user-info {
      margin-top: 1.5rem;
      text-align: center;
    }
    #premium-tools {
      margin-top: 1rem;
      padding: 1rem;
      background: #1f2937;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Intuition Trades</h1>
  <p>Log in to access your tools and account</p>
  <button id="google-login">Sign in with Google</button>
  <button id="email-login">Sign in with Email</button>
  <button id="logout">Log out</button>
  <div id="user-info">Not signed in.</div>
  <div id="premium-tools">
    <h2>Premium Tools</h2>
    <p>Welcome to the premium section!</p>
    <!-- Add your premium tools here -->
  </div>

  <script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import {
      getDatabase,
      ref,
      set,
      get
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    // Your web app's Firebase configuration
    // NOTE: Replace "YOUR_DATABASE_NAME" with your actual database name from Firebase.
    const firebaseConfig = {
      apiKey: "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
      authDomain: "persuasive-net-456607-g8.firebaseapp.com",
      projectId: "persuasive-net-456607-g8",
      storageBucket: "persuasive-net-456607-g8.appspot.com",
      messagingSenderId: "1019332250475",
      appId: "1:1019332250475:web:3b931ad7fd0a72e1949a2e",
      // Update this to match your database URL from Firebase console:
      databaseURL: "https://intuitiontradesfinal.firebaseio.com"
    };

    // Initialize Firebase App
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // DOM elements
    const userInfo = document.getElementById("user-info");
    const premiumTools = document.getElementById("premium-tools");

    // Handle authenticated users:
    // This function checks if the user already exists in the database.
    // If not, it creates a new record with default role ("basic") and a timestamp.
    async function handleUser(user) {
      try {
        const userRef = ref(db, "users/" + user.uid);
        // Check if the user already exists in the database.
        const snapshot = await get(userRef);
        if (!snapshot.exists()) {
          // Create a new user record if one does not exist.
          await set(userRef, {
            email: user.email,
            role: "basic", // Default role. Upgrade manually in the database if needed.
            createdAt: Date.now()
          });
        }
        // Retrieve the updated user data.
        const updatedSnapshot = await get(userRef);
        const data = updatedSnapshot.val();
        userInfo.innerHTML = `
          <p>👤 Logged in as: <strong>${user.email}</strong></p>
          <p>🎖️ Role: <strong>${data.role}</strong></p>
        `;
        // Show premium tools if the user has a "premium" role.
        premiumTools.style.display = data.role === "premium" ? "block" : "none";
        console.log(`User ${user.email} signed in with role: ${data.role}`);
      } catch (error) {
        console.error("Error in handleUser:", error);
        alert("Error connecting to the database. Please check your connection and try again.");
      }
    }

    // Listen to authentication state changes.
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        await handleUser(user);
      } else {
        userInfo.innerHTML = "Not signed in.";
        premiumTools.style.display = "none";
      }
    });

    // Google sign-in button handler
    document.getElementById("google-login").onclick = async () => {
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        await handleUser(result.user);
      } catch (error) {
        console.error("Google sign-in error:", error);
        alert("Error during Google sign-in: " + error.message);
      }
    };

    // Email sign-in (or sign up if user does not exist)
    document.getElementById("email-login").onclick = async () => {
      const email = prompt("Enter your email:");
      const password = prompt("Enter your password:");
      try {
        const result = await signInWithEmailAndPassword(auth, email, password);
        await handleUser(result.user);
      } catch (error) {
        if (error.code === "auth/user-not-found") {
          if (confirm("User not found. Create account?")) {
            try {
              const result = await createUserWithEmailAndPassword(auth, email, password);
              await handleUser(result.user);
            } catch (creationError) {
              console.error("Error creating account:", creationError);
              alert("Error creating account: " + creationError.message);
            }
          }
        } else {
          console.error("Email sign-in error:", error);
          alert("Error during email sign-in: " + error.message);
        }
      }
    };

    // Logout button handler
    document.getElementById("logout").onclick = async () => {
      try {
        await signOut(auth);
        userInfo.innerHTML = "Signed out.";
      } catch (error) {
        console.error("Error signing out:", error);
        alert("Error signing out: " + error.message);
      }
    };
  </script>
</body>
</html>
