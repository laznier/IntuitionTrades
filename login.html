<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Intuition Trades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Minimal CSS for a Modern, User-Friendly Login Page -->
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-container {
      background: #222;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .login-container h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .login-form, .signup-form {
      display: none;
      flex-direction: column;
    }
    .login-form.active, .signup-form.active {
      display: flex;
    }
    .login-container input {
      margin-bottom: 10px;
      padding: 10px;
      border: none;
      border-radius: 4px;
    }
    .login-container button {
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #16a34a;
      color: #fff;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .google-button {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 10px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .google-button img {
      width: 20px;
      height: 20px;
      margin-right: 10px;
    }
    .toggle-link {
      text-align: center;
      color: #16a34a;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 10px;
    }
    .error-message {
      color: #dc3545;
      text-align: center;
      margin-bottom: 10px;
      display: none;
    }
    .back-link {
      text-align: center;
      color: #16a34a;
      text-decoration: underline;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Welcome to Intuition Trades</h1>
    <!-- Error message container -->
    <div class="error-message" id="errorMessage"></div>
    <!-- Login Form (default shown) -->
    <div class="login-form active" id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button id="loginBtn">Log In</button>
      <!-- Google Sign-In Button as an alternative -->
      <button class="google-button" id="googleLoginBtn">
        <img src="/images/google-icon.svg" alt="Google">
        Sign in with Google
      </button>
      <div class="toggle-link" id="toggleToSignUp">Don't have an account? Sign Up</div>
    </div>
    <!-- Signup Form -->
    <div class="signup-form" id="signupForm">
      <input type="email" id="signupEmail" placeholder="Email" required>
      <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" required>
      <button id="signupBtn">Sign Up</button>
      <!-- Google Sign-In Button on signup screen too -->
      <button class="google-button" id="googleSignupBtn">
        <img src="/images/google-icon.svg" alt="Google">
        Sign Up with Google
      </button>
      <div class="toggle-link" id="toggleToLogin">Already have an account? Log In</div>
    </div>
    <!-- Optional Back Link to Main Page (if user wants to browse without signing in) -->
    <div class="back-link" id="backToMain">Back to Home</div>
  </div>

  <!-- Firebase and Custom JS -->
  <script type="module">
    // Import Firebase modules (using modular SDK v9+)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    // Firebase configuration - replace with your project's config
    const firebaseConfig = {
  apiKey: "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
  authDomain: "persuasive-net-456607-g8.firebaseapp.com",
  projectId: "persuasive-net-456607-g8",
  storageBucket: "persuasive-net-456607-g8.appspot.com",
  messagingSenderId: "1019332250475",
  appId: "1:1019332250475:web:3b931ad7fd0a72e1949a2e",
  databaseURL: "https://persuasive-net-456607-g8-default-rtdb.firebaseio.com"
};

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const googleProvider = new GoogleAuthProvider();

    // DOM Element references
    const errorMessage = document.getElementById("errorMessage");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const toggleToSignUp = document.getElementById("toggleToSignUp");
    const toggleToLogin = document.getElementById("toggleToLogin");
    const backToMain = document.getElementById("backToMain");

    // Login elements
    const loginBtn = document.getElementById("loginBtn");
    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const googleLoginBtn = document.getElementById("googleLoginBtn");

    // Signup elements
    const signupBtn = document.getElementById("signupBtn");
    const signupEmail = document.getElementById("signupEmail");
    const signupPassword = document.getElementById("signupPassword");
    const googleSignupBtn = document.getElementById("googleSignupBtn");

    // Toggle login/signup view
    toggleToSignUp.addEventListener("click", () => {
      loginForm.classList.remove("active");
      signupForm.classList.add("active");
      clearError();
    });
    toggleToLogin.addEventListener("click", () => {
      signupForm.classList.remove("active");
      loginForm.classList.add("active");
      clearError();
    });
    backToMain.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.style.display = "block";
    }
    function clearError() {
      errorMessage.textContent = "";
      errorMessage.style.display = "none";
    }

    // Handle user data: create record if it does not exist.
    async function handleUserData(user) {
      const userRef = ref(db, "users/" + user.uid);
      const snapshot = await get(userRef);
      if (!snapshot.exists()) {
        await set(userRef, {
          email: user.email,
          role: "basic", // default role is "basic". If upgraded later, it can be changed.
          createdAt: Date.now()
        });
      }
    }

    // Redirect function after successful login/signup
    function redirectToMain() {
      window.location.href = "index.html";
    }

    // Login handler using email/password
    loginBtn.addEventListener("click", async () => {
      clearError();
      const email = loginEmail.value.trim();
      const password = loginPassword.value.trim();
      if (!email || !password) {
        showError("Please enter your email and password.");
        return;
      }
      try {
        const result = await signInWithEmailAndPassword(auth, email, password);
        await handleUserData(result.user);
        redirectToMain();
      } catch (error) {
        console.error("Login Error:", error);
        showError(error.message);
      }
    });

    // Signup handler using email/password
    signupBtn.addEventListener("click", async () => {
      clearError();
      const email = signupEmail.value.trim();
      const password = signupPassword.value.trim();
      if (!email || password.length < 6) {
        showError("Please enter a valid email and a password (minimum 6 characters).");
        return;
      }
      try {
        const result = await createUserWithEmailAndPassword(auth, email, password);
        await handleUserData(result.user);
        redirectToMain();
      } catch (error) {
        console.error("Signup Error:", error);
        showError(error.message);
      }
    });

    // Google sign in handler (for both login and signup)
    async function googleSignIn() {
      clearError();
      try {
        const result = await signInWithPopup(auth, googleProvider);
        await handleUserData(result.user);
        redirectToMain();
      } catch (error) {
        console.error("Google SignIn Error:", error);
        showError(error.message);
      }
    }
    googleLoginBtn.addEventListener("click", googleSignIn);
    googleSignupBtn.addEventListener("click", googleSignIn);

    // Automatically redirect if already signed in.
    onAuthStateChanged(auth, (user) => {
      if (user) {
        redirectToMain();
      }
    });
  </script>
</body>
</html>
