<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Login | Intuition Trades</title>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* RESET & BASE */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #111; color: #fff; font-family: Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    /* CONTAINER */
    .login-container {
      background: #222; padding: 2rem; border-radius: 8px;
      width: 100%; max-width: 360px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .login-container h1 {
      text-align: center; margin-bottom: 1.5rem;
    }
    .error-message {
      display: none; color: #dc3545;
      text-align: center; margin-bottom: 1rem;
    }
    /* FORMS */
    .login-form, .signup-form {
      display: none; flex-direction: column;
    }
    .login-form.active, .signup-form.active {
      display: flex;
    }
    .login-container input {
      margin-bottom: 1rem; padding: 0.75rem;
      border: none; border-radius: 4px; font-size: 1rem;
    }
    .login-container button {
      padding: 0.75rem; border: none; border-radius: 4px;
      background: #16a34a; color: #fff; font-size: 1rem;
      cursor: pointer; margin-bottom: 1rem;
    }
    /* LINKS */
    .toggle-link, .back-link {
      text-align: center; color: #16a34a; cursor: pointer;
      text-decoration: underline; font-size: 0.9rem;
    }
    .back-link { margin-top: 0.5rem; }
    /* TRIAL OVERLAY */
    .overlay {
      display: none; position: fixed; top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.8);
      justify-content: center; align-items: center;
      z-index: 1100;
    }
    .overlay.visible { display: flex; }
    .overlay-card {
      background: #222; padding: 2rem; border-radius: 8px;
      text-align: center; max-width: 360px; width: 90%;
    }
    .overlay-card h2 {
      margin-bottom: 1rem; font-size: 1.3rem;
    }
    .overlay-card p {
      margin-bottom: 1.5rem;
    }
    .overlay-actions button {
      margin: 0 .5rem; padding: .75rem 1.25rem;
      border-radius: 4px; font-size: 1rem; cursor: pointer;
    }
    #trialYesBtn { background: #16a34a; color: #fff; border: none; }
    #trialNoBtn  { background: transparent; color: #16a34a; border: 1px solid #16a34a; }
</style>
<body>
  <div class="login-container">
    <h1>Welcome to Intuition Trades</h1>
    <div class="error-message" id="errorMessage"></div>

    <!-- LOGIN FORM -->
    <div class="login-form active" id="loginForm">
      <input type="email"    id="loginEmail"    placeholder="Email"    required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button id="loginBtn">Sign In</button>
      <div class="custom-google-btn" id="googleLoginBtn">
        Sign in with Google
        <span class="google-circle-btn"></span>
      </div>

      <div class="toggle-link" id="toggleToSignUp">
        Don't have an account? Sign Up
      </div>
    </div>

    <!-- SIGNUP FORM -->
    <div class="signup-form" id="signupForm">
      <input type="text"     id="signupName"     placeholder="Name"                 required />
      <input type="email"    id="signupEmail"    placeholder="Email"                required />
      <input type="password" id="signupPassword" placeholder="Password"             required />
      <button id="signupBtn">Sign Up</button>
      <div class="custom-google-btn" id="googleSignupBtn">
        Create an account with Google
        <span class="google-circle-btn"></span>
      </div>

      <div class="toggle-link" id="toggleToLogin">
        Already have an account? Sign In
      </div>
    </div>

    <div class="back-link" id="backToMain">Back to Home</div>
  </div>

  <!-- 24‑HOUR TRIAL OVERLAY -->
  <div id="trialOverlay" class="overlay">
    <div class="overlay-card">
      <h2>Start Your 24‑Hour Premium Trial?</h2>
      <p>Get full access to premium tools for the next 24 hours.</p>
      <div class="overlay-actions">
        <button id="trialYesBtn">Yes, Start Trial</button>
        <button id="trialNoBtn">No, Thanks</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE & APP LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import {
      getDatabase,
      ref,
      get,
      set,
      update,
      query,
      orderByChild,
      equalTo
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    // --- Firebase init
    const firebaseConfig = {
      apiKey: "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
      authDomain: "persuasive‑net‑456607‑g8.firebaseapp.com",
      projectId: "persuasive-net-456607-g8",
      storageBucket: "persuasive-net-456607-g8.appspot.com",
      messagingSenderId: "1019332250475",
      appId: "1:1019332250475:web:3b931ad7fd0a72e1949a2e",
      databaseURL: "https://persuasive-net-456607-g8-default-rtdb.firebaseio.com"
    };
    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const db       = getDatabase(app);
    const provider = new GoogleAuthProvider();

    // --- Helpers
    const showError       = msg => {
      const el = document.getElementById("errorMessage");
      el.textContent = msg;
      el.style.display = "block";
    };
    const clearError      = () => {
      const el = document.getElementById("errorMessage");
      el.textContent = "";
      el.style.display = "none";
    };
    const redirectToMain  = () => window.location.href = "index.html";
    const showTrialOverlay= () => {
      document.getElementById("trialOverlay").classList.add("visible");
    };
    async function handleUserData(user, profile = {}) {
      const userRef = ref(db, `users/${user.uid}`);
      const snap    = await get(userRef);
      if (!snap.exists()) {
        await set(userRef, {
          email:     profile.email || user.email,
          name:      profile.name  || user.displayName || "",
          createdAt: Date.now(),
          role:      "basic"
        });
      }
    }

    let justSignedIn = false;

    window.addEventListener("DOMContentLoaded", () => {
      // 1) Email / Password Sign In
      document.getElementById("loginBtn").addEventListener("click", async () => {
        clearError();
        const email = document.getElementById("loginEmail").value.trim();
        const pass  = document.getElementById("loginPassword").value.trim();
        if (!email || !pass) return showError("Enter email and password.");
        try {
          justSignedIn = true;
          await signInWithEmailAndPassword(auth, email, pass);
        } catch (err) {
          showError(err.message);
        }
      });

      // 2) Email / Password Sign Up
      document.getElementById("signupBtn").addEventListener("click", async () => {
        clearError();
        const name  = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const pass  = document.getElementById("signupPassword").value.trim();
        if (!name) return showError("Please enter your name.");
        if (!email || pass.length < 6)
          return showError("Valid email + min 6‑char password.");
        try {
          justSignedIn = true;
          const res = await createUserWithEmailAndPassword(auth, email, pass);
          await handleUserData(res.user, { name, email });
          showTrialOverlay();
        } catch (err) {
          showError(err.message);
        }
      });

      // Delay binding of Google button handlers to ensure elements exist
      setTimeout(() => {
        // 3) Google Sign In (popup)
        document.getElementById("googleLoginBtn").addEventListener("click", async () => {
          clearError();
          try {
            justSignedIn = true;
            const result = await signInWithPopup(auth, provider);
            await handleUserData(result.user, {
              name:  result.user.displayName,
              email: result.user.email
            });
          } catch (err) {
            showError(err.message);
          }
        });

        // 4) Google Sign Up (popup + trial)
        document.getElementById("googleSignupBtn").addEventListener("click", async () => {
          clearError();
          try {
            justSignedIn = true;
            const result = await signInWithPopup(auth, provider);
            await handleUserData(result.user, {
              name:  result.user.displayName,
              email: result.user.email
            });
            showTrialOverlay();
          } catch (err) {
            showError(err.message);
          }
        });
      }, 100);

      // 5) Trial overlay actions
      document.getElementById("trialYesBtn").addEventListener("click", async () => {
        const user = auth.currentUser;
        if (!user) return;
        await update(ref(db, `users/${user.uid}`), {
          role:       "premium",
          trialStart: Date.now(),
          trialUsed:  true
        });
        document.getElementById("trialOverlay").classList.remove("visible");
        redirectToMain();
      });
      document.getElementById("trialNoBtn").addEventListener("click", () => {
        document.getElementById("trialOverlay").classList.remove("visible");
        redirectToMain();
      });

      // 6) Auth state listener
      onAuthStateChanged(auth, async user => {
        if (!user) return;
        if (justSignedIn) {
          const snap = await get(ref(db, `users/${user.uid}`));
          const data = snap.val() || {};
          if (!data.trialUsed) showTrialOverlay();
          else redirectToMain();
          justSignedIn = false;
        } else {
          redirectToMain();
        }
      });

      // 7) UI toggles
      document.getElementById("toggleToSignUp").addEventListener("click", () => {
        clearError();
        document.getElementById("loginForm").classList.remove("active");
        document.getElementById("signupForm").classList.add("active");
      });
      document.getElementById("toggleToLogin").addEventListener("click", () => {
        clearError();
        document.getElementById("signupForm").classList.remove("active");
        document.getElementById("loginForm").classList.add("active");
      });
      document.getElementById("backToMain").addEventListener("click", redirectToMain);
    });

    // delay so elements are guaranteed to exist
setTimeout(() => {
  // Sign‑In popup
  document
    .getElementById("googleLoginBtn")
    .addEventListener("click", async () => {
      clearError();
      justSignedIn = true;
      try {
        const result = await signInWithPopup(auth, provider);
        await handleUserData(result.user, {
          name:  result.user.displayName,
          email: result.user.email
        });
      } catch (err) {
        showError(err.message);
      }
    });

  // Sign‑Up popup + trial
  document
    .getElementById("googleSignupBtn")
    .addEventListener("click", async () => {
      clearError();
      justSignedIn = true;
      try {
        const result = await signInWithPopup(auth, provider);
        await handleUserData(result.user, {
          name:  result.user.displayName,
          email: result.user.email
        });
        showTrialOverlay();
      } catch (err) {
        showError(err.message);
      }
    });
}, 100);

  </script>
</body>
</html>
