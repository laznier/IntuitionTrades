<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Intuition Trades | Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Minimal CSS to mimic a YouTube-like interface -->
    <style>
      /* Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
      }
      /* Header styling */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #222;
        padding: 10px 20px;
        position: relative;
      }
      .site-title {
        font-size: 20px;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      /* Sign in area defaults (when not signed in) */
      #userDisplay {
        cursor: pointer;
        font-size: 16px;
      }
      /* Google sign-in button using the official dark logo */
      #signInBtn {
        background: none;
        border: none;
        cursor: pointer;
      }
      #signInBtn img {
        width: 24px;
        height: 24px;
      }
      /* Account dropdown (appears when user is signed in) */
      #accountDropdown {
        position: absolute;
        top: 50px;
        right: 20px;
        background: #222;
        border: 1px solid #444;
        padding: 10px;
        border-radius: 4px;
        display: none;
        z-index: 1000;
      }
      #accountDropdown a,
      #accountDropdown button {
        display: block;
        margin-bottom: 5px;
        background: none;
        border: none;
        color: #fff;
        text-align: left;
        cursor: pointer;
      }
      #accountDropdown a:hover,
      #accountDropdown button:hover {
        text-decoration: underline;
      }
      /* Main Content */
      main {
        padding: 20px;
      }
      .tool-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }
      .tool-card {
        background: #222;
        border: 1px solid #444;
        border-radius: 8px;
        width: 300px;
        padding: 15px;
        position: relative;
      }
      .tool-card h2 {
        margin-bottom: 10px;
      }
      .tool-card p {
        margin-bottom: 15px;
      }
      .tool-button {
        background: #16a34a;
        color: #fff;
        border: none;
        padding: 10px;
        width: 100%;
        border-radius: 4px;
        cursor: pointer;
      }
      /* Premium overlay styling */
      .premium-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: #fff;
        z-index: 2;
      }
      /* When the premium tool is unlocked, hide its overlay */
      .unlocked .premium-overlay {
        display: none;
      }
      /* Footer styling */
      footer {
        text-align: center;
        padding: 10px;
        background: #222;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <div class="site-title">Intuition Trades</div>
      <div class="header-right">
        <!-- Sign in display (when not signed in, shows "Sign in") -->
        <div id="userDisplay" onclick="location.href='login.html'">Sign in</div>
        <!-- Google button provided here (clicking it goes to login) -->
        <button id="signInBtn" onclick="location.href='login.html'">
          <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Sign-In">
        </button>
      </div>
      <!-- Account Dropdown (displayed when user is signed in) -->
      <div id="accountDropdown">
        <a href="premium-tool.html">Premium Tool</a>
        <a href="regular-tool.html">Regular Tool</a>
        <button id="signOutBtn">Sign Out</button>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <div class="tool-grid">
        <!-- Premium Tool Card -->
        <div class="tool-card premium" id="premiumTool">
          <h2>Premium Tool</h2>
          <p>This premium tool is exclusive for premium users.</p>
          <!-- The overlay is visible if the user is not premium. -->
          <div class="premium-overlay">Premium Locked</div>
          <button class="tool-button" onclick="location.href='premium-tool.html'">Open Premium Tool</button>
        </div>
        <!-- Regular Tool Card -->
        <div class="tool-card basic">
          <h2>Regular Tool</h2>
          <p>This tool is available for all users.</p>
          <button class="tool-button" onclick="location.href='regular-tool.html'">Open Regular Tool</button>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 Intuition Trades. All rights reserved.</p>
    </footer>

    <!-- Firebase and Authentication Script Section -->
    <script type="module">
      // Import Firebase modules using the modular SDK
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
      import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

      // Firebase configuration (update these values with your own project config)
      const firebaseConfig = {
        apiKey: "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
        authDomain: "persuasive-net-456607-g8.firebaseapp.com",
        projectId: "persuasive-net-456607-g8",
        storageBucket: "persuasive-net-456607-g8.appspot.com",
        messagingSenderId: "1019332250475",
        appId: "1:1019332250475:web:3b931ad7fd0a72e1949a2e",
        databaseURL: "https://persuasive-net-456607-g8-default-rtdb.firebaseio.com"
      };

      // Initialize Firebase
      const appFirebase = initializeApp(firebaseConfig);
      const auth = getAuth(appFirebase);
      const db = getDatabase(appFirebase);

      // Helper function: Get the user's role from Firebase Database (assumes "users/{uid}/role")
      async function getUserRole(uid) {
        try {
          const roleRef = ref(db, "users/" + uid + "/role");
          const snapshot = await get(roleRef);
          return snapshot.exists() ? snapshot.val() : "basic";
        } catch (error) {
          console.error("Error fetching user role:", error);
          return "basic";
        }
      }

      // Update header UI based on authentication state and user role.
      function updateHeader(user, role) {
        const userDisplay = document.getElementById("userDisplay");
        const accountDropdown = document.getElementById("accountDropdown");
        const premiumTool = document.getElementById("premiumTool");
        if (user) {
          // If user has a display name, greet them; otherwise show role info.
          let displayText = user.displayName ? "Hello, " + user.displayName : (role === "premium" ? "Premium User" : "Basic User");
          if (role === "premium") {
            userDisplay.textContent = displayText;
            userDisplay.style.color = "#00008B"; // dark blue for premium
            userDisplay.style.fontWeight = "bold";
            // Unlock premium tool by removing the overlay
            premiumTool.classList.add("unlocked");
          } else {
            userDisplay.textContent = displayText;
            userDisplay.style.color = "#90EE90"; // light green for basic user
            userDisplay.style.fontWeight = "normal";
            premiumTool.classList.remove("unlocked");
          }
          // Make the header user display clickable to toggle account dropdown.
          userDisplay.onclick = () => {
            accountDropdown.style.display = (accountDropdown.style.display === "block") ? "none" : "block";
          };
          // Also, remove the redirect behavior for sign-in buttons (since user is signed in)
          document.getElementById("signInBtn").onclick = () => {};
        } else {
          // Not signed in: display default text and style; clicking redirects to login.
          userDisplay.textContent = "Sign in";
          userDisplay.style.color = "";
          userDisplay.style.fontWeight = "";
          userDisplay.onclick = () => { window.location.href = "login.html"; };
          premiumTool.classList.remove("unlocked");
          accountDropdown.style.display = "none";
        }
      }

      // Listen for Firebase Authentication state changes.
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          const role = await getUserRole(user.uid);
          updateHeader(user, role);
        } else {
          updateHeader(null);
        }
      });

      // Sign-out functionality.
      document.getElementById("signOutBtn").addEventListener("click", async () => {
        try {
          await signOut(auth);
          window.location.reload();
        } catch (error) {
          console.error("Sign out error:", error);
        }
      });
    </script>
  </body>
</html>
