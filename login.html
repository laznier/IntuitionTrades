<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Intuition Trades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Include Google Identity Services script -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Minimal CSS for a Modern, User-Friendly Login Page -->
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-container {
      background: #222;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .login-container h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .login-form, .signup-form {
      display: none;
      flex-direction: column;
    }
    .login-form.active, .signup-form.active {
      display: flex;
    }
    .login-container input {
      margin-bottom: 10px;
      padding: 10px;
      border: none;
      border-radius: 4px;
    }
    .login-container button {
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #16a34a;
      color: #fff;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .toggle-link {
      text-align: center;
      color: #16a34a;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 10px;
    }
    .error-message {
      color: #dc3545;
      text-align: center;
      margin-bottom: 10px;
      display: none;
    }
    .back-link {
      text-align: center;
      color: #16a34a;
      text-decoration: underline;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Welcome to Intuition Trades</h1>
    <!-- Error message container -->
    <div class="error-message" id="errorMessage"></div>
    
    <!-- Login Form (default shown) -->
    <div class="login-form active" id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button id="loginBtn">Log In</button>
      <!-- Container where Google’s official dark button will be rendered -->
      <div id="googleButtonContainer" style="margin-bottom:10px;"></div>
      <div class="toggle-link" id="toggleToSignUp">Don't have an account? Sign Up</div>
    </div>
    
    <!-- Signup Form -->
    <div class="signup-form" id="signupForm">
      <input type="email" id="signupEmail" placeholder="Email" required>
      <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" required>
      <button id="signupBtn">Sign Up</button>
      <!-- Container for Google official button on signup as well -->
      <div id="googleButtonContainerSignup" style="margin-bottom:10px;"></div>
      <div class="toggle-link" id="toggleToLogin">Already have an account? Log In</div>
    </div>
    
    <!-- Optional Back Link to Main Page -->
    <div class="back-link" id="backToMain">Back to Home</div>
  </div>

  <!-- Firebase and Custom JS -->
  <script type="module">
    // Import Firebase modules (v9+ modular SDK)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    // Firebase configuration (update with your project's values)
    const firebaseConfig = {
      apiKey: "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
      authDomain: "persuasive-net-456607-g8.firebaseapp.com",
      projectId: "persuasive-net-456607-g8",
      storageBucket: "persuasive-net-456607-g8.appspot.com",
      messagingSenderId: "1019332250475",
      appId: "1:1019332250475:web:3b931ad7fd0a72e1949a2e",
      databaseURL: "https://persuasive-net-456607-g8-default-rtdb.firebaseio.com"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const googleProvider = new GoogleAuthProvider();

    // DOM Element references for login/signup
    const errorMessage = document.getElementById("errorMessage");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const toggleToSignUp = document.getElementById("toggleToSignUp");
    const toggleToLogin = document.getElementById("toggleToLogin");
    const backToMain = document.getElementById("backToMain");

    // Login elements
    const loginBtn = document.getElementById("loginBtn");
    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");

    // Signup elements
    const signupBtn = document.getElementById("signupBtn");
    const signupEmail = document.getElementById("signupEmail");
    const signupPassword = document.getElementById("signupPassword");

    // Toggle between login and signup views
    toggleToSignUp.addEventListener("click", () => {
      loginForm.classList.remove("active");
      signupForm.classList.add("active");
      clearError();
    });
    toggleToLogin.addEventListener("click", () => {
      signupForm.classList.remove("active");
      loginForm.classList.add("active");
      clearError();
    });
    backToMain.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.style.display = "block";
    }
    function clearError() {
      errorMessage.textContent = "";
      errorMessage.style.display = "none";
    }

    // Handle user data: create record if it does not exist.
    async function handleUserData(user) {
      const userRef = ref(db, "users/" + user.uid);
      const snapshot = await get(userRef);
      if (!snapshot.exists()) {
        await set(userRef, {
          email: user.email,
          role: "basic", // default role is "basic"
          createdAt: Date.now()
        });
      }
    }

    // Redirect to main page after successful login/signup.
    function redirectToMain() {
      window.location.href = "index.html";
    }

    // Email/Password Login
    loginBtn.addEventListener("click", async () => {
      clearError();
      const email = loginEmail.value.trim();
      const password = loginPassword.value.trim();
      if (!email || !password) {
        showError("Please enter your email and password.");
        return;
      }
      try {
        const result = await signInWithEmailAndPassword(auth, email, password);
        await handleUserData(result.user);
        redirectToMain();
      } catch (error) {
        console.error("Login Error:", error);
        showError(error.message);
      }
    });

    // Email/Password Signup
    signupBtn.addEventListener("click", async () => {
      clearError();
      const email = signupEmail.value.trim();
      const password = signupPassword.value.trim();
      if (!email || password.length < 6) {
        showError("Please enter a valid email and a password (min 6 characters).");
        return;
      }
      try {
        const result = await createUserWithEmailAndPassword(auth, email, password);
        await handleUserData(result.user);
        redirectToMain();
      } catch (error) {
        console.error("Signup Error:", error);
        showError(error.message);
      }
    });

    // Google Sign-In via Firebase (if using popup) – but here we are going to render the official Google button!
    async function googleSignInCallback(tokenResponse) {
      console.log("Received token: ", tokenResponse.credential);
      // Here you would typically send the token to your backend, then sign in to Firebase.
      // For simplicity, we'll use Firebase's signInWithPopup fallback:
      try {
        const result = await signInWithPopup(auth, googleProvider);
        await handleUserData(result.user);
        redirectToMain();
      } catch (error) {
        console.error("Google SignIn Error (popup fallback):", error);
        showError(error.message);
      }
    }

    // Render Google’s official dark button provided by Google Identity Services.
    window.onload = () => {
      // Initialize the Google Identity Services
      google.accounts.id.initialize({
        client_id: "YOUR_GOOGLE_CLIENT_ID",  // <-- Replace with your real client ID
        callback: googleSignInCallback
      });
      // Render Google's dark button (filled_dark)
      google.accounts.id.renderButton(
        document.getElementById("googleButtonContainer"),
        { theme: "filled_dark", size: "large" }
      );
      // Also render on the signup form if needed:
      google.accounts.id.renderButton(
        document.getElementById("googleButtonContainerSignup"),
        { theme: "filled_dark", size: "large" }
      );
    };

    // Automatically redirect if already signed in.
    onAuthStateChanged(auth, (user) => {
      if (user) {
        redirectToMain();
      }
    });
  </script>
</body>
</html>
