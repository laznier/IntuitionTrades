<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    /* Base reset */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-container {
      background: #222;
      padding: 2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      position: relative;
    }
    .login-container h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .error-message {
      display: none;
      color: #dc3545;
      text-align: center;
      margin-bottom: 1rem;
    }
    .login-form, .signup-form {
      display: none;
      flex-direction: column;
    }
    .login-form.active, .signup-form.active {
      display: flex;
    }
    .login-container input {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
    }
    .login-container button {
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      background: #16a34a;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 1rem;
    }
    .toggle-link, .back-link {
      text-align: center;
      color: #16a34a;
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.9rem;
    }
    .back-link {
      margin-top: 0.5rem;
    }
    /* Google Card Overlay */
    #googleCardOverlay {
  display: none;            /* hidden by default */
  position: fixed;
  top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.75);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}
#googleCardOverlay.visible {
  display: flex;
}

    .google-card {
      background: #222;
      padding: 2rem;
      border-radius: 8px;
      text-align: center;
      max-width: 320px;
      width: 90%;
    }
    .google-card h2 {
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }
    .google-card p {
      margin-bottom: 1.5rem;
      font-size: 1rem;
    }
    .google-card button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      background: #16a34a;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    /* Generic full‑page overlay */
.overlay {
  display: none;
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
  z-index: 1100;  /* above other UI */
}
.overlay.visible { display: flex; }

.overlay-card {
  background: #222;
  padding: 2rem;
  border-radius: 8px;
  text-align: center;
  max-width: 360px;
  width: 90%;
}
.overlay-card h2 {
  margin-bottom: 1rem;
  font-size: 1.3rem;
}
.overlay-card p {
  margin-bottom: 1.5rem;
}
.overlay-actions button {
  margin: 0 .5rem;
  padding: .75rem 1.25rem;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  cursor: pointer;
}
#trialYesBtn { background: #16a34a; color: #fff; }
#trialNoBtn  { background: transparent; color: #16a34a; border: 1px solid #16a34a; }

  </style>
</head>
<body>
  <div class="login-container">
    <h1>Welcome to Intuition Trades</h1>
    <div class="error-message" id="errorMessage"></div>

    <!-- Login Form -->
    <div class="login-form active" id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button id="loginBtn">Sign In</button>
      <div id="googleButtonContainer" style="margin-bottom:1rem;"></div>
      <div class="toggle-link" id="toggleToSignUp">Don't have an account? Sign Up</div>
    </div>

    <!-- Signup Form -->
    <div class="signup-form" id="signupForm">
      <input type="email" id="signupEmail" placeholder="Email" required />
      <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" required />
      <button id="signupBtn">Sign Up</button>
      <div id="googleButtonContainerSignup" style="margin-bottom:1rem;"></div>
      <div class="toggle-link" id="toggleToLogin">Already have an account? Sign In</div>
    </div>

    <div class="back-link" id="backToMain">Back to Home</div>
  </div>

  <!-- Google Account Confirmation Card -->
  <div id="googleCardOverlay" style="display:none;">
    <div class="google-card">
      <h2>Welcome, <span id="cardName"></span>!</h2>
      <p>Email: <span id="cardEmail"></span></p>
      <button id="confirmGoogleBtn">Continue</button>
    </div>
  </div>

    <!-- 24‑Hour Trial Offer Overlay (hidden by default) -->
    <div id="trialOverlay" class="overlay">
      <div class="overlay-card">
        <h2>Start Your 24‑Hour Premium Trial?</h2>
        <p>Get full access to premium tools for the next 24 hours.</p>
        <div class="overlay-actions">
          <button id="trialYesBtn">Yes, Start Trial</button>
          <button id="trialNoBtn">No, Thanks</button>
        </div>
      </div>
    </div>
</body>  
<script type="module">
  import { initializeApp } 
    from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
  import { getDatabase, ref, get, set, query, orderByChild, equalTo } 
    from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signInWithCredential,
    GoogleAuthProvider,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
  
  </script>

<script>

    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
      authDomain: "persuasive-net-456607-g8.firebaseapp.com",
      projectId: "persuasive-net-456607-g8",
      storageBucket: "persuasive-net-456607-g8.appspot.com",
      messagingSenderId: "1019332250475",
      appId: "1:1019332250475:web:3b931ad7fd0a72e1949a2e",
      databaseURL: "https://persuasive-net-456607-g8-default-rtdb.firebaseio.com"
    };

    // Initialize Firebase
    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getDatabase(app);
    const provider = new GoogleAuthProvider();

    // Helpers
    function showError(msg) {
      const el = document.getElementById("errorMessage");
      el.textContent = msg;
      el.style.display = "block";
    }
    function clearError() {
      const el = document.getElementById("errorMessage");
      el.textContent = "";
      el.style.display = "none";
    }
    async function handleUserData(user, profile={}) {
  const userRef = ref(db, "users/" + user.uid);
  const snap = await get(userRef);
  if (!snap.exists()) {
    await set(userRef, {
      email: user.email,
      name: profile.name || user.displayName || "",
      role:  "basic",
      createdAt: Date.now()
    });
  }
}
function redirectToMain() {
  window.location.href = "index.html";
}

function showTrialOverlay() {
  document.getElementById("trialOverlay")
          .classList.add("visible");
}
// after successful signInWithCredential or signInWithEmailAndPassword:
showTrialOverlay();


    // Toggle forms
    document.getElementById("toggleToSignUp").addEventListener("click", () => {
      clearError();
      document.getElementById("loginForm").classList.remove("active");
      document.getElementById("signupForm").classList.add("active");
    });
    document.getElementById("toggleToLogin").addEventListener("click", () => {
      clearError();
      document.getElementById("signupForm").classList.remove("active");
      document.getElementById("loginForm").classList.add("active");
    });
    document.getElementById("backToMain").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    // Email/Password sign in
    document.getElementById("loginBtn").addEventListener("click", async () => {
      clearError();
      const email = document.getElementById("loginEmail").value.trim();
      const pass  = document.getElementById("loginPassword").value.trim();
      if (!email || !pass) return showError("Enter email and password.");
      try {
        const res = await signInWithEmailAndPassword(auth, email, pass);
        await handleUserData(res.user);
        redirectToMain();
      } catch (err) {
        showError(err.message);
      }
    });

    // Email/Password sign up
    document.getElementById("signupBtn").addEventListener("click", async () => {
      clearError();
      const email = document.getElementById("signupEmail").value.trim();
      const pass  = document.getElementById("signupPassword").value.trim();
      if (!email || pass.length < 6) return showError("Valid email + min 6‑char password.");
      try {
        const res = await createUserWithEmailAndPassword(auth, email, pass);
        await handleUserData(res.user);
        redirectToMain();
      } catch (err) {
        showError(err.message);
      }
    });


// hold onto the raw GSI token
let pendingGoogleToken = null;
async function googleSignInCallback(resp) {
  pendingGoogleToken = resp.credential;   // ← this line is vital
  // … your signInWithCredential, handleUserData, then…
  showTrialOverlay();
}

function decodeJwt(token) {
  let b64 = token.split('.')[1]
    .replace(/-/g,'+').replace(/_/g,'/');
  while (b64.length % 4) b64 += '=';
  return JSON.parse(atob(b64));
}

async function googleSignInCallback(response) {
  try {
    // 1) Turn the GSI JWT into a Firebase credential
    const cred = GoogleAuthProvider.credential(response.credential);

    // 2) Sign in (or create) the Firebase user
    const result = await signInWithCredential(auth, cred);
    const user   = result.user;

    // 3) Decode the JWT to grab their name/email
    const payload = (() => {
      let b64 = response.credential.split('.')[1]
        .replace(/-/g,'+').replace(/_/g,'/');
      while (b64.length % 4) b64 += '=';
      return JSON.parse(atob(b64));
    })();

    // 4) Write their record if new (with name/email/role)
    await handleUserData(user, { name: payload.name, email: payload.email });

    // AFTER handleUserData()…
showTrialOverlay();

  } catch (err) {
    showError(err.message);
  }
}


document.getElementById('confirmGoogleBtn')
  .addEventListener('click', async () => {
    try {
      const cred = GoogleAuthProvider.credential(pendingGoogleToken);
      const res  = await signInWithCredential(auth, cred);
      await handleUserData(res.user);
      document.getElementById('googleCardOverlay')
              .classList.remove('visible');
      setTimeout(redirectToMain, 2000);
    } catch (err) {
      showError(err.message);
    }
  });


    // Initialize Google button and Firebase auth listener
    window.onload = () => {
      google.accounts.id.initialize({
        client_id: "989729012898-33u478nul5lg3s6fvat2mk6ahgmp4pg5.apps.googleusercontent.com",
        callback: googleSignInCallback
      });
      google.accounts.id.renderButton(
        document.getElementById("googleButtonContainer"),
        { theme: "filled_dark", size: "large" }
      );
      google.accounts.id.renderButton(
        document.getElementById("googleButtonContainerSignup"),
        { theme: "filled_dark", size: "large" }
      );

      onAuthStateChanged(auth, user => {
        if (user) redirectToMain();
      });
    };
    function showTrialOverlay() {
  document.getElementById('trialOverlay')
          .classList.add('visible');
}

// when they click “Yes”
document.getElementById('trialYesBtn')

// when they click “No”
document.getElementById('trialNoBtn')
  .addEventListener('click', () => {

  });

  </script>
</body>
</html>
