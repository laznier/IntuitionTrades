<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Login | Intuition Trades</title>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    /* RESET & BASE */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* CONTAINER */
    .login-container {
      background: #222;
      padding: 2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .login-container h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }
    .error-message {
      display: none;
      color: #dc3545;
      text-align: center;
      margin-bottom: 1rem;
    }

    /* FORMS */
    .login-form, .signup-form {
      display: none;
      flex-direction: column;
    }
    .login-form.active, .signup-form.active {
      display: flex;
    }
    .login-container input {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
    }

    /* BUTTON-LINKS */
    .login-container .login-btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      background: #16a34a;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 1rem;
    }
    .login-container .login-btn:hover {
      background: #22c55e;
    }

    /* TOGGLE LINKS */
    .toggle-link, .back-link {
      text-align: center;
      color: #16a34a;
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.9rem;
    }
    .back-link {
      margin-top: 0.5rem;
    }

    /* TRIAL OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1100;
    }
    .overlay.visible {
      display: flex;
    }
    .overlay-card {
      background: #222;
      padding: 2rem;
      border-radius: 8px;
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    .overlay-card h2 {
      margin-bottom: 1rem;
      font-size: 1.3rem;
    }
    .overlay-card p {
      margin-bottom: 1.5rem;
    }
    .overlay-actions button {
      margin: 0 .5rem;
      padding: .75rem 1.25rem;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    #trialYesBtn {
      background: #16a34a;
      color: #fff;
      border: none;
    }
    #trialNoBtn {
      background: transparent;
      color: #16a34a;
      border: 1px solid #16a34a;
    }

    /* Google Circle Icon */
    .google-circle-btn {
      display: inline-block;
      width: 35px; height: 35px;
      margin-right: 8px;
      background-color: #000;
      background-image: url('/google-icons/png@3x/dark/web_dark_rd_na@3x.png');
      background-repeat: no-repeat;
      background-size: 35px;
      background-position: center;
      border-radius: 50%;
      cursor: pointer;
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h1>Welcome to Intuition Trades</h1>
    <div class="error-message" id="errorMessage"></div>

    <!-- LOGIN FORM -->
    <div class="login-form active" id="loginForm">
      <input type="email"    id="loginEmail"    placeholder="Email"    required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <div style="display:flex; align-items:center; margin-bottom:1rem;">
        <div class="google-circle-btn" id="googleSignInBtn" aria-label="Sign in with Google"></div>
        <a href="#" class="login-btn" id="emailSignInBtn">Sign In</a>
      </div>
      <div class="toggle-link" id="toggleToSignUp">
        Don't have an account? Sign Up
      </div>
    </div>

    <!-- SIGNUP FORM -->
    <div class="signup-form" id="signupForm">
      <input type="text"     id="signupName"     placeholder="Name"     required />
      <input type="email"    id="signupEmail"    placeholder="Email"    required />
      <input type="password" id="signupPassword" placeholder="Password" required />
      <div style="display:flex; align-items:center; margin-bottom:1rem;">
        <div class="google-circle-btn" id="googleSignUpBtn" aria-label="Sign up with Google"></div>
        <a href="#" class="login-btn" id="emailSignUpBtn">Sign Up</a>
      </div>
      <div class="toggle-link" id="toggleToLogin">
        Already have an account? Sign In
      </div>
    </div>
    <div class="back-link" id="backToMain">Back to Home</div>
    <!-- Resend Verification Button -->
    <div style="text-align:center; margin-top:1rem;">
      <button id="resendVerifyBtn" style="background:none; border:1px solid #16a34a; color:#16a34a; padding:0.5rem 1rem; border-radius:4px; cursor:pointer; font-size:0.9rem;">
        Resend Verification Email
      </button>
    </div>
    

  </div>

  <!-- 24‑HOUR TRIAL OVERLAY -->
  <div id="trialOverlay" class="overlay">
    <div class="overlay-card">
      <h2>Start Your 24‑Hour Premium Trial?</h2>
      <p>Get full access to premium tools for the next 24 hours.</p>
      <div class="overlay-actions">
        <button id="trialYesBtn">Yes, Start Trial</button>
        <button id="trialNoBtn">No, Thanks</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
      onAuthStateChanged,
      sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import {
      getDatabase,
      ref,
      get,
      set,
      update
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
    
    // --- Firebase init
    const firebaseConfig = {
      apiKey: "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
      authDomain: "persuasive-net-456607-g8.firebaseapp.com",
      projectId: "persuasive-net-456607-g8",
      storageBucket: "persuasive-net-456607-g8.appspot.com",
      messagingSenderId: "1019332250475",
      appId: "1:1019332250475:web:3b931ad7fd0a72e1949a2e",
      databaseURL: "https://persuasive-net-456607-g8-default-rtdb.firebaseio.com"
    };
    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const db       = getDatabase(app);
    const provider = new GoogleAuthProvider();
  
    // --- Helpers
    const showError        = msg => {
      const el = document.getElementById("errorMessage");
      el.textContent = msg;
      el.style.display = "block";
    };
    const clearError       = () => {
      const el = document.getElementById("errorMessage");
      el.textContent = "";
      el.style.display = "none";
    };
    const redirectToMain   = () => window.location.href = "index.html";
    const showTrialOverlay = () => document.getElementById("trialOverlay").classList.add("visible");
  
    async function handleUserData(user, profile = {}) {
      const userRef = ref(db, `users/${user.uid}`);
      const snap    = await get(userRef);
      if (!snap.exists()) {
        await set(userRef, {
          email:     profile.email || user.email,
          name:      profile.name  || user.displayName || "",
          createdAt: Date.now(),
          role:      "basic"
        });
      }
    }
  
    let justSignedIn = false;
  
    window.addEventListener("DOMContentLoaded", () => {
      // Sign‑In with Email
      document.getElementById("emailSignInBtn").addEventListener("click", async e => {
        e.preventDefault();
        clearError();
        const email = document.getElementById("loginEmail").value.trim();
        const pass  = document.getElementById("loginPassword").value.trim();
        if (!email || !pass) return showError("Enter email and password.");
        try {
          justSignedIn = true;
          await signInWithEmailAndPassword(auth, email, pass);
          const idToken = await auth.currentUser.getIdToken();
          localStorage.setItem("googleToken", idToken);
        } catch (err) {
          showError(err.message);
        }
      });
  
      // Sign‑Up with Email
      document.getElementById("emailSignUpBtn").addEventListener("click", async e => {
        e.preventDefault();
        clearError();
        const name  = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const pass  = document.getElementById("signupPassword").value.trim();
        if (!name) return showError("Please enter your name.");
        if (!email || pass.length < 6)
          return showError("Valid email + min 6‑char password.");
        try {
          justSignedIn = true;
          const res = await createUserWithEmailAndPassword(auth, email, pass);
await handleUserData(res.user, { name, email });

await sendEmailVerification(res.user); // ✉️ Send email
alert("Verification email sent. Please check your inbox.");

showTrialOverlay();

          // ← INSERT TOKEN GRAB / STORE HERE
          const idToken = await auth.currentUser.getIdToken();
          localStorage.setItem("googleToken", idToken);
        } catch (err) {
          showError(err.message);
        }
      });
  
      // Google Sign‑In / Sign‑Up
      document.getElementById("googleSignInBtn").addEventListener("click", async e => {
        e.preventDefault();
        clearError();
        try {
          justSignedIn = true;
          const result = await signInWithPopup(auth, provider);
          await handleUserData(result.user, {
            name:  result.user.displayName,
            email: result.user.email
          });
          const idToken = await auth.currentUser.getIdToken();
          localStorage.setItem("googleToken", idToken);
        } catch (err) {
          showError(err.message);
        }
      });
      document.getElementById("googleSignUpBtn").addEventListener("click", async e => {
        e.preventDefault();
        clearError();
        try {
          justSignedIn = true;
          const result = await signInWithPopup(auth, provider);
          await handleUserData(result.user, {
            name:  result.user.displayName,
            email: result.user.email
          });
          const idToken = await auth.currentUser.getIdToken();
          localStorage.setItem("googleToken", idToken);
          showTrialOverlay();
        } catch (err) {
          showError(err.message);
        }
      });
  
      // Trial overlay actions
      document.getElementById("trialYesBtn").addEventListener("click", async () => {
        const user = auth.currentUser;
        if (!user) return;
        await update(ref(db, `users/${user.uid}`), {
          role:       "premium",
          trialStart: Date.now(),
          trialUsed:  true
        });
        document.getElementById("trialOverlay").classList.remove("visible");
        redirectToMain();
      });
      document.getElementById("trialNoBtn").addEventListener("click", () => {
        document.getElementById("trialOverlay").classList.remove("visible");
        redirectToMain();
      });
  
      // Auth state listener
      onAuthStateChanged(auth, async user => {
  if (!user) return;

  if (!user.emailVerified) {
    showError("Please verify your email before accessing the site.");
    return auth.signOut(); // prevent access
  }

  if (justSignedIn) {
    const snap = await get(ref(db, `users/${user.uid}`));
    const data = snap.val() || {};
    if (!data.trialUsed) showTrialOverlay();
    else redirectToMain();
    justSignedIn = false;
  } else {
    redirectToMain();
  }
});
  
document.getElementById("resendVerifyBtn").addEventListener("click", async () => {
  const user = auth.currentUser;
  if (user && !user.emailVerified) {
    await sendEmailVerification(user);
    alert("Verification email resent.");
  }
});

      // UI toggles
      document.getElementById("toggleToSignUp").addEventListener("click", () => {
        clearError();
        document.getElementById("loginForm").classList.remove("active");
        document.getElementById("signupForm").classList.add("active");
      });
      document.getElementById("toggleToLogin").addEventListener("click", () => {
        clearError();
        document.getElementById("signupForm").classList.remove("active");
        document.getElementById("loginForm").classList.add("active");
      });
  
      // Back to home
      document.getElementById("backToMain").addEventListener("click", redirectToMain);
    });
  </script>
