<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Login | Intuition Trades</title>
  <!-- only *one* GSI load, with an onload -->
  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
    onload="initGSI()"
  ></script>
  <style>/* …your CSS… */</style>
</head>
<body>
  <div class="login-container">
    <!-- …your login form markup… -->
    <div id="googleButtonContainer"></div>
    <div id="googleButtonContainerSignup"></div>
  </div>

  <script>
    // replace with your *actual* client ID
    const GOOGLE_CLIENT_ID = "989729012898-33u478nul5lg3s6fvat2mk6ahgmp4pg5.apps.googleusercontent.com";

    function initGSI() {
      // now that the GSI code is loaded...
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById("googleButtonContainer"),
        { theme: "filled_dark", size: "large" }
      );
      google.accounts.id.renderButton(
        document.getElementById("googleButtonContainerSignup"),
        { theme: "filled_dark", size: "large" }
      );
    }

    // your callback when a user signs in with Google
    async function handleGoogleCredentialResponse(response) {
      try {
        // turn the JWT into a Firebase credential, etc.
        const cred = google.accounts.id.credential(response.credential);
        // …your existing signInWithCredential logic…
      } catch (err) {
        console.error(err);
      }
    }
  </script>

  <!-- your Firebase & app logic here; do NOT re-initialize GSI there -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signInWithCredential, GoogleAuthProvider, /*…*/ } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    // …
  </script>
</body>
</html>
