  <script>
    /***************************************
     * AUTOCOMPLETE FUNCTIONS
     ***************************************/
    let debounceTimeout;
    function clearSuggestions() {
      const list = document.getElementById('ticker-suggestions');
      if (list) {
        list.innerHTML = '';
        list.style.display = 'none';
      }
      const fullNameElem = document.getElementById('company-full-name');
      if (fullNameElem) {
        fullNameElem.innerText = '';
      }
    }
    async function fetchTickerSuggestions(searchQuery) {
      try {
        const response = await fetch(`/api/ticker?query=${encodeURIComponent(searchQuery)}`);
        if (!response.ok) {
          throw new Error(`API error: ${response.statusText}`);
        }
        const data = await response.json();
        return data.bestMatches || [];
      } catch (error) {
        console.error("Error fetching ticker suggestions:", error);
        return [];
      }
    }
    function renderTickerSuggestions(suggestions) {
      const list = document.getElementById('ticker-suggestions');
      list.innerHTML = '';
      if (!suggestions || suggestions.length === 0) {
        list.style.display = 'none';
        return;
      }
      list.style.display = 'block';
      suggestions.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="ticker-symbol">${item["1. symbol"]}</span> <span class="company-name">(${item["2. name"]})</span>`;
        li.addEventListener('click', () => {
          document.getElementById('ticker').value = item["1. symbol"];
          const fullNameElem = document.getElementById('company-full-name');
          if (fullNameElem) {
            fullNameElem.innerText = item["2. name"];
          }
          clearSuggestions();
        });
        list.appendChild(li);
      });
    }

    /***************************************
     * 1) DATA FETCH FUNCTIONS
     ***************************************/
    async function fetchIntradayData(symbol, interval, outputsize = "compact") {
      const response = await fetch(`/api/intraday?symbol=${symbol}&interval=${interval}&outputsize=${outputsize}`);
      return response.json();
    }
    async function fetchHistoricalData(symbol) {
      const response = await fetch(`/api/historical?symbol=${symbol}&outputsize=full`);
      return response.json();
    }

    /***************************************
     * 2) DATA PARSE FUNCTIONS
     ***************************************/
    function parseIntradayData(data, interval) {
      const seriesKey = `Time Series (${interval})`;
      const raw = data[seriesKey];
      if (!raw) return [];
      let points = [];
      for (const timestamp in raw) {
        const rec = raw[timestamp];
        const date = new Date(timestamp.replace(" ", "T"));
        points.push({
          x: date.getTime(),
          y: parseFloat(rec["4. close"]),
          open: parseFloat(rec["1. open"]),
          high: parseFloat(rec["2. high"]),
          low: parseFloat(rec["3. low"]),
          close: parseFloat(rec["4. close"]),
          volume: parseInt(rec["5. volume"], 10),
          original: timestamp
        });
      }
      points.sort((a, b) => a.x - b.x);
      return points;
    }
    function parseHistoricalData(data) {
      const seriesKey = Object.keys(data).find(key => key.startsWith("Time Series"));
      const raw = data[seriesKey];
      if (!raw) return [];
      let points = [];
      for (const dateStr in raw) {
        const rec = raw[dateStr];
        const date = new Date(dateStr);
        points.push({
          x: date.getTime(),
          y: parseFloat(rec["4. close"]),
          open: parseFloat(rec["1. open"]),
          high: parseFloat(rec["2. high"]),
          low: parseFloat(rec["3. low"]),
          close: parseFloat(rec["4. close"]),
          volume: parseInt(rec["6. volume"] || rec["5. volume"], 10),
          original: dateStr
        });
      }
      points.sort((a, b) => a.x - b.x);
      return points;
    }

    /***************************************
     * 3) FILTERING DATA BY RANGE
     ***************************************/
    function filterDataForRange(points, range) {
      const now = new Date();
      let fromDate;
      switch (range) {
        case "1D":
          fromDate = new Date(now.getTime() - 24 * 60 * 60 * 1000);
          break;
        case "5D":
          fromDate = new Date(now.getTime() - 5 * 24 * 60 * 60 * 1000);
          break;
        case "1M":
          fromDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
          break;
        case "6M":
          fromDate = new Date(now.getTime() - 180 * 24 * 60 * 60 * 1000);
          break;
        case "YTD":
          fromDate = new Date(now.getFullYear(), 0, 1);
          break;
        case "1Y":
          fromDate = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
          break;
        case "5Y":
          fromDate = new Date(now.getTime() - 5 * 365 * 24 * 60 * 60 * 1000);
          break;
        default:
          fromDate = new Date(now.getTime() - 1 * 24 * 60 * 60 * 1000);
      }
      return points.filter(p => p.x >= fromDate.getTime());
    }

    /***************************************
     * 4) TOP BAR UPDATE
     ***************************************/
    function updateTopBar(points, symbol) {
      if (points.length < 2) return;
      const first = points[0];
      const last = points[points.length - 1];
      const diff = last.close - first.close;
      const pct = (diff / first.close) * 100;

      document.getElementById('priceInfo').textContent = `${symbol.toUpperCase()} ${last.close.toFixed(2)}`;
      const changeEl = document.getElementById('changeInfo');
      if (diff >= 0) {
        changeEl.textContent = `+${diff.toFixed(2)} (+${pct.toFixed(2)}%)`;
        changeEl.style.color = "#16a34a";
      } else {
        changeEl.textContent = `${diff.toFixed(2)} (${pct.toFixed(2)}%)`;
        changeEl.style.color = "#dc2626";
      }
      document.getElementById('timeInfo').textContent = `As of ${last.original} US/Eastern`;
    }

    /***************************************
     * 5) ZIGZAG + OLS FITTING HELPERS
     ***************************************/
    // 5.1 ZigZag pivot detection (5% threshold)
    function computeZigZag(points, threshold = 0.05) {
      if (!points.length) return [];
      const pivots = [{ ...points[0] }];
      let lastPivot = points[0].y;
      let trend = null;

      for (let i = 1; i < points.length; i++) {
        const price = points[i].y;
        const time = points[i].x;

        if (trend === null || trend === 'down') {
          if (price > lastPivot * (1 + threshold)) {
            pivots.push({ x: time, y: price });
            lastPivot = price;
            trend = 'up';
          }
        }
        if (trend === null || trend === 'up') {
          if (price < lastPivot * (1 - threshold)) {
            pivots.push({ x: time, y: price });
            lastPivot = price;
            trend = 'down';
          }
        }
      }
      return pivots;
    }

    // 5.2 Split into swing-highs and swing-lows
    function splitHighsLows(pivots) {
      const highs = [];
      const lows = [];
      for (let i = 1; i < pivots.length - 1; i++) {
        const p = pivots[i].y;
        if (p > pivots[i - 1].y && p > pivots[i + 1].y) {
          highs.push(pivots[i]);
        }
        if (p < pivots[i - 1].y && p < pivots[i + 1].y) {
          lows.push(pivots[i]);
        }
      }
      return { highs, lows };
    }

    // 5.3 Ordinary Least Squares line fit
    function computeOLSLine(points) {
      const n = points.length;
      if (n < 2) return null;
      let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
      for (const p of points) {
        sumX += p.x;
        sumY += p.y;
        sumXY += p.x * p.y;
        sumX2 += p.x * p.x;
      }
      const m = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
      const b = (sumY - m * sumX) / n;
      return { m, b };
    }

    /***************************************
     * 6) CHART PLOTTING WITH TRENDLINES
     ***************************************/
    function plotChart(points, symbol, range) {
      // Compute pivots
      const pivots = computeZigZag(points, 0.05);
      const { highs, lows } = splitHighsLows(pivots);

      // Fit lines
      const highLine = computeOLSLine(highs);
      const lowLine  = computeOLSLine(lows);

      // Prepare price series
      let seriesData, chartType, seriesOptions = {};
      if (["1D","5D","1M","YTD"].includes(range)) {
        seriesData = points.map(p => [p.x, p.y]);
        chartType = 'line';
        const fc = points[0].close, lc = points[points.length - 1].close;
        const color = lc > fc ? 'green' : lc < fc ? 'red' : 'blue';
        seriesOptions = {
          color,
          fillColor: Highcharts.color(color).setOpacity(0.15).get()
        };
      } else {
        seriesData = points.map(p => [p.x, p.open, p.high, p.low, p.close]);
        chartType = 'candlestick';
        seriesOptions = { color: 'red', upColor: 'green' };
      }

      // Compute x-extents
      const xMin = points[0].x, xMax = points[points.length - 1].x;
      const upperLineData = highLine ? [
        [xMin, highLine.m * xMin + highLine.b],
        [xMax, highLine.m * xMax + highLine.b]
      ] : [];
      const lowerLineData = lowLine ? [
        [xMin, lowLine.m * xMin + lowLine.b],
        [xMax, lowLine.m * xMax + lowLine.b]
      ] : [];

      // Render chart
      Highcharts.stockChart('chart', {
        chart: {
          backgroundColor: 'transparent',
          pinchType: 'x',
          panning: { enabled: true, type: 'x' },
          zooming: { type: 'x' },
          events: {
            load() {
              const chart = this;
              const series = chart.series[0];
              const pts = series.points;
              if (!pts || !pts.length) return;

              const lastPoint = pts[pts.length - 1];
              const lastPrice = series.type === 'candlestick' ? lastPoint.close : lastPoint.y;
              const lineY = series.type === 'candlestick'
                ? chart.plotTop + lastPoint.plotClose
                : chart.plotTop + lastPoint.plotY;

              // Static last price line
              chart.renderer.path([
                'M', chart.plotLeft, lineY,
                'L', chart.plotLeft + chart.plotWidth, lineY
              ]).attr({
                'stroke-width': 1,
                stroke: 'gray',
                dashstyle: 'Dash'
              }).add();

              // Last price label
              chart.renderer.text(
                lastPrice.toFixed(2),
                chart.plotLeft + chart.plotWidth + 5,
                lineY + 4
              ).css({ color: 'gray' }).add();

              // Crosshair
              chart.crosshairLine = chart.renderer.path().attr({
                'stroke-width': 1,
                stroke: 'black',
                dashstyle: 'Solid'
              }).add();

              chart.crosshairLabel = chart.renderer.text('', chart.plotLeft + chart.plotWidth + 5, chart.plotTop)
                .css({ color: 'black' }).add();

              Highcharts.addEvent(chart.container, 'mousemove', function (e) {
                const event = chart.pointer.normalize(e);
                const yVal = chart.yAxis[0].toValue(event.chartY, false);
                const yPix = chart.yAxis[0].toPixels(yVal, true);

                chart.crosshairLine.attr({
                  d: ['M', chart.plotLeft, yPix, 'L', chart.plotLeft + chart.plotWidth, yPix]
                });

                chart.crosshairLabel.attr({
                  text: yVal.toFixed(2),
                  x: chart.plotLeft + chart.plotWidth + 5,
                  y: yPix + 4
                });
              });

              Highcharts.addEvent(chart.container, 'mouseleave', function () {
                chart.crosshairLine.attr({ d: [] });
                chart.crosshairLabel.attr({ text: '' });
              });
            }
          }
        },
        time:       { useUTC: false },
        accessibility:{ enabled: false },
        rangeSelector:{ enabled: false },
        title:      { text: `${symbol.toUpperCase()} Price` },
        xAxis:      { type: 'datetime', maxPadding: 0 },
        yAxis:      { title: { text: 'Price' } },
        tooltip:    {
          split: false,
          shared: true,
          xDateFormat: '%Y-%m-%d %H:%M:%S',
          followTouchMove: true
        },
        series: [
          {
            name: symbol.toUpperCase(),
            data: seriesData,
            type: chartType,
            tooltip: { valueDecimals: 2 },
            ...seriesOptions
          },
          ...upperLineData.length ? [{
            name: 'Resistance',
            data: upperLineData,
            type: 'line',
            color: 'red',
            dashStyle: 'Dash',
            marker: { enabled: false },
            enableMouseTracking: false,
            lineWidth: 2,
            zIndex: 3
          }] : [],
          ...lowerLineData.length ? [{
            name: 'Support',
            data: lowerLineData,
            type: 'line',
            color: 'green',
            dashStyle: 'Dash',
            marker: { enabled: false },
            enableMouseTracking: false,
            lineWidth: 2,
            zIndex: 3
          }] : []
        ],
        navigator: { enabled: true, margin: 0 },
        scrollbar: { enabled: true, height: 14 },
        credits: { enabled: false }
      });
    }

    /***************************************
     * 7) MAIN LOAD FUNCTION
     ***************************************/
    let currentRange = "1D";
    async function loadChart() {
      const symbol = document.getElementById('ticker').value.trim() || "SPY";
      document.getElementById('loading').style.display = 'block';
      try {
        let rawData, points;
        if (currentRange === "1D") {
          rawData = await fetchIntradayData(symbol, "1min", "full");
          points  = parseIntradayData(rawData, "1min");
        } else if (currentRange === "5D") {
          rawData = await fetchIntradayData(symbol, "5min", "full");
          points  = parseIntradayData(rawData, "5min");
        } else if (currentRange === "1M") {
          rawData = await fetchIntradayData(symbol, "60min", "full");
          points  = parseIntradayData(rawData, "60min");
        } else {
          rawData = await fetchHistoricalData(symbol);
          points  = parseHistoricalData(rawData);
        }

        // Filter and render
        points = filterDataForRange(points, currentRange);
        if (!points.length) {
          document.getElementById('noDataMsg').style.display = 'block';
          document.getElementById('chart').innerHTML = '';
          return;
        } else {
          document.getElementById('noDataMsg').style.display = 'none';
        }

        plotChart(points, symbol, currentRange);
        updateTopBar(points, symbol);
      } catch (err) {
        console.error("Error loading data:", err);
        alert("Failed to load data.");
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    /***************************************
     * 8) RANGE TABS & AUTO UPDATE
     ***************************************/
    document.querySelectorAll(".rangeTab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".rangeTab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentRange = tab.getAttribute("data-range");
        loadChart();
      });
    });
    document.getElementById('loadBtn').addEventListener('click', loadChart);
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const t = params.get('ticker');
      if (t) document.getElementById('ticker').value = t;
      loadChart();
      setInterval(loadChart, 60000);
    });

    /***************************************
     * 9) TICKER AUTOCOMPLETE INIT
     ***************************************/
    document.addEventListener("DOMContentLoaded", () => {
      const inp = document.getElementById('ticker');
      inp.addEventListener('input', () => {
        const q = inp.value.trim();
        if (q.length < 2) return clearSuggestions();
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(async () => {
          const s = await fetchTickerSuggestions(q);
          renderTickerSuggestions(s);
        }, 300);
      });
      clearSuggestions();
    });
  </script>
