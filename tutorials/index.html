<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Intuition Trades | Tutorials</title>
  <meta name="description" content="Tutorials for Intuition Trades—getting started and more!" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --font-family: 'Arial', sans-serif;
      --text-color: #fff;
      --primary-bg: #333;
      --secondary-bg: #444;
      --section-bg: rgba(0, 0, 0, 0.33);
      --accent-color: #16a34a;
      --base-font-size: 16px;
      --line-height: 1.5;
      --heading-margin-bottom: 1rem;
      --section-padding: 3rem 1rem;
      --section-margin-bottom: 2rem;
      --button-padding: 0.5rem 1rem;
      --border-radius: 4px;
      --transition-speed: 0.3s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: var(--base-font-size);
    }

    body {
      font-family: var(--font-family);
      color: var(--text-color);
      background-color: #111;
      line-height: var(--line-height);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    h1, h2 {
      margin-bottom: var(--heading-margin-bottom);
      font-weight: normal;
    }

    .background-fixed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      z-index: -9999;
      transform: translateZ(0);
    }

    body.day .background-fixed {
      background-image: url('/images/day-background.png');
    }

    body.night .background-fixed {
      background-image: url('/images/night-background.png');
    }

    .topnav {
      background-color: var(--primary-bg);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
    }

    .topnav ul {
      display: flex;
      list-style: none;
    }

    .topnav ul li a {
      display: block;
      padding: 0.875rem 1.25rem;
      color: var(--text-color);
      transition: background-color var(--transition-speed), color var(--transition-speed);
    }

    .topnav ul li a:hover {
      background-color: #ddd;
      color: #333;
    }

    .hero {
      position: relative;
      padding: var(--section-padding);
      text-align: center;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 0;
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .content-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: var(--section-bg);
      border-radius: var(--border-radius);
      line-height: 1.6;
      text-align: center;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      max-width: 100%;
      margin-top: 1.5rem;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: var(--section-bg);
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <!-- Fixed Background Element -->
  <div class="background-fixed"></div>

  <!-- Top Navigation -->
  <header>
    <nav class="topnav">
      <ul>
        <li><a href="/">Home</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <header class="hero">
    <div class="hero-content">
      <h1>Tutorials</h1>
      <p>Learn how to get started with Intuition Trades</p>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <section class="content-container">
      <h2>Getting Started</h2>
      <p>This video walks you through how to use the Intuition Trades platform.</p>
      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/GTqkC1xmMZI" frameborder="0" allowfullscreen></iframe>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Intuition Trades. All rights reserved.</p>
  </footer>

  <!-- Day/Night Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const hours = new Date().getHours();
      const sunrise = 6;
      const sunset = 19;
      document.body.classList.add((hours >= sunset || hours < sunrise) ? 'night' : 'day');
    });
  </script>

</body>
</html>
