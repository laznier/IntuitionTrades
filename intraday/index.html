<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Intraday Stock Chart</title>
  <!-- Include Plotly for Charting -->
  <script src="https://cdn.plot.ly/plotly-2.18.2.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f3f4f6, #ffffff);
      color: #333;
      margin: 0 auto;
      max-width: 900px;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
      transition: border-color 0.3s ease;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #1e3a8a;
    }
    .chartContainer {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background-color: #f9fafb;
    }
    #backHome {
      margin-bottom: 20px;
    }
    #loading {
      margin-top: 10px;
      font-style: italic;
      color: #f97316;
    }
    @media (max-width: 600px) {
      body {
        padding: 1rem;
        font-size: 0.9rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 10px;
      }
      .chartContainer {
        padding: 10px;
        margin-top: 15px;
      }
      button {
        font-size: 0.9rem;
        padding: 8px 16px;
      }
      #chart {
        width: 100% !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>
  <!-- Back to Home Button -->
  <button id="backHome" onclick="window.location.href='https://www.intuitiontrades.com'">Back to Home</button>
  
  <h1>Intraday Stock Chart</h1>
  <p>Enter a ticker symbol to load an interactive intraday chart. Use the chart’s zoom and range slider to filter the data as needed.</p>

  <label for="ticker">Ticker Symbol:</label>
  <input type="text" id="ticker" value="OXY">

  <button id="loadChart">Load Chart</button>
  <div id="loading" style="display:none;">Loading intraday data...</div>

  <div class="chartContainer" id="chartContainer" style="display:none;">
    <div id="chart"></div>
  </div>

  <script>
    // Parse intraday data from the API response into an array of points.
    function parseIntradayData(data, interval) {
      const timeSeriesKey = `Time Series (${interval})`;
      const tsData = data[timeSeriesKey];
      if (!tsData) return [];
      const points = [];
      for (const timestamp in tsData) {
        const point = tsData[timestamp];
        points.push({
          date: new Date(timestamp),
          open: parseFloat(point["1. open"]),
          high: parseFloat(point["2. high"]),
          low: parseFloat(point["3. low"]),
          close: parseFloat(point["4. close"]),
          volume: parseInt(point["5. volume"], 10)
        });
      }
      // Sort points in ascending order by time.
      points.sort((a, b) => a.date - b.date);
      return points;
    }

    // Fetch intraday data from our API endpoint.
    async function fetchIntradayData(symbol, interval = "5min", outputsize = "compact") {
      document.getElementById('loading').style.display = 'block';
      try {
        const response = await fetch(`/api/intraday?symbol=${symbol}&interval=${interval}&outputsize=${outputsize}`);
        const data = await response.json();
        return data;
      } catch (error) {
        console.error("Error fetching intraday data:", error);
        return null;
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    // Plot a candlestick chart using Plotly.
    function plotCandlestickChart(points, symbol) {
      const trace = {
        x: points.map(p => p.date),
        open: points.map(p => p.open),
        high: points.map(p => p.high),
        low: points.map(p => p.low),
        close: points.map(p => p.close),
        type: 'candlestick',
        name: symbol
      };
      const layout = {
        title: `Intraday Candlestick Chart for ${symbol}`,
        xaxis: { title: 'Time', rangeslider: { visible: true } },
        yaxis: { title: 'Price' },
        dragmode: 'zoom'
      };
      Plotly.newPlot('chart', [trace], layout);
    }

    // Main function to load the chart.
    async function loadChart() {
      const symbol = document.getElementById('ticker').value.trim() || "OXY";
      // Use default interval = 5min and outputsize = compact.
      const data = await fetchIntradayData(symbol, "5min", "compact");
      if (!data) {
        alert("Failed to fetch intraday data.");
        return;
      }
      const points = parseIntradayData(data, "5min");
      if (points.length === 0) {
        alert("No intraday data available for this symbol.");
        return;
      }
      document.getElementById('chartContainer').style.display = 'block';
      plotCandlestickChart(points, symbol);
    }

    document.getElementById('loadChart').addEventListener('click', loadChart);

    // Auto-load ticker from URL parameter (e.g. ?ticker=OXY)
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const ticker = params.get('ticker');
      if (ticker) {
        document.getElementById('ticker').value = ticker;
        loadChart();
      }
    });
  </script>
</body>
</html>
