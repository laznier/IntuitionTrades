<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yahoo-Style Minimal Chart</title>
  <!-- Include Plotly for Charting -->
  <script src="https://cdn.plot.ly/plotly-2.18.2.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f4f6;
      color: #333;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }
    #tickerForm {
      text-align: center;
      margin-bottom: 10px;
    }
    #ticker {
      padding: 8px;
      font-size: 1rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 150px;
      text-align: center;
    }
    button {
      padding: 8px 16px;
      margin-left: 5px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #1e3a8a;
    }
    #topBar {
      text-align: center;
      margin-bottom: 20px;
    }
    #priceInfo {
      font-size: 1.5rem;
      font-weight: 600;
      margin-right: 10px;
    }
    #changeInfo {
      font-size: 1.2rem;
      margin-right: 10px;
    }
    #timeInfo {
      font-size: 0.9rem;
      color: #666;
    }
    .chartContainer {
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background: #fff;
    }
    #chart {
      width: 100%;
      height: 600px;
    }
    #loading {
      text-align: center;
      margin-top: 10px;
      font-style: italic;
      color: #f97316;
    }
    #backHome {
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      body {
        padding: 1rem;
        font-size: 0.9rem;
      }
      #chart {
        height: 400px;
      }
      #priceInfo {
        font-size: 1.2rem;
      }
      #changeInfo {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Back to Home Button -->
  <button id="backHome" onclick="window.location.href='https://www.intuitiontrades.com'">Back to Home</button>
  
  <h1>Yahoo‑Style Minimal Chart</h1>
  
  <!-- Ticker Input Form -->
  <div id="tickerForm">
    <input type="text" id="ticker" value="OXY" />
    <button id="loadBtn">Load Chart</button>
  </div>

  <!-- Top Bar for Price Info -->
  <div id="topBar">
    <span id="priceInfo"></span>
    <span id="changeInfo"></span>
    <span id="timeInfo"></span>
  </div>

  <div class="chartContainer">
    <div id="chart"></div>
    <div id="loading" style="display:none;">Loading data...</div>
  </div>

  <script>
    /********************************************
     * 1) DATA FETCH & PARSE FUNCTIONS
     ********************************************/
    async function fetchIntradayData(symbol) {
      // Make sure /api/intraday is returning valid JSON from Alpha Vantage
      const response = await fetch(`/api/intraday?symbol=${symbol}&interval=5min&outputsize=full`);
      const data = await response.json();
      return data;
    }

    function parseIntradayData(data) {
      const seriesKey = "Time Series (5min)";
      const raw = data[seriesKey];
      if (!raw) return [];
      const points = [];
      for (const timestamp in raw) {
        const rec = raw[timestamp];
        // Convert "YYYY-MM-DD HH:MM:SS" to "YYYY-MM-DDTHH:MM:SS" for ISO parsing
        const isoTimestamp = timestamp.replace(" ", "T");
        points.push({
          date: new Date(isoTimestamp),
          open: parseFloat(rec["1. open"]),
          high: parseFloat(rec["2. high"]),
          low: parseFloat(rec["3. low"]),
          close: parseFloat(rec["4. close"]),
          volume: parseInt(rec["5. volume"], 10)
        });
      }
      points.sort((a, b) => a.date - b.date);
      return points;
    }

    /********************************************
     * 2) CHART PLOTTING
     ********************************************/
    function plotMountainChart(points, symbol) {
      const x = points.map(p => p.date);
      const y = points.map(p => p.close);

      // Red line & fill to replicate Yahoo "mountain" style
      const trace = {
        x: x,
        y: y,
        mode: 'lines',
        line: { color: '#d62828', width: 2 },
        fill: 'tozeroy',
        fillcolor: 'rgba(214,40,40,0.1)',
        hovertemplate: "<b>Date</b>: %{x}<br><b>Close</b>: %{y:.2f}<extra></extra>"
      };

      const layout = {
        title: "",
        showlegend: false,
        xaxis: {
          showgrid: false,
          showline: false,
          zeroline: false,
          type: 'date',
          // Hide the range slider to replicate Yahoo's minimal style
          rangeslider: { visible: false }
        },
        yaxis: {
          showgrid: false,
          showline: false,
          zeroline: false
        },
        margin: { t: 20, r: 20, b: 40, l: 50 },
        hovermode: 'x unified',
        plot_bgcolor: '#fff',
        paper_bgcolor: '#fff'
      };

      Plotly.newPlot('chart', [trace], layout, { responsive: true });
    }

    /********************************************
     * 3) TOP BAR UPDATE
     ********************************************/
    function updateTopBar(points, symbol) {
      if (points.length < 2) return;
      const last = points[points.length - 1];
      const prev = points[points.length - 2];
      const diff = last.close - prev.close;
      const pct = (diff / prev.close) * 100;
      document.getElementById('priceInfo').textContent = `${symbol.toUpperCase()} ${last.close.toFixed(2)}`;
      // Color code the change: green if up, red if down
      const changeEl = document.getElementById('changeInfo');
      if (diff >= 0) {
        changeEl.textContent = `+${diff.toFixed(2)} (+${pct.toFixed(2)}%)`;
        changeEl.style.color = "#16a34a";
      } else {
        changeEl.textContent = `${diff.toFixed(2)} (${pct.toFixed(2)}%)`;
        changeEl.style.color = "#dc2626";
      }
      document.getElementById('timeInfo').textContent = `As of ${last.date.toLocaleTimeString()}`;
    }

    /********************************************
     * 4) MAIN LOAD FUNCTION
     ********************************************/
    async function loadChart() {
      const symbol = document.getElementById('ticker').value.trim() || "OXY";
      document.getElementById('loading').style.display = 'block';
      try {
        const rawData = await fetchIntradayData(symbol);
        const points = parseIntradayData(rawData);
        if (points.length === 0) {
          alert("No data found for this symbol.");
          return;
        }
        plotMountainChart(points, symbol);
        updateTopBar(points, symbol);
      } catch (err) {
        console.error("Error loading data:", err);
        alert("Failed to load data.");
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    /********************************************
     * 5) EVENT LISTENERS & AUTO-LOAD
     ********************************************/
    document.getElementById('loadBtn').addEventListener('click', loadChart);

    // On page load, check if a ticker is provided via URL (e.g. ?ticker=TSLA)
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const ticker = params.get('ticker');
      if (ticker) {
        document.getElementById('ticker').value = ticker;
      }
      loadChart();
    });
  </script>
</body>
</html>
