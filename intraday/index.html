<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Stock Chart</title>
  <!-- Highcharts Stock Scripts -->
  <script src="https://code.highcharts.com/stock/highstock.js"></script>
  <script src="https://code.highcharts.com/stock/modules/exporting.js"></script>
  <!-- Optionally include accessibility module if desired -->
  <!-- <script src="https://code.highcharts.com/stock/modules/accessibility.js"></script> -->
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f4f6;
      color: #333;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-weight: 600;
    }
    #tickerForm {
      text-align: center;
      margin-bottom: 10px;
    }
    #ticker {
      padding: 8px;
      font-size: 1rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 150px;
      text-align: center;
    }
    button {
      padding: 8px 16px;
      margin-left: 5px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #1e3a8a;
    }
    #topBar {
      text-align: center;
      margin-bottom: 5px;
    }
    #priceInfo {
      font-size: 1.8rem;
      font-weight: 600;
      margin-right: 10px;
    }
    #changeInfo {
      font-size: 1.4rem;
      margin-right: 10px;
    }
    #timeInfo {
      font-size: 1rem;
      color: #666;
    }
    #caution {
      text-align: center;
      font-size: 0.9rem;
      color: #dc2626;
      margin-bottom: 10px;
    }
    /* Tabs for range selection */
    #rangeTabs {
      text-align: center;
      margin-bottom: 20px;
    }
    .rangeTab {
      display: inline-block;
      padding: 8px 16px;
      margin: 0 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      background: #fff;
      transition: background 0.3s ease;
    }
    .rangeTab.active {
      background: #2563eb;
      color: #fff;
      border-color: #1e3a8a;
    }
    .chartContainer {
      padding: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background: #fff;
    }
    #chart {
      width: 100%;
      height: 600px;
    }
    #loading {
      text-align: center;
      margin-top: 10px;
      font-style: italic;
      color: #f97316;
    }
    #backHome {
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      #chart {
        height: 400px;
      }
      #priceInfo {
        font-size: 1.4rem;
      }
      #changeInfo {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <!-- Back to Home Button -->
  <button id="backHome" onclick="window.location.href='https://www.intuitiontrades.com'">Back to Home</button>
  
  <h1>Live Stock Chart</h1>
  
  <!-- Ticker Input Form -->
  <div id="tickerForm">
    <input type="text" id="ticker" value="OXY" />
    <button id="loadBtn">Load Chart</button>
  </div>

  <!-- Top Bar: Price, Change, Time -->
  <div id="topBar">
    <span id="priceInfo"></span>
    <span id="changeInfo"></span>
    <span id="timeInfo"></span>
  </div>
  
  <!-- Caution Note -->
  <div id="caution">
    Data from Alpha Vantage is delayed by 15 minutes (Free Version).
  </div>

  <!-- Range Tabs -->
  <div id="rangeTabs">
    <div class="rangeTab active" data-range="1D">1D</div>
    <div class="rangeTab" data-range="5D">5D</div>
    <div class="rangeTab" data-range="1M">1M</div>
    <div class="rangeTab" data-range="6M">6M</div>
    <div class="rangeTab" data-range="YTD">YTD</div>
    <div class="rangeTab" data-range="1Y">1Y</div>
    <div class="rangeTab" data-range="5Y">5Y</div>
  </div>

  <!-- Chart Container -->
  <div class="chartContainer">
    <div id="chart"></div>
    <div id="loading" style="display:none;">Loading data...</div>
  </div>

  <script>
    /***************************************
     * 1) DATA FETCH FUNCTIONS
     ***************************************/
    // For intraday data, we pass an interval and an optional outputsize.
    async function fetchIntradayData(symbol, interval, outputsize = "compact") {
      const response = await fetch(`/api/intraday?symbol=${symbol}&interval=${interval}&outputsize=${outputsize}`);
      return response.json();
    }
    // For historical data.
    async function fetchHistoricalData(symbol) {
      const response = await fetch(`/api/historical?symbol=${symbol}&outputsize=full`);
      return response.json();
    }

    /***************************************
     * 2) DATA PARSE FUNCTIONS
     ***************************************/
    function parseIntradayData(data, interval) {
      const seriesKey = `Time Series (${interval})`;
      const raw = data[seriesKey];
      if (!raw) return [];
      let points = [];
      for (const timestamp in raw) {
        const rec = raw[timestamp];
        // Convert timestamp string to Date.
        const date = new Date(timestamp.replace(" ", "T"));
        points.push({
          date: date,
          open: parseFloat(rec["1. open"]),
          high: parseFloat(rec["2. high"]),
          low: parseFloat(rec["3. low"]),
          close: parseFloat(rec["4. close"]),
          volume: parseInt(rec["5. volume"], 10)
        });
      }
      points.sort((a, b) => a.date - b.date);
      return points;
    }

    function parseHistoricalData(data) {
      const seriesKey = Object.keys(data).find(key => key.startsWith("Time Series"));
      const raw = data[seriesKey];
      if (!raw) return [];
      let points = [];
      for (const dateStr in raw) {
        const rec = raw[dateStr];
        const date = new Date(dateStr);
        points.push({
          date: date,
          open: parseFloat(rec["1. open"]),
          high: parseFloat(rec["2. high"]),
          low: parseFloat(rec["3. low"]),
          close: parseFloat(rec["4. close"]),
          volume: parseInt(rec["6. volume"] || rec["5. volume"], 10)
        });
      }
      points.sort((a, b) => a.date - b.date);
      return points;
    }

    /***************************************
     * 3) FILTERING DATA BY RANGE
     ***************************************/
    function filterDataForRange(points, range) {
      const now = new Date();
      let fromDate;
      switch (range) {
        case "1D":
          fromDate = new Date(now.getTime() - 1 * 24 * 60 * 60 * 1000);
          break;
        case "5D":
          fromDate = new Date(now.getTime() - 5 * 24 * 60 * 60 * 1000);
          break;
        case "1M":
          fromDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
          break;
        case "6M":
          fromDate = new Date(now.getTime() - 180 * 24 * 60 * 60 * 1000);
          break;
        case "YTD":
          fromDate = new Date(now.getFullYear(), 0, 1);
          break;
        case "1Y":
          fromDate = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
          break;
        case "5Y":
          fromDate = new Date(now.getTime() - 5 * 365 * 24 * 60 * 60 * 1000);
          break;
        default:
          fromDate = new Date(now.getTime() - 1 * 24 * 60 * 60 * 1000);
      }
      return points.filter(p => p.date >= fromDate);
    }

    /***************************************
     * 4) TOP BAR UPDATE (Display time in UTC)
     ***************************************/
    function updateTopBar(points, symbol) {
      if (points.length < 2) return;
      
      const first = points[0];
      const last = points[points.length - 1];
      const diff = last.close - first.close;
      const pct = (diff / first.close) * 100;

      document.getElementById('priceInfo').textContent = `${symbol.toUpperCase()} ${last.close.toFixed(2)}`;
      const changeEl = document.getElementById('changeInfo');
      if (diff >= 0) {
        changeEl.textContent = `+${diff.toFixed(2)} (+${pct.toFixed(2)}%)`;
        changeEl.style.color = "#16a34a";
      } else {
        changeEl.textContent = `${diff.toFixed(2)} (${pct.toFixed(2)}%)`;
        changeEl.style.color = "#dc2626";
      }
      // Display "As of" time in UTC.
      document.getElementById('timeInfo').textContent = `As of ${last.date.toLocaleTimeString('en-US', { timeZone: 'UTC' })} UTC`;
    }

    /***************************************
     * 5) CHART PLOTTING FUNCTION USING HIGHCHARTS STOCK
     *     - Draws a fixed dashed line at the last price and a dynamic crosshair with label.
     ***************************************/
    function plotChart(points, symbol, range) {
      let seriesData;
      let chartType;
      let seriesOptions = {};
      
      if (range === "1D" || range === "5D" || range === "1M" || range === "YTD") {
        seriesData = points.map(p => [p.date.getTime(), p.close]);
        chartType = 'line';
        
        const firstClose = points[0].close;
        const lastClose = points[points.length - 1].close;
        let seriesColor = 'blue';
        if (lastClose > firstClose) {
          seriesColor = 'green';
        } else if (lastClose < firstClose) {
          seriesColor = 'red';
        }
        
        seriesOptions = {
          color: seriesColor,
          fillColor: Highcharts.color(seriesColor).setOpacity(0.15).get()
        };
      } else {
        // For 6M, 1Y, 5Y use historical candlestick data.
        seriesData = points.map(p => [p.date.getTime(), p.open, p.high, p.low, p.close]);
        chartType = 'candlestick';
        seriesOptions = {
          color: 'red',    // falling days
          upColor: 'green' // rising days
        };
      }
      
      Highcharts.stockChart('chart', {
        chart: {
          backgroundColor: '#fff',
          marginRight: 80, // extra margin for right-side labels
          events: {
            load: function () {
              const chart = this;
              const yAxis = chart.yAxis[0];
              const series = chart.series[0];
              // For candlestick charts, use series.points instead of series.data.
              const pointsArray = (series.type === 'candlestick') ? series.points : series.data;
              if (!pointsArray || pointsArray.length === 0) return;
              
              const lastPoint = pointsArray[pointsArray.length - 1];
              // For candlestick, use lastPoint.close; for line, use lastPoint.y.
              const lastPrice = (series.type === 'candlestick' ? lastPoint.close : lastPoint.y);
              // For candlestick, adjust by 3 pixels so the line aligns with the actual last datapoint.
              const adjustment = (series.type === 'candlestick') ? 3 : 0;
              const lastY = yAxis.toPixels(lastPrice, true) + adjustment;
              
              // Draw fixed dashed line at the last price.
              chart.lastPriceLine = chart.renderer.path([
                'M', chart.plotLeft, lastY,
                'L', chart.plotLeft + chart.plotWidth, lastY
              ]).attr({
                'stroke-width': 1,
                stroke: 'gray',
                dashstyle: 'Dash'
              }).add();
              
              // Draw fixed last price label on the right.
              chart.lastPriceLabel = chart.renderer.text(lastPrice.toFixed(2),
                chart.plotLeft + chart.plotWidth + 5,
                lastY + 4
              ).css({ color: 'gray' }).add();
              
              // Create dynamic crosshair line and label.
              chart.crosshairLine = chart.renderer.path().attr({
                'stroke-width': 1,
                stroke: 'black',
                dashstyle: 'Solid'
              }).add();
              chart.crosshairLabel = chart.renderer.text('',
                chart.plotLeft + chart.plotWidth + 5,
                chart.plotTop
              ).css({ color: 'black' }).add();
              
              Highcharts.addEvent(chart.container, 'mousemove', function(e) {
                const event = chart.pointer.normalize(e);
                const yValue = yAxis.toValue(event.chartY);
                const yPixel = yAxis.toPixels(yValue, true);
                chart.crosshairLine.attr({
                  d: ['M', chart.plotLeft, yPixel, 'L', chart.plotLeft + chart.plotWidth, yPixel]
                });
                chart.crosshairLabel.attr({
                  text: yValue.toFixed(2),
                  x: chart.plotLeft + chart.plotWidth + 5,
                  y: yPixel + 4
                });
              });
              
              Highcharts.addEvent(chart.container, 'mouseleave', function() {
                chart.crosshairLine.attr({ d: [] });
                chart.crosshairLabel.attr({ text: '' });
              });
            }
          }
        },
        time: {
          timezone: 'UTC'
        },
        accessibility: {
          enabled: false
        },
        rangeSelector: {
          enabled: false // Using custom range tabs
        },
        title: {
          text: `${symbol.toUpperCase()} Price`
        },
        xAxis: {
          type: 'datetime',
          maxPadding: 0.15 // extra right-side space
        },
        yAxis: {
          title: { text: 'Price' }
        },
        tooltip: {
          split: false,
          shared: true,
          xDateFormat: '%Y-%m-%d %H:%M'
        },
        series: [{
          name: symbol.toUpperCase(),
          data: seriesData,
          type: chartType,
          tooltip: { valueDecimals: 2 },
          ...seriesOptions
        }],
        navigator: { enabled: true },
        scrollbar: { enabled: true },
        credits: { enabled: false }
      });
    }

    /***************************************
     * 6) MAIN LOAD FUNCTION
     ***************************************/
    async function loadChart() {
      const symbol = document.getElementById('ticker').value.trim() || "OXY";
      const range = currentRange;
      document.getElementById('loading').style.display = 'block';

      try {
        let rawData, points;
        if (range === "1D" || range === "5D") {
          // Use intraday data with 1-minute interval.
          rawData = await fetchIntradayData(symbol, "1min");
          points = parseIntradayData(rawData, "1min");
        } else if (range === "1M") {
          // For 1M, use intraday data with a 60-minute interval and force full outputsize.
          rawData = await fetchIntradayData(symbol, "60min", "full");
          points = parseIntradayData(rawData, "60min");
        } else {
          // For 6M, 1Y, 5Y, use historical data (candlestick).
          rawData = await fetchHistoricalData(symbol);
          points = parseHistoricalData(rawData);
        }
        points = filterDataForRange(points, range);
        if (points.length === 0) {
          alert("No data found for this symbol and range.");
          return;
        }
        plotChart(points, symbol, range);
        updateTopBar(points, symbol);
      } catch (err) {
        console.error("Error loading data:", err);
        alert("Failed to load data.");
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    /***************************************
     * 7) RANGE TABS & AUTO UPDATE
     ***************************************/
    let currentRange = "1D";
    document.querySelectorAll(".rangeTab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".rangeTab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentRange = tab.getAttribute("data-range");
        loadChart();
      });
    });

    document.getElementById('loadBtn').addEventListener('click', loadChart);

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const ticker = params.get('ticker');
      if (ticker) {
        document.getElementById('ticker').value = ticker;
      }
      loadChart();
      // Auto-update every minute (60000 ms)
      setInterval(loadChart, 60000);
    });
  </script>
</body>
</html>
