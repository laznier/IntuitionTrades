<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Chart with Support Plotting</title>

  <!-- Highcharts Stock Scripts -->
  <script src="https://code.highcharts.com/stock/highstock.js"></script>
  <script src="https://code.highcharts.com/stock/modules/exporting.js"></script>
  <script type="module" src="/authGate.js"></script> <!-- Insert in Head -->

  <style>
    :root {
      --primary-bg: #111;
      --secondary-bg: #333;
      --accent-color: #16a34a;
      --text-color: #fff;
      --font-family: 'Arial', sans-serif;
      --transition-speed: 0.3s;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--font-family);
      background-color: var(--primary-bg);
      color: var(--text-color);
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 { text-align: center; margin-bottom: 10px; font-weight: 600; }

    button {
      margin: 5px;
      padding: 8px 16px;
      background: var(--accent-color);
      color: var(--text-color);
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background var(--transition-speed);
    }
    button:hover { background: #1e3a8a; }

    /* Ticker Input & Autocomplete */
    #tickerForm {
      text-align: center;
      margin-bottom: 10px;
      position: relative;
    }
    #ticker {
      padding: 8px;
      font-size: 1rem;
      border-radius: 4px;
      border: 1px solid #555;
      width: 150px;
      background-color: var(--secondary-bg);
      color: var(--text-color);
      text-align: center;
    }
    #ticker-suggestions {
      position: absolute;
      top: calc(100% + 2px);
      left: 0;
      background-color: var(--secondary-bg);
      border: 1px solid #555;
      width: calc(100% - 2px);
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      list-style: none;
      display: none;
    }
    #ticker-suggestions li {
      padding: 8px;
      cursor: pointer;
      color: var(--text-color);
    }
    #ticker-suggestions li:hover {
      background-color: var(--accent-color);
    }
    #company-full-name {
      margin-top: 5px;
      font-size: 0.9rem;
      color: var(--accent-color);
      text-align: center;
    }

    /* Mode Tabs */
    #modeTabs, #typeTabs {
      text-align: center;
      margin-bottom: 10px;
    }
    .tab {
      display: inline-block;
      padding: 6px 12px;
      margin: 0 4px;
      border: 1px solid #555;
      border-radius: 4px;
      background: var(--secondary-bg);
      cursor: pointer;
      transition: background var(--transition-speed);
      color: var(--text-color);
      font-size: 0.9rem;
    }
    .tab.active {
      background: var(--accent-color);
      border-color: #1e3a8a;
    }

    /* Loading & No Data */
    #loading {
      text-align: center;
      font-style: italic;
      color: var(--accent-color);
      display: none;
      margin-bottom: 10px;
    }
    #noDataMsg {
      display: none;
      text-align: center;
      margin-top: 10px;
      color: #f87171;
    }

    /* Chart Container */
    .chartContainer {
      border: 1px solid #555;
      border-radius: 4px;
      background: var(--secondary-bg);
      padding: 10px;
    }
    #chart {
      height: 600px;
      width: 100%;
    }
    @media (max-width:600px) {
      #chart { height: 400px; }
    }
  </style>
</head>
<body>

  <button onclick="window.location.href='https://www.intuitiontrades.com'">
    Back to Home
  </button>
  <h1>Stock Chart with Support Plotting</h1>

  <div id="tickerForm">
    <input type="text" id="ticker" value="SPY" placeholder="Enter Ticker" />
    <ul id="ticker-suggestions"></ul>
    <div id="company-full-name"></div>
    <button id="loadBtn" class="tool-free-run">Load Chart</button>
    <button id="plotSupportBtn" class="tool-free-run">Plot Support</button>
  </div>

  <div id="modeTabs">
    <span class="tab active" data-mode="intraday">Intraday (5min)</span>
    <span class="tab" data-mode="daily">Daily (Adjusted)</span>
  </div>
  <div id="typeTabs">
    <span class="tab active" data-type="line">Line</span>
    <span class="tab" data-type="candlestick">Candlestick</span>
  </div>

  <div id="loading">Loading data...</div>
  <div id="noDataMsg">No data available.</div>

  <div class="chartContainer">
    <div id="chart"></div>
  </div>
  
  <script>
    // Theme color
    const ACCENT_COLOR = '#16a34a';

    // State
    let currentMode = 'intraday';
    let currentType = 'line';
    let chartRef = null;

    // Debounce helper
    function debounce(fn, ms) {
      let t;
      return (...a) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...a), ms);
      };
    }

    // Autocomplete
    async function fetchTickerSuggestions(q) {
      const res = await fetch(`/api/ticker?query=${encodeURIComponent(q)}`);
      if (!res.ok) throw new Error('API error');
      const json = await res.json();
      return json.bestMatches || [];
    }
    function renderSuggestions(list) {
      const ul = document.getElementById('ticker-suggestions');
      ul.innerHTML = '';
      if (!list.length) {
        ul.style.display = 'none';
        return;
      }
      ul.style.display = 'block';
      list.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item["1. symbol"]} (${item["2. name"]})`;
        li.onclick = () => {
          document.getElementById('ticker').value = item["1. symbol"];
          document.getElementById('company-full-name').textContent = item["2. name"];
          ul.style.display = 'none';
        };
        ul.appendChild(li);
      });
    }
    document.getElementById('ticker').addEventListener('input', debounce(async e => {
      const q = e.target.value.trim();
      if (q.length < 2) {
        document.getElementById('ticker-suggestions').style.display = 'none';
        return;
      }
      try {
        const list = await fetchTickerSuggestions(q);
        renderSuggestions(list);
      } catch {
        document.getElementById('ticker-suggestions').style.display = 'none';
      }
    }, 300));

    // Data fetchers
    async function fetchIntraday(symbol) {
      const res = await fetch(`/api/intraday?symbol=${symbol}&interval=5min&outputsize=full`);
      if (!res.ok) throw new Error('Intraday fetch failed');
      return res.json();
    }
    async function fetchDaily(symbol) {
      const res = await fetch(`/api/historical?symbol=${symbol}&outputsize=full&adjusted=true`);
      if (!res.ok) throw new Error('Daily fetch failed');
      return res.json();
    }

    // Parsers returning full OHLC objects
    function parseIntraday(raw) {
      const key = "Time Series (5min)";
      const ts = raw[key] || {};
      return Object.entries(ts).map(([dt, d]) => {
        const date = new Date(dt.replace(' ', 'T')).getTime();
        return {
          x: date,
          open: +d['1. open'],
          high: +d['2. high'],
          low: +d['3. low'],
          close: +d['4. close']
        };
      }).sort((a, b) => a.x - b.x);
    }
    function parseDaily(raw) {
      const key = Object.keys(raw).find(k => k.includes("Time Series"));
      const ts = raw[key] || {};
      return Object.entries(ts).map(([dt, d]) => {
        const date = new Date(dt).getTime();
        return {
          x: date,
          open: +d['1. open'],
          high: +d['2. high'],
          low: +d['3. low'],
          close: +d['4. close']
        };
      }).sort((a, b) => a.x - b.x);
    }

    // Plotting
    function plotData(dataObjs, symbol) {
      // Prepare series data based on currentType
      let seriesData;
      if (currentType === 'line') {
        seriesData = dataObjs.map(o => [o.x, o.close]);
      } else {
        seriesData = dataObjs.map(o => [o.x, o.open, o.high, o.low, o.close]);
      }

      if (chartRef) chartRef.destroy();
      chartRef = Highcharts.stockChart('chart', {
        chart: {
          backgroundColor: 'transparent',
          zoomType: 'x'
        },
        title: { text: symbol.toUpperCase() },
        rangeSelector: { enabled: true },
        navigator: { enabled: true },
        scrollbar: { enabled: true },
        plotOptions: {
    candlestick: {
      upColor: '#16a34a',
      color: '#dc2626',
      upLineColor: '#16a34a',
      lineColor: '#dc2626'
    }
  },
        series: [{
          name: symbol.toUpperCase(),
          data: seriesData,
          type: currentType,
          tooltip: { valueDecimals: 2 }
        }],
        credits: { enabled: false }
      });
    }

    // Load Chart
    async function loadChart() {
      const sym = document.getElementById('ticker').value.trim().toUpperCase() || 'SPY';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('noDataMsg').style.display = 'none';
      try {
        let raw, dataObjs;
        if (currentMode === 'intraday') {
          raw = await fetchIntraday(sym);
          dataObjs = parseIntraday(raw);
        } else {
          raw = await fetchDaily(sym);
          dataObjs = parseDaily(raw);
        }
        if (!dataObjs.length) {
          document.getElementById('noDataMsg').style.display = 'block';
          return;
        }
        plotData(dataObjs, sym);
      } catch (err) {
        console.error(err);
        document.getElementById('noDataMsg').style.display = 'block';
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }
    document.getElementById('loadBtn').addEventListener('click', loadChart);

    // Tab switching
    document.querySelectorAll('#modeTabs .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#modeTabs .tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;
        loadChart();
      });
    });
    document.querySelectorAll('#typeTabs .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#typeTabs .tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentType = tab.dataset.type;
        loadChart();
      });
    });

    // Support detection & plotting
    function detectSupportZones(data) {
      const bins = new Map();
      const bucketSize = (Math.max(...data.map(p => p[1])) - Math.min(...data.map(p => p[1]))) / 100;
      for (let i = 1; i < data.length - 1; i++) {
        const prev = data[i - 1][1], curr = data[i][1], next = data[i + 1][1];
        if (curr < prev && curr < next) {
          const b = Math.round(curr / bucketSize) * bucketSize;
          bins.has(b) ? bins.get(b).push(curr) : bins.set(b, [curr]);
        }
      }
      return Array.from(bins.entries())
        .filter(([, arr]) => arr.length >= 2)
        .map(([price, arr]) => ({ price, touches: arr.length }));
    }
    function plotSupport() {
  if (!chartRef) return;

  // 1) Clear any old "support-..." lines from the Y-axis:
  const axis = chartRef.yAxis[0];
  axis.plotLinesAndBands
    .filter(b => b.id && b.id.startsWith('support-'))
    .forEach(b => axis.removePlotLine(b.id));

  // 2) Grab the current zoomed‐in points:
  const ext = chartRef.xAxis[0].getExtremes();
  const pts = chartRef.series[0].points
    .filter(p => p.x >= ext.min && p.x <= ext.max)
    .map(p => [p.x, p.y]);

  // 3) Detect the support levels:
  const supports = detectSupportZones(pts);

  // 4) Draw each support line:
  supports.forEach((s, i) => {
    axis.addPlotLine({
      id: `support-${i}`,
      value: s.price,
      color: ACCENT_COLOR,
      width: 2,
      dashStyle: 'ShortDash',
      label: {
        text: `Support ${s.price.toFixed(2)} (${s.touches})`,
        style: { color: ACCENT_COLOR }
      }
    });
  });
}

    document.getElementById('plotSupportBtn').addEventListener('click', plotSupport);

    // Initial load
    document.addEventListener('DOMContentLoaded', loadChart);
  </script>
</body>
</html>
