<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yahoo‑Style Full Chart with Highcharts Stock</title>
  <!-- Highcharts Stock Scripts -->
  <script src="https://code.highcharts.com/stock/highstock.js"></script>
  <script src="https://code.highcharts.com/stock/modules/exporting.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f4f6;
      color: #333;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-weight: 600;
    }
    #tickerForm {
      text-align: center;
      margin-bottom: 10px;
    }
    #ticker {
      padding: 8px;
      font-size: 1rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 150px;
      text-align: center;
    }
    button {
      padding: 8px 16px;
      margin-left: 5px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #1e3a8a;
    }
    #topBar {
      text-align: center;
      margin-bottom: 10px;
    }
    #priceInfo {
      font-size: 1.8rem;
      font-weight: 600;
      margin-right: 10px;
    }
    #changeInfo {
      font-size: 1.4rem;
      margin-right: 10px;
    }
    #timeInfo {
      font-size: 1rem;
      color: #666;
    }
    /* Tabs for range selection */
    #rangeTabs {
      text-align: center;
      margin-bottom: 20px;
    }
    .rangeTab {
      display: inline-block;
      padding: 8px 16px;
      margin: 0 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      background: #fff;
      transition: background 0.3s ease;
    }
    .rangeTab.active {
      background: #2563eb;
      color: #fff;
      border-color: #1e3a8a;
    }
    .chartContainer {
      padding: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background: #fff;
    }
    #chart {
      width: 100%;
      height: 600px;
    }
    #loading {
      text-align: center;
      margin-top: 10px;
      font-style: italic;
      color: #f97316;
    }
    #backHome {
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      #chart {
        height: 400px;
      }
      #priceInfo {
        font-size: 1.4rem;
      }
      #changeInfo {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <!-- Back to Home Button -->
  <button id="backHome" onclick="window.location.href='https://www.intuitiontrades.com'">Back to Home</button>
  
  <h1>Yahoo‑Style Full Chart</h1>
  
  <!-- Ticker Input Form -->
  <div id="tickerForm">
    <input type="text" id="ticker" value="OXY" />
    <button id="loadBtn">Load Chart</button>
  </div>

  <!-- Top Bar: Price, Change, Time -->
  <div id="topBar">
    <span id="priceInfo"></span>
    <span id="changeInfo"></span>
    <span id="timeInfo"></span>
  </div>

  <!-- Range Tabs -->
  <div id="rangeTabs">
    <div class="rangeTab active" data-range="1D">1D</div>
    <div class="rangeTab" data-range="5D">5D</div>
    <div class="rangeTab" data-range="1M">1M</div>
    <div class="rangeTab" data-range="6M">6M</div>
    <div class="rangeTab" data-range="YTD">YTD</div>
    <div class="rangeTab" data-range="1Y">1Y</div>
    <div class="rangeTab" data-range="5Y">5Y</div>
  </div>

  <!-- Chart Container -->
  <div class="chartContainer">
    <div id="chart"></div>
    <div id="loading" style="display:none;">Loading data...</div>
  </div>

  <script>
    /***************************************
     * 1) DATA FETCH FUNCTIONS
     ***************************************/
    async function fetchIntradayData(symbol) {
      const response = await fetch(`/api/intraday?symbol=${symbol}&interval=5min&outputsize=full`);
      return response.json();
    }

    async function fetchHistoricalData(symbol) {
      const response = await fetch(`/api/historical?symbol=${symbol}&outputsize=full`);
      return response.json();
    }

    /***************************************
     * 2) DATA PARSE FUNCTIONS
     ***************************************/
    function parseIntradayData(data) {
      const seriesKey = "Time Series (5min)";
      const raw = data[seriesKey];
      if (!raw) return [];
      let points = [];
      for (const timestamp in raw) {
        const rec = raw[timestamp];
        // Convert timestamp to ISO format (assumes "YYYY-MM-DD HH:MM:SS")
        const isoTimestamp = timestamp.replace(" ", "T");
        const date = new Date(isoTimestamp);
        points.push({
          date: date,
          open: parseFloat(rec["1. open"]),
          high: parseFloat(rec["2. high"]),
          low: parseFloat(rec["3. low"]),
          close: parseFloat(rec["4. close"]),
          volume: parseInt(rec["5. volume"], 10)
        });
      }
      points.sort((a, b) => a.date - b.date);
      return points;
    }

    function parseHistoricalData(data) {
      const seriesKey = Object.keys(data).find(k => k.startsWith("Time Series"));
      const raw = data[seriesKey];
      if (!raw) return [];
      let points = [];
      for (const dateStr in raw) {
        const rec = raw[dateStr];
        const date = new Date(dateStr);
        points.push({
          date: date,
          open: parseFloat(rec["1. open"]),
          high: parseFloat(rec["2. high"]),
          low: parseFloat(rec["3. low"]),
          close: parseFloat(rec["4. close"]),
          volume: parseInt(rec["6. volume"] || rec["5. volume"], 10)
        });
      }
      points.sort((a, b) => a.date - b.date);
      return points;
    }

    /***************************************
     * 3) FILTERING DATA BY RANGE
     ***************************************/
    function filterDataForRange(points, range) {
      const now = new Date();
      let fromDate;
      switch (range) {
        case "1D":
          fromDate = new Date(now.getTime() - 1 * 24 * 60 * 60 * 1000);
          break;
        case "5D":
          fromDate = new Date(now.getTime() - 5 * 24 * 60 * 60 * 1000);
          break;
        case "1M":
          fromDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
          break;
        case "6M":
          fromDate = new Date(now.getTime() - 180 * 24 * 60 * 60 * 1000);
          break;
        case "YTD":
          fromDate = new Date(now.getFullYear(), 0, 1);
          break;
        case "1Y":
          fromDate = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
          break;
        case "5Y":
          fromDate = new Date(now.getTime() - 5 * 365 * 24 * 60 * 60 * 1000);
          break;
        default:
          fromDate = new Date(now.getTime() - 1 * 24 * 60 * 60 * 1000);
      }
      return points.filter(p => p.date >= fromDate);
    }

    /***************************************
     * 4) TOP BAR UPDATE
     ***************************************/
    function updateTopBar(points, symbol) {
      if (points.length < 2) return;
      const last = points[points.length - 1];
      const prev = points[points.length - 2];
      const diff = last.close - prev.close;
      const pct = (diff / prev.close) * 100;
      document.getElementById('priceInfo').textContent = `${symbol.toUpperCase()} ${last.close.toFixed(2)}`;
      const changeEl = document.getElementById('changeInfo');
      if (diff >= 0) {
        changeEl.textContent = `+${diff.toFixed(2)} (+${pct.toFixed(2)}%)`;
        changeEl.style.color = "#16a34a";
      } else {
        changeEl.textContent = `${diff.toFixed(2)} (${pct.toFixed(2)}%)`;
        changeEl.style.color = "#dc2626";
      }
      // Display time in NYSE time (America/New_York)
      document.getElementById('timeInfo').textContent = `As of ${last.date.toLocaleTimeString('en-US', { timeZone: 'America/New_York' })}`;
    }

    /***************************************
     * 5) CHART PLOTTING FUNCTION USING HIGHCHARTS STOCK
     ***************************************/
    function plotChart(points, symbol, range) {
      let seriesData;
      let chartType;
      
      // For intraday data, use a line/area chart; for historical data, use candlestick
      if (range === "1D" || range === "5D") {
        // Format: [timestamp, close]
        seriesData = points.map(p => [p.date.getTime(), p.close]);
        chartType = 'line';
      } else {
        // Format for candlestick: [timestamp, open, high, low, close]
        seriesData = points.map(p => [p.date.getTime(), p.open, p.high, p.low, p.close]);
        chartType = 'candlestick';
      }
      
      Highcharts.stockChart('chart', {
        chart: {
          backgroundColor: '#fff'
        },
        time: {
          timezone: 'America/New_York'
        },
        rangeSelector: {
          enabled: false  // Using our own range tabs
        },
        title: {
          text: `${symbol.toUpperCase()} Price`
        },
        xAxis: {
          type: 'datetime'
        },
        yAxis: {
          title: {
            text: 'Price'
          }
        },
        tooltip: {
          split: false,
          shared: true,
          xDateFormat: '%Y-%m-%d %H:%M'
        },
        series: [{
          name: symbol.toUpperCase(),
          data: seriesData,
          type: chartType,
          tooltip: {
            valueDecimals: 2
          },
          color: '#2563eb',
          fillColor: 'rgba(37,99,235,0.15)'
        }],
        navigator: {
          enabled: true
        },
        scrollbar: {
          enabled: true
        },
        credits: {
          enabled: false
        }
      });
    }

    /***************************************
     * 6) MAIN LOAD FUNCTION
     ***************************************/
    async function loadChart() {
      const symbol = document.getElementById('ticker').value.trim() || "OXY";
      const range = currentRange;  // global variable from range tab selection
      document.getElementById('loading').style.display = 'block';

      try {
        let rawData, points;
        // For 1D and 5D use intraday API; else use historical API
        if (range === "1D" || range === "5D") {
          rawData = await fetchIntradayData(symbol);
          points = parseIntradayData(rawData);
        } else {
          rawData = await fetchHistoricalData(symbol);
          points = parseHistoricalData(rawData);
        }
        // Filter data based on selected range
        points = filterDataForRange(points, range);
        if (points.length === 0) {
          alert("No data found for this symbol and range.");
          return;
        }
        plotChart(points, symbol, range);
        updateTopBar(points, symbol);
      } catch (err) {
        console.error("Error loading data:", err);
        alert("Failed to load data.");
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    /***************************************
     * 7) RANGE TABS & EVENT LISTENERS
     ***************************************/
    let currentRange = "1D"; // Default range
    document.querySelectorAll(".rangeTab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".rangeTab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentRange = tab.getAttribute("data-range");
        loadChart();
      });
    });

    document.getElementById('loadBtn').addEventListener('click', loadChart);

    // Auto-load ticker from URL parameter if provided (e.g. ?ticker=OXY)
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const ticker = params.get('ticker');
      if (ticker) {
        document.getElementById('ticker').value = ticker;
      }
      loadChart();
    });
  </script>
</body>
</html>
