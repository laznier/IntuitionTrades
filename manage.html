<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Subscription | Intuition Trades</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: #222;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 100%;
    }
    h1 { margin-bottom: 1rem; }
    p  { color: #ccc; margin-bottom: 2rem; }
    button {
      background: #16a34a;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #22c55e; }
    a {
      color: #16a34a;
      margin-top: 1.5rem;
      display: inline-block;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #16a34a;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card" id="content">
    <h1>Checking your subscription...</h1>
    <div class="spinner"></div>
  </div>

  <script type="module">
    import { initializeApp }     from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";


    const firebaseConfig = {
      apiKey:    "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
      authDomain:"persuasive-net-456607-g8.firebaseapp.com",
      databaseURL:"https://persuasive-net-456607-g8-default-rtdb.firebaseio.com",
      projectId: "persuasive-net-456607-g8"
    };

    // init
    const app     = initializeApp(firebaseConfig);
    const auth    = getAuth(app);
    const db      = getDatabase(app);
    const content = document.getElementById("content");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // not signed in
        return void (window.location.href = "/login.html");
      }

      // fetch role
      const roleSnap = await get(ref(db, `users/${user.uid}/role`));
      const role     = roleSnap.exists() ? roleSnap.val() : "basic";

      if (role !== "premium") {
        // not premium → send to checkout
        return void (window.location.href = "/checkout.html");
      }

      // premium: render manage UI
      content.innerHTML = `
        <h1>You're a Premium Member</h1>
        <p>Manage your subscription anytime from the Stripe Customer Portal.</p>
        <button id="manageBtn">Manage Subscription</button>
        <a href="/index.html">← Back to Home</a>
      `;

      document.getElementById("manageBtn").addEventListener("click", async () => {
  content.innerHTML = `
    <h1>Redirecting to Stripe...</h1>
    <div class="spinner"></div>
  `;

  try {
    // ✅ trigger backend to create portal session
    await set(ref(db, `customers/${user.uid}/createPortal`), Date.now());

    // 🔁 wait a moment before reading (or implement polling)
    await new Promise(r => setTimeout(r, 2000));

    const portalSnap = await get(ref(db, `customers/${user.uid}/portal_url`));
    const url = portalSnap.val();
    if (!url) throw new Error("Stripe portal URL not available yet.");
    window.location.assign(url);
  } catch (err) {
    content.innerHTML = `
      <h1>Oops!</h1>
      <p>${err.message}</p>
      <a href="/index.html">← Back to Home</a>
    `;
  }
});
});
  </script>
</body>
</html>
