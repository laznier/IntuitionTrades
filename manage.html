<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Subscription | Intuition Trades</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: #222;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
      max-width: 400px;
    }
    h1 {
      margin-bottom: 1rem;
    }
    p {
      color: #ccc;
      margin-bottom: 2rem;
    }
    button {
      background: #16a34a;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #22c55e;
    }
    a {
      color: #16a34a;
      margin-top: 1.5rem;
      display: inline-block;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card" id="content">
    <h1>Checking your subscription...</h1>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
      authDomain: "persuasive-net-456607-g8.firebaseapp.com",
      databaseURL: "https://persuasive-net-456607-g8-default-rtdb.firebaseio.com",
      projectId: "persuasive-net-456607-g8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const content = document.getElementById("content");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "/login.html";
        return;
      }

      const userRef = ref(db, "users/" + user.uid);
      const snap = await get(userRef);
      const role = snap.val()?.role;

      if (role === "premium") {
        content.innerHTML = `
          <h1>You're a Premium Member</h1>
          <p>Manage your subscription anytime from the Stripe portal.</p>
          <button id="manageBtn">Manage Subscription</button>
          <a href="/index.html">← Back to Home</a>
        `;

        document.getElementById("manageBtn").addEventListener("click", async () => {
          content.innerHTML = `<h1>Redirecting to Stripe...</h1>`;

          // Monitor portal URL in Realtime DB
          const portalRef = ref(db, "customers/" + user.uid + "/portal_url");

          onValue(portalRef, (snap) => {
            const url = snap.val();
            if (url) {
              setTimeout(() => window.location.assign(url), 500);
            }
          }, {
            onlyOnce: true
          });
        });

      } else {
        window.location.href = "/checkout.html";
      }
    });
  </script>
</body>
</html>
