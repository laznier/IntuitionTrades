<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Subscription | Intuition Trades</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: #222;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 100%;
    }
    h1 { margin-bottom: 1rem; }
    p  { color: #ccc; margin-bottom: 2rem; }
    button {
      background: #16a34a;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #22c55e; }
    a {
      color: #16a34a;
      margin-top: 1.5rem;
      display: inline-block;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're a Premium Member</h1>
    <p>Manage or cancel your subscription anytime.</p>
    <button onclick="window.location.href='https://billing.stripe.com/p/login/bIY8xueS4baQeOsbII'">

    <a href="/index.html">← Back to Home</a>

</html>
