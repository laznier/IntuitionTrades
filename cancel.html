<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout Canceled | Intuition Trades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Checkout was canceled. You can retry anytime to unlock premium features." />
  <style>
    :root {
      --font-family: 'Arial', sans-serif;
      --text-color: #fff;
      --primary-bg: #333;
      --section-bg: rgba(0, 0, 0, 0.33);
      --accent-color: #eab308;
      --button-bg: #444;
      --button-hover: #555;
      --border-radius: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #111;
      color: var(--text-color);
      font-family: var(--font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    .background-fixed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      z-index: -9999;
      transform: translateZ(0);
    }

    body.day .background-fixed {
      background-image: url('/images/day-background.png');
    }

    body.night .background-fixed {
      background-image: url('/images/night-background.png');
    }

    @media (max-width: 768px) {
      body.day .background-fixed,
      body.night .background-fixed {
        background-size: cover;
      }
    }

    .card {
      background: #222;
      padding: 2rem;
      border-radius: var(--border-radius);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
      max-width: 400px;
      width: 100%;
    }

    h1 {
      color: var(--accent-color);
      margin-bottom: 1rem;
      font-size: 1.75rem;
    }

    p {
      color: #ccc;
      margin-bottom: 2rem;
    }

    a {
      display: inline-block;
      background: var(--button-bg);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: var(--border-radius);
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.3s ease;
    }

    a:hover {
      background: var(--button-hover);
    }
  </style>
</head>
<body>
  <div class="background-fixed"></div>

  <div class="card">
    <h1>Checkout Canceled</h1>
    <p>No worries — you can upgrade anytime to unlock premium tools and remove ads.</p>
    <a href="/checkout.html">Try Again</a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      const hours = now.getHours();
      const sunrise = 6;
      const sunset = 19;
      document.body.classList.add((hours >= sunset || hours < sunrise) ? 'night' : 'day');
    });
  </script>
</body>
</html>
