<body>

  <!-- Detailed Explanation Button -->
  <div style="text-align:center; margin-top:20px;">
    <button id="explanationButton">View Detailed Explanation</button>
  </div>

  <script>
    // Global variable to store analysis details
    let techReport = null;

    /*************** Utility Functions ***************/
    function parseAlphaDate(str) {
      const year  = str.substring(0, 4);
      const month = str.substring(4, 6);
      const day   = str.substring(6, 8);
      return new Date(`${year}-${month}-${day}`);
    }

    // Process historical data; expects keys "5. adjusted close", "2. high", "3. low", and optionally "1. open"
    function processHistoricalData(timeSeries, periodMonths) {
      const dates = Object.keys(timeSeries).sort((a, b) => new Date(a) - new Date(b));
      const endDate = new Date(dates[dates.length - 1]);
      const startDate = new Date(endDate);
      startDate.setMonth(startDate.getMonth() - periodMonths);
      let prices = [];
      for (let date of dates) {
        const dt = new Date(date);
        if (dt >= startDate && dt <= endDate) {
          prices.push({
            date: dt,
            open: timeSeries[date]["1. open"] ? parseFloat(timeSeries[date]["1. open"]) : parseFloat(timeSeries[date]["5. adjusted close"]),
            close: parseFloat(timeSeries[date]["5. adjusted close"]),
            high: parseFloat(timeSeries[date]["2. high"]),
            low: parseFloat(timeSeries[date]["3. low"])
          });
        }
      }
      prices.sort((a, b) => a.date - b.date);
      return prices;
    }

    /*************** Technical Indicator Calculations ***************/
    function computeBollingerBands(prices, period = 20, k = 2) {
      let bands = [];
      for (let i = period - 1; i < prices.length; i++) {
        let slice = prices.slice(i - period + 1, i + 1).map(p => p.close);
        let sma = slice.reduce((a, b) => a + b, 0) / period;
        let variance = slice.reduce((sum, val) => sum + Math.pow(val - sma, 2), 0) / period;
        let std = Math.sqrt(variance);
        bands.push({
          date: prices[i].date,
          sma: sma,
          upper: sma + k * std,
          lower: sma - k * std
        });
      }
      return bands;
    }

    function computeWMA(prices, period = 20) {
      let wmas = [];
      for (let i = period - 1; i < prices.length; i++) {
        let slice = prices.slice(i - period + 1, i + 1).map(p => p.close);
        let numerator = 0, denominator = 0;
        for (let j = 0; j < period; j++) {
          let weight = j + 1;
          numerator += slice[j] * weight;
          denominator += weight;
        }
        wmas.push({ date: prices[i].date, wma: numerator / denominator });
      }
      return wmas;
    }

    function computeRSI(prices, period = 14) {
      let rsis = [];
      for (let i = period; i < prices.length; i++) {
        let gains = 0, losses = 0;
        for (let j = i - period + 1; j <= i; j++) {
          let diff = prices[j].close - prices[j - 1].close;
          if (diff > 0) gains += diff;
          else losses -= diff;
        }
        let avgGain = gains / period;
        let avgLoss = losses / period;
        let rs = (avgLoss === 0) ? 100 : (avgGain / avgLoss);
        let rsi = 100 - (100 / (1 + rs));
        rsis.push({ date: prices[i].date, rsi: rsi });
      }
      return rsis;
    }

    function computeEMA(prices, period) {
      let ema = [];
      let multiplier = 2 / (period + 1);
      let sum = 0;
      for (let i = 0; i < period; i++) {
        sum += prices[i].close;
      }
      let prevEma = sum / period;
      ema[period - 1] = { date: prices[period - 1].date, ema: prevEma };
      for (let i = period; i < prices.length; i++) {
        let cur = prices[i].close;
        let nextEma = (cur - prevEma) * multiplier + prevEma;
        ema[i] = { date: prices[i].date, ema: nextEma };
        prevEma = nextEma;
      }
      return ema.filter(x => x !== undefined);
    }

    // Updated MACD Calculation (EMA-based) remains unchanged.
    function computeMACD(prices, fast = 12, slow = 26, signal = 9) {
      let fastEMA = computeEMA(prices, fast);
      let slowEMA = computeEMA(prices, slow);
      let macdLine = [];
      for (let i = 0; i < slowEMA.length; i++) {
        let date = slowEMA[i].date;
        let match = fastEMA.find(f => f.date.getTime() === date.getTime());
        if (match) {
          macdLine.push({ date: date, macd: match.ema - slowEMA[i].ema });
        }
      }
      if (macdLine.length < signal) return { macdLine: macdLine, signalLine: [] };
      let signalLine = [];
      let m = 2 / (signal + 1);
      let sumMacd = 0;
      for (let i = 0; i < signal; i++) {
        sumMacd += macdLine[i].macd;
      }
      let prevSig = sumMacd / signal;
      signalLine[signal - 1] = { date: macdLine[signal - 1].date, signal: prevSig };
      for (let i = signal; i < macdLine.length; i++) {
        let s = (macdLine[i].macd - prevSig) * m + prevSig;
        signalLine[i] = { date: macdLine[i].date, signal: s };
        prevSig = s;
      }
      signalLine = signalLine.filter(x => x !== undefined);
      return { macdLine: macdLine, signalLine: signalLine };
    }

    /*************** Ichimoku Cloud Calculation ***************/
    function computeIchimoku(prices) {
      let tenkan = [];
      let kijun = [];
      let senkouA = [];
      let senkouB = [];
      // Tenkan-sen (Conversion Line): 9-period high and low average
      for (let i = 8; i < prices.length; i++) {
        let period9 = prices.slice(i - 8, i + 1);
        let high9 = Math.max(...period9.map(p => p.high));
        let low9 = Math.min(...period9.map(p => p.low));
        tenkan.push({ date: prices[i].date, value: (high9 + low9) / 2 });
      }
      // Kijun-sen (Base Line): 26-period high and low average
      for (let i = 25; i < prices.length; i++) {
        let period26 = prices.slice(i - 25, i + 1);
        let high26 = Math.max(...period26.map(p => p.high));
        let low26 = Math.min(...period26.map(p => p.low));
        kijun.push({ date: prices[i].date, value: (high26 + low26) / 2 });
      }
      // Senkou Span A: (Tenkan-sen + Kijun-sen) / 2, plotted 26 periods ahead
      let minLen = Math.min(tenkan.length, kijun.length);
      for (let i = 0; i < minLen; i++) {
        let baseDate = kijun[i].date;
        let senkouDate = new Date(baseDate);
        senkouDate.setDate(senkouDate.getDate() + 26);
        senkouA.push({ date: senkouDate, value: (tenkan[i].value + kijun[i].value) / 2 });
      }
      // Senkou Span B: 52-period high and low average, plotted 26 periods ahead
      for (let i = 51; i < prices.length; i++) {
        let period52 = prices.slice(i - 51, i + 1);
        let high52 = Math.max(...period52.map(p => p.high));
        let low52 = Math.min(...period52.map(p => p.low));
        let baseDate = prices[i].date;
        let senkouDate = new Date(baseDate);
        senkouDate.setDate(senkouDate.getDate() + 26);
        senkouB.push({ date: senkouDate, value: (high52 + low52) / 2 });
      }
      // Chikou Span: Today's close, plotted 26 periods back
      let chikou = [];
      for (let i = 26; i < prices.length; i++) {
        chikou.push({ date: prices[i - 26].date, value: prices[i].close });
      }
      return {
        tenkan: tenkan,
        kijun: kijun,
        senkouA: senkouA,
        senkouB: senkouB,
        chikou: chikou
      };
    }

    /*************** Scoring Functions ***************/
    function scoreRSI(latestRSI, prevRSI) {
      let rel = 50 - latestRSI;
      let base = 100 / (1 + Math.exp(-0.05 * rel));
      let dRSI = prevRSI - latestRSI;
      return base * (1 + 0.01 * dRSI);
    }

    function scoreBollingerDual(latestPrice, latestBand, prevPrice, prevBand) {
      let currentPercentB = (latestPrice - latestBand.lower) / (latestBand.upper - latestBand.lower);
      let prevPercentB = (prevPrice - prevBand.lower) / (prevBand.upper - prevBand.lower);
      let baseBB = 100 / (1 + Math.exp(3 * (currentPercentB - 0.5)));
      let dPercentB = prevPercentB - currentPercentB;
      return baseBB * (1 + 0.1 * dPercentB);
    }

    function scoreWMADual(latestPrice, latestWMA, prevPrice, prevWMA) {
      let currentX = (latestPrice / latestWMA) - 1;
      let prevX = (prevPrice / prevWMA) - 1;
      let baseWMA = 100 / (1 + Math.exp(-10 * currentX));
      let dx = prevX - currentX;
      return baseWMA * (1 + 0.5 * dx);
    }

    /*************** Plotting Functions ***************/
    function plotRSI(prices) {
      let rsidata = computeRSI(prices);
      let traceRSI = {
        x: rsidata.map(item => item.date),
        y: rsidata.map(item => item.rsi),
        mode: 'lines',
        name: 'RSI',
        line: { color: 'orange' }
      };
      let layout = {
        title: "RSI Chart",
        xaxis: { title: "Date" },
        yaxis: { title: "RSI", range: [0, 100] },
        dragmode: 'zoom',
        shapes: [
          {
            type: 'line',
            xref: 'paper',
            x0: 0,
            x1: 1,
            yref: 'y',
            y0: 70,
            y1: 70,
            line: { dash: 'dash', color: 'red' }
          },
          {
            type: 'line',
            xref: 'paper',
            x0: 0,
            x1: 1,
            yref: 'y',
            y0: 30,
            y1: 30,
            line: { dash: 'dash', color: 'red' }
          }
        ]
      };
      Plotly.newPlot("rsiChart", [traceRSI], layout);
      return rsidata;
    }

    function plotBollinger(prices) {
      let bands = computeBollingerBands(prices);
      let dates = bands.map(b => b.date);
      let sma = bands.map(b => b.sma);
      let upper = bands.map(b => b.upper);
      let lower = bands.map(b => b.lower);
      
      let traceSMA = {
        x: dates,
        y: sma,
        mode: 'lines',
        name: 'SMA'
      };
      let traceUpper = {
        x: dates,
        y: upper,
        mode: 'lines',
        name: 'Upper Band'
      };
      let traceLower = {
        x: dates,
        y: lower,
        mode: 'lines',
        name: 'Lower Band'
      };
      let tracePrice = {
        x: prices.map(p => p.date),
        y: prices.map(p => p.close),
        mode: 'lines',
        name: 'Price',
        line: { color: 'black' }
      };
      
      let layout = {
        title: "Bollinger Bands",
        xaxis: { title: "Date" },
        yaxis: { title: "Price" },
        dragmode: 'zoom'
      };
      Plotly.newPlot("bbChart", [tracePrice, traceSMA, traceUpper, traceLower], layout);
      return bands;
    }

    function plotMACD(prices) {
      let macdData = computeMACD(prices);
      let datesMACD = macdData.macdLine.map(item => item.date);
      let macdValues = macdData.macdLine.map(item => item.macd);
      let datesSignal = macdData.signalLine.map(item => item.date);
      let signalValues = macdData.signalLine.map(item => item.signal);
      
      let histDates = [];
      let histValues = [];
      let len = Math.min(macdData.macdLine.length, macdData.signalLine.length);
      for (let i = 0; i < len; i++) {
        histDates.push(macdData.macdLine[i].date);
        histValues.push(macdData.macdLine[i].macd - macdData.signalLine[i].signal);
      }
      let traceHist = {
        x: histDates,
        y: histValues,
        type: 'bar',
        name: 'Histogram',
        marker: {
          color: histValues.map(val => val >= 0 ? 'green' : 'red')
        }
      };
      let traceMACD = {
        x: datesMACD,
        y: macdValues,
        mode: 'lines',
        name: 'MACD',
        line: { color: 'blue' }
      };
      let traceSignal = {
        x: datesSignal,
        y: signalValues,
        mode: 'lines',
        name: 'Signal',
        line: { color: 'orange' }
      };
      let layout = {
        title: "MACD Chart",
        xaxis: { title: "Date" },
        yaxis: { title: "MACD" },
        dragmode: 'zoom'
      };
      Plotly.newPlot("macdChart", [traceHist, traceMACD, traceSignal], layout);
      return macdData;
    }

    function plotWMA(prices) {
      let wmas = computeWMA(prices);
      let traceWMA = {
        x: wmas.map(item => item.date),
        y: wmas.map(item => item.wma),
        mode: 'lines',
        name: 'WMA'
      };
      let tracePrice = {
        x: prices.map(p => p.date),
        y: prices.map(p => p.close),
        mode: 'lines',
        name: 'Price',
        line: { color: 'black' }
      };
      let layout = {
        title: "WMA Chart",
        xaxis: { title: "Date" },
        yaxis: { title: "Price" },
        dragmode: 'zoom'
      };
      Plotly.newPlot("wmaChart", [tracePrice, traceWMA], layout);
      return wmas;
    }

    function plotCandlestickIchimoku(prices, ichimokuData) {
      let dates = prices.map(p => p.date);
      let open = prices.map(p => p.open);
      let high = prices.map(p => p.high);
      let low = prices.map(p => p.low);
      let close = prices.map(p => p.close);
      let traceCandlestick = {
        x: dates,
        open: open,
        high: high,
        low: low,
        close: close,
        type: 'candlestick',
        name: 'Price'
      };
      let traceTenkan = {
        x: ichimokuData.tenkan.map(item => item.date),
        y: ichimokuData.tenkan.map(item => item.value),
        mode: 'lines',
        name: 'Tenkan-sen',
        line: { dash: 'dash', color: 'blue' }
      };
      let traceKijun = {
        x: ichimokuData.kijun.map(item => item.date),
        y: ichimokuData.kijun.map(item => item.value),
        mode: 'lines',
        name: 'Kijun-sen',
        line: { dash: 'dash', color: 'red' }
      };
      let traceSenkouA = {
        x: ichimokuData.senkouA.map(item => item.date),
        y: ichimokuData.senkouA.map(item => item.value),
        mode: 'lines',
        name: 'Senkou Span A',
        line: { color: 'green' }
      };
      let traceSenkouB = {
        x: ichimokuData.senkouB.map(item => item.date),
        y: ichimokuData.senkouB.map(item => item.value),
        mode: 'lines',
        name: 'Senkou Span B',
        line: { color: 'brown' },
        fill: 'tonexty'
      };
      let traceChikou = {
        x: ichimokuData.chikou.map(item => item.date),
        y: ichimokuData.chikou.map(item => item.value),
        mode: 'lines',
        name: 'Chikou Span',
        line: { color: 'purple' }
      };
      let layout = {
        title: "Candlestick Chart with Ichimoku Cloud",
        xaxis: { title: "Date" },
        yaxis: { title: "Price" },
        dragmode: 'zoom'
      };
      Plotly.newPlot("ichimokuChart", [traceCandlestick, traceTenkan, traceKijun, traceSenkouA, traceSenkouB, traceChikou], layout);
    }

    /*************** New MACD Scoring System ***************/
    function polynomialRegression(x, y, degree) {
      let X = [];
      for (let i = 0; i < x.length; i++) {
        let row = [];
        for (let j = 0; j <= degree; j++) {
          row.push(Math.pow(x[i], j));
        }
        X.push(row);
      }
      const XT = math.transpose(X);
      const XTX = math.multiply(XT, X);
      const XTy = math.multiply(XT, y);
      const coeffsMatrix = math.lusolve(XTX, XTy);
      const coeffs = coeffsMatrix.map(val => val[0]);
      return coeffs;
    }
    function predictValue(coeffs, x) {
      return coeffs.reduce((sum, coeff, i) => sum + coeff * Math.pow(x, i), 0);
    }
    function computeMomentumScoreUsingRegression(histValues) {
      if (histValues.length < 6) return null;
      const recentHist = histValues.slice(-6);
      const x = [1, 2, 3, 4, 5, 6];
      const coeffs = polynomialRegression(x, recentHist, 3);
      const predicted = predictValue(coeffs, 7);
      const lastValue = recentHist[recentHist.length - 1];
      const delta = predicted - lastValue;
      const k = 5;
      const score = 100 / (1 + Math.exp(-k * delta));
      return score;
    }
    function computeGapTrendScore(macdLine, signalLine) {
      if (macdLine.length < 6 || signalLine.length < 6) return null;
      const recentMACD = macdLine.slice(-6).map(item => item.macd);
      const recentSignal = signalLine.slice(-6).map(item => item.signal);
      const x = [1, 2, 3, 4, 5, 6];
      const macdCoeffs = polynomialRegression(x, recentMACD, 3);
      const signalCoeffs = polynomialRegression(x, recentSignal, 3);
      const predictedMACD = predictValue(macdCoeffs, 7);
      const predictedSignal = predictValue(signalCoeffs, 7);
      const predictedGap = predictedMACD - predictedSignal;
      const currentGap = macdLine[macdLine.length - 1].macd - signalLine[signalLine.length - 1].signal;
      const delta = predictedGap - currentGap;
      const k = 5;
      const gapScore = 100 / (1 + Math.exp(-k * delta));
      return { gapScore, delta, currentGap, predictedGap };
    }
    function computeNewMACDScore(prices) {
      const macdData = computeMACD(prices);
      const macdLine = macdData.macdLine;
      const signalLine = macdData.signalLine;
      if (macdLine.length < 2 || signalLine.length < 2) return null;
      
      const len = Math.min(macdLine.length, signalLine.length);
      const latestMACD = macdLine[len - 1].macd;
      const positionScore = 100 / (1 + Math.exp(latestMACD));
      const gapData = computeGapTrendScore(macdLine, signalLine);
      const gapScore = gapData ? gapData.gapScore : null;
      let histValues = [];
      for (let i = 0; i < len; i++) {
        histValues.push(macdLine[i].macd - signalLine[i].signal);
      }
      const momentumScore = computeMomentumScoreUsingRegression(histValues);
      const finalScore = (positionScore + gapScore + momentumScore) / 3;
      console.log("New MACD Scores -> Position:", positionScore.toFixed(2),
                  "Gap:", gapScore.toFixed(2),
                  "Momentum:", momentumScore.toFixed(2),
                  "Final:", finalScore.toFixed(2));
      return finalScore;
    }

    /*************** Additional Scoring Functions for Ichimoku ***************/
    function scoreCloud(currentPrice, senkouA, senkouB) {
      let cloudTop = Math.max(senkouA, senkouB);
      let cloudBottom = Math.min(senkouA, senkouB);
      let mid = (cloudTop + cloudBottom) / 2;
      let half = (cloudTop - cloudBottom) / 2 || 1;
      let norm = (currentPrice - mid) / half;
      let C = 1;
      return 100 / (1 + Math.exp(-C * norm));
    }
    function scoreTenkan(tenkan, kijun) {
      let diff = tenkan - kijun;
      let D = 0.2;
      return 100 / (1 + Math.exp(-D * diff));
    }
    function scoreChikou(currentPrice, price26Ago) {
      let diff = currentPrice - price26Ago;
      let E = 0.1;
      return 100 / (1 + Math.exp(-E * diff));
    }
    function scoreSenkou(senkouA, senkouB) {
      let diff = senkouA - senkouB;
      let avg = (senkouA + senkouB) / 2 || 1;
      let norm = diff / avg;
      let F = 3;
      return 100 / (1 + Math.exp(-F * norm));
    }
    function overallIchimokuScore(cloudScore, tenkanScore, chikouScore, senkouScore) {
      return (cloudScore + tenkanScore + chikouScore + senkouScore) / 4;
    }
