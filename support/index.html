<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Support Scanner - Bounce Detector</title>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <style>
    :root {
      --bg: #111;
      --panel: #1e1e1e;
      --accent: #16a34a;
      --danger: #dc2626;
      --text: #fff;
      --font: 'Arial', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      margin: 0 auto;
      padding: 2rem;
      max-width: 1000px;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    select, button {
      font-size: 1rem;
      margin: 0.5rem 0;
      padding: 0.5rem;
      background: var(--panel);
      border: 1px solid #333;
      color: var(--text);
      border-radius: 4px;
    }
    button {
      background-color: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background-color: #22c55e;
    }
    .chart-container {
      height: 400px;
      margin-top: 20px;
    }
    #log {
      background: var(--panel);
      border: 1px solid #333;
      padding: 1rem;
      border-radius: 6px;
      white-space: pre-wrap;
      font-family: monospace;
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>📈 Bounce Scanner (Premium)</h1>

  <label>Choose Index:</label>
  <select id="indexSelect">
    <option value="">-- Select --</option>
    <option value="sp500">S&P 500</option>
    <option value="russell3000">Russell 3000</option>
    <option value="vti">VTI</option>
  </select>

  <label>Choose Timeframe:</label>
  <select id="timeframeSelect">
    <option value="">-- Select --</option>
    <option value="short">Short (4mo)</option>
    <option value="medium">Medium (12mo)</option>
    <option value="long">Long (24mo)</option>
  </select>

  <br/>
  <button id="runBtn">Run Scanner</button>

  <div id="log"></div>
  <div id="chartHolder"></div>

  <script>
    const log = msg => {
      const el = document.getElementById('log');
      el.innerHTML += msg + '\n';
      el.scrollTop = el.scrollHeight;
    };
    
    const sleep = ms => new Promise(res => setTimeout(res, ms));
    
    // ... keep fetchHistoricalData, loadTickers, sliceByMonths, detectSupportZones, scoreSupportMatch exactly as before ...
    
    async function simulateOne(ticker, months){
      try {
        const raw   = await fetchHistoricalData(ticker);
        const data  = sliceByMonths(raw, months);
        if (data.length < 50) { log(`❌ ${ticker}: Not enough data`); return; }
    
        const slope       = data[data.length-1].close - data[data.length-10].close;
        const supports    = detectSupportZones(data);
        const currentPrice= data[data.length-1].close;
    
        const nearby = supports
          .filter(s => Math.abs(currentPrice - s.price)/s.price <= 0.05)
          .sort((a,b) => Math.abs(currentPrice - a.price) - Math.abs(currentPrice - b.price));
    
        if (!nearby.length) {
          log(`⚪ ${ticker}: No nearby support`);
          return;
        }
    
        const best  = nearby[0];
        const score = scoreSupportMatch(currentPrice, best, slope);
    
        log(`✅ ${ticker}: Score ${score} | Support ~$${best.price.toFixed(2)} (${best.touches} touches)`);
    
        const holder = document.getElementById('chartHolder');
        // ← **do not** clear holder here any more!
    
        // give each ticker its own chart div
        const chartEl = document.createElement('div');
        chartEl.className = 'chart-container';
        chartEl.id = `chart-${ticker}`;
        holder.appendChild(chartEl);
    
        Highcharts.chart(chartEl, {
          chart: { type:'line', backgroundColor:'transparent' },
          title: { text:`${ticker} | Score: ${score}`, style:{ color:'#fff' } },
          xAxis: { type:'datetime' },
          yAxis: {
            title:{ text:'Price' },
            plotLines: [{
              value: best.price,
              color: '#16a34a',
              dashStyle: 'ShortDash',
              width: 2,
              label:{ text:'Support', style:{ color:'#16a34a' } }
            }]
          },
          series:[{
            name:'Close',
            data: data.map(p=>[p.date.getTime(),p.close]),
            color: '#0ea5e9',
            marker:{ enabled:false }
          }],
          credits:{ enabled:false }
        });
    
      } catch (err) {
        log(`❌ ${ticker}: Error - ${err.message}`);
      }
    }
    
    async function runScanner(){
      const index = document.getElementById('indexSelect').value;
      const tf    = document.getElementById('timeframeSelect').value;
      if (!index || !tf)
        return alert('Please select both index and timeframe.');
    
      const months = tf==='short'?4: tf==='medium'?12:24;
    
      // clear everything just once
      document.getElementById('log').innerHTML = '';
      document.getElementById('chartHolder').innerHTML = '';
      log(`🔎 Scanning ${index.toUpperCase()} over last ${months}mo…\n`);
    
      const tickers = await loadTickers(index);
      for (let i=0; i<tickers.length; i++){
        log(`\n➡️ ${tickers[i]}`);
        await simulateOne(tickers[i], months);
        await sleep(300);
      }
    
      log(`\n✅ Scan Complete.`);
    }
    
    document.getElementById('runBtn').addEventListener('click', runScanner);
    </script>
    

</body>
</html>
