<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support &amp; Resistance Scanner</title>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <style>
    :root {
      --primary-bg: #111;
      --secondary-bg: #333;
      --accent-color: #16a34a;
      --text-color: #fff;
      --font-family: 'Arial', sans-serif;
      --transition-speed: 0.3s;
    }
    body {
      font-family: var(--font-family);
      background-color: var(--primary-bg);
      color: var(--text-color);
      margin: 0 auto;
      line-height: 1.6;
      max-width: 900px;
      padding: 2rem;
    }
    h1 { text-align: center; margin-bottom: 1rem; font-weight: 600; }
    .param-section { border: 1px solid #444; background-color: var(--secondary-bg); padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
    label, select, input { display: block; margin: 0.3rem 0; font-size: 1rem; }
    button { font-size: 1rem; padding: 0.5rem 1rem; cursor: pointer; margin-bottom: 1rem; border: none; border-radius: 4px; background: var(--accent-color); color: var(--text-color); transition: background var(--transition-speed), transform 0.2s ease; }
    button:hover { background: #1e3a8a; transform: scale(1.05); }
    #status { margin-top: 1rem; white-space: pre-wrap; font-family: monospace; background: var(--secondary-bg); padding: 1rem; border: 1px solid #444; border-radius: 4px; max-height: 300px; overflow-y: auto; }
    #progressContainer { margin-top: 1rem; display: none; background-color: var(--secondary-bg); padding: 1rem; border-radius: 8px; text-align: center; }
    .progress-bar-base { width: 100%; background-color: #222; border-radius: 10px; height: 24px; overflow: hidden; position: relative; margin-bottom: 0.5rem; }
    .progress-bar-fill { height: 100%; width: 0; background-color: var(--accent-color); transition: width var(--transition-speed) ease-in-out; }
    .progress-bar-text { position: absolute; width: 100%; top: 0; height: 100%; text-align: center; line-height: 24px; font-weight: bold; color: #fff; }
    .chart-container { margin-top: 20px; width: 100%; height: 400px; }
  </style>
</head>
<body>
  <button onclick="window.location.href='https://www.intuitiontrades.com'">Back to Main Page</button>
  <h1>Support &amp; Resistance Scanner (Premium)</h1>

  <div class="param-section">
    <label>Select Index:
      <select id="indexSelect">
        <option value="">-- Select an Index --</option>
        <option value="sp500">SP500</option>
        <option value="russell3000">Russell 3000</option>
        <option value="vti">VTI</option>
      </select>
    </label>
    <label>Timeframe:
      <select id="timeframeSelect">
        <option value="">-- Select Timeframe --</option>
        <option value="short">Short Term (4 mo)</option>
        <option value="medium">Medium Term (12 mo)</option>
        <option value="long">Long Term (24 mo)</option>
      </select>
    </label>
    <label>ZigZag Threshold (% move):
      <input type="number" id="zzThreshold" value="5" min="0" max="100" step="0.1">
    </label>
  </div>

  <button id="runBtn">Run Scanner</button>
  <div id="progressContainer">
    <div class="progress-bar-base">
      <div id="progressFill" class="progress-bar-fill"></div>
      <div id="progressText" class="progress-bar-text">0%</div>
    </div>
  </div>
  <div id="status"></div>

  <div id="chartHolder"></div>

<script>
// Utility: load tickers list
async function loadTickers(index) {
  const url = `https://intuition-trades.vercel.app/tickers/${index}-tickers.txt`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(resp.statusText);
  const txt = await resp.text();
  return txt.replace(/"/g, '').split(/,|\n/).map(t=>t.trim()).filter(t=>t);
}

function log(msg){
  const s = document.getElementById('status');
  s.innerHTML += msg + '\n';
  s.scrollTop = s.scrollHeight;
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function fetchHistoricalData(ticker){
  const resp = await fetch(`/api/historical?symbol=${ticker}`);
  const j = await resp.json();
  const ts = j['Time Series (Daily)'] || {};
  return Object.entries(ts).map(([d,v])=>({ date:new Date(d), close:+v['4. close'] }))
    .sort((a,b)=>a.date - b.date);
}

function sliceByMonths(data, months){
  const end = data[data.length-1].date;
  const start = new Date(end);
  start.setMonth(start.getMonth()-months);
  return data.filter(p=>p.date>=start);
}

// ZigZag detection
function zigzag(data, pct){
  const threshold = pct/100;
  let pivots=[];
  let lastPivotPrice = data[0].close;
  let lastPivotIdx = 0;
  let dir = null;
  for(let i=1;i<data.length;i++){
    const price = data[i].close;
    const change = (price - lastPivotPrice)/lastPivotPrice;
    if(dir===null){
      if(Math.abs(change)>=threshold){
        dir = change>0?'up':'down';
        pivots.push({ type: dir==='up'?'trough':'peak', price:lastPivotPrice, idx:lastPivotIdx });
        pivots.push({ type: dir==='up'?'peak':'trough', price, idx:i });
        lastPivotPrice = price;
        lastPivotIdx = i;
      }
    } else if(dir==='up'){
      if(price> lastPivotPrice){ lastPivotPrice=price; lastPivotIdx=i; }
      else if((lastPivotPrice-price)/lastPivotPrice>=threshold){
        pivots.push({ type:'peak', price:lastPivotPrice, idx:lastPivotIdx });
        pivots.push({ type:'trough', price, idx:i });
        dir='down'; lastPivotPrice=price; lastPivotIdx=i;
      }
    } else {
      if(price< lastPivotPrice){ lastPivotPrice=price; lastPivotIdx=i; }
      else if((price-lastPivotPrice)/lastPivotPrice>=threshold){
        pivots.push({ type:'trough', price:lastPivotPrice, idx:lastPivotIdx });
        pivots.push({ type:'peak', price, idx:i });
        dir='up'; lastPivotPrice=price; lastPivotIdx=i;
      }
    }
  }
  return pivots;
}

function avgLast(arr, n){ if(arr.length<1) return null; const slice=arr.slice(-n); return slice.reduce((s,v)=>s+v.price,0)/slice.length; }

async function simulateOneTicker(ticker, months, threshold){
  try{
    const full = await fetchHistoricalData(ticker);
    const hist = sliceByMonths(full, months);
    if(hist.length<10){ log(` ${ticker}: insufficient data.`); return null; }

    // ZigZag
    const piv = zigzag(hist, threshold);
    const peaks = piv.filter(p=>p.type==='peak');
    const troughs = piv.filter(p=>p.type==='trough');
    const res = avgLast(peaks,3);
    const sup = avgLast(troughs,3);

    // Plot
    const containerId = `chart-${ticker}`;
    const holder = document.getElementById('chartHolder');
    const div = document.createElement('div'); div.id = containerId; div.className='chart-container';
    holder.innerHTML=''; holder.appendChild(div);

    Highcharts.chart(containerId,{
      chart:{ type:'line', backgroundColor:'transparent' },
      title:{ text:ticker, style:{ color:'#fff' } },
      xAxis:{ type:'datetime' },
      yAxis:{
        title:{ text:'Price', style:{ color:'#fff' } },
        plotLines: [
          { value:res, color:'red', width:2, dashStyle:'ShortDash', label:{ text:'Resistance', style:{ color:'red' } } },
          { value:sup, color:'green', width:2, dashStyle:'ShortDash', label:{ text:'Support', style:{ color:'green' } } }
        ]
      },
      series:[{ name:'Close', data:hist.map(p=>[p.date.getTime(),p.close]), color:'#06b6d4', marker:{ enabled:false } }],
      credits:{ enabled:false }
    });

    // Score
    const P = hist[hist.length-1].close;
    let raw = (res && sup)? 1 - (P - sup)/(res - sup) : 0.5;
    raw = Math.max(0, Math.min(1, raw));
    const score = Math.round(raw*100);
    log(` ${ticker}: Support Score = ${score}`);
    return { ticker, score };
  }catch(e){ log(` ${ticker}: error ${e.message}`); return null; }
}

async function runScanner(){
  document.getElementById('status').innerHTML='';
  const idx = document.getElementById('indexSelect').value;
  const tf = document.getElementById('timeframeSelect').value;
  const thr = parseFloat(document.getElementById('zzThreshold').value)||5;
  if(!idx||!tf){ alert('Select index & timeframe'); return; }
  const months = tf==='short'?4: tf==='medium'?12:24;

  // load tickers
  let tks=[];
  try{ tks = await loadTickers(idx); log(`Loaded ${tks.length} tickers`); } catch(e){ alert('Failed to load tickers'); return; }

  document.getElementById('progressContainer').style.display='block';
  const fill = document.getElementById('progressFill'); const txt = document.getElementById('progressText');

  for(let i=0;i<tks.length;i++){
    const pct = Math.round((i+1)/tks.length*100);
    fill.style.width=`${pct}%`; txt.textContent=`${pct}%`;
    await simulateOneTicker(tks[i], months, thr);
    await sleep(500); // brief pause between plots
  }
  log('\nDone scanning all tickers.');
}

// Bind
window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('runBtn').addEventListener('click',runScanner);
});
</script>
</body>
</html>
