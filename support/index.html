<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Support Scanner - Bounce Detector</title>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <style>
    :root {
      --bg: #111;
      --panel: #1e1e1e;
      --accent: #16a34a;
      --danger: #dc2626;
      --text: #fff;
      --font: 'Arial', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      margin: 0 auto;
      padding: 2rem;
      max-width: 1000px;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    select, button {
      font-size: 1rem;
      margin: 0.5rem 0;
      padding: 0.5rem;
      background: var(--panel);
      border: 1px solid #333;
      color: var(--text);
      border-radius: 4px;
    }
    button {
      background-color: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background-color: #22c55e;
    }
    .chart-container {
      height: 400px;
      margin-top: 20px;
    }
    #log {
      background: var(--panel);
      border: 1px solid #333;
      padding: 1rem;
      border-radius: 6px;
      white-space: pre-wrap;
      font-family: monospace;
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>📈 Bounce Scanner (Premium)</h1>

  <label>Choose Index:</label>
  <select id="indexSelect">
    <option value="">-- Select --</option>
    <option value="sp500">S&P 500</option>
    <option value="russell3000">Russell 3000</option>
    <option value="vti">VTI</option>
  </select>

  <label>Choose Timeframe:</label>
  <select id="timeframeSelect">
    <option value="">-- Select --</option>
    <option value="short">Short (4mo)</option>
    <option value="medium">Medium (12mo)</option>
    <option value="long">Long (24mo)</option>
  </select>

  <br/>
  <button id="runBtn">Run Scanner</button>

  <div id="log"></div>
  <div id="chartHolder"></div>

<script>
const log = msg => {
  const el = document.getElementById('log');
  el.innerHTML += msg + '\n';
  el.scrollTop = el.scrollHeight;
};

const sleep = ms => new Promise(res => setTimeout(res, ms));

async function fetchHistoricalData(ticker){
  const res = await fetch(`/api/historical?symbol=${ticker}`);
  const json = await res.json();
  const raw = json['Time Series (Daily)'] || {};
  return Object.entries(raw)
    .map(([d, v]) => ({ date: new Date(d), close: +v['4. close'] }))
    .sort((a, b) => a.date - b.date);
}

async function loadTickers(index){
  const url = `https://intuition-trades.vercel.app/tickers/${index}-tickers.txt`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.statusText);
  const txt = await res.text();
  return txt.split(/,|\n/).map(s => s.trim()).filter(Boolean);
}

function sliceByMonths(data, months){
  const end = data[data.length - 1].date;
  const start = new Date(end);
  start.setMonth(start.getMonth() - months);
  return data.filter(p => p.date >= start);
}

function detectSupportZones(data){
  const bins = new Map();
  const bucketSize = 0.5; // dollar resolution
  const tolerance = 0.01;

  for (let i = 1; i < data.length - 1; i++) {
    const prev = data[i - 1].close;
    const curr = data[i].close;
    const next = data[i + 1].close;

    if (curr < prev && curr < next) {
      const bucket = Math.round(curr / bucketSize) * bucketSize;
      if (!bins.has(bucket)) bins.set(bucket, []);
      bins.get(bucket).push(data[i]);
    }
  }

  return Array.from(bins.entries())
    .filter(([, points]) => points.length >= 2)
    .map(([price, touches]) => ({
      price,
      touches: touches.length,
      recentDate: touches[touches.length - 1].date
    }));
}

function scoreSupportMatch(currentPrice, support, slope){
  const proximity = Math.abs(currentPrice - support.price) / support.price;
  const distanceScore = Math.max(0, 1 - proximity / 0.05); // within 5%
  const touchScore = Math.min(1, support.touches / 4);     // 2–4 touches
  const recentBonus = (new Date() - support.recentDate < 90 * 86400000) ? 1 : 0; // within 3 months
  const directionBonus = slope < 0 ? 1 : 0; // falling into support

  const raw = 0.6 * distanceScore + 0.2 * touchScore + 0.1 * recentBonus + 0.1 * directionBonus;
  return Math.round(100 * Math.max(0.01, Math.min(0.99, raw))); // score between 1–99
}

async function simulateOne(ticker, months){
  try {
    const raw = await fetchHistoricalData(ticker);
    const data = sliceByMonths(raw, months);
    if (data.length < 50) { log(`❌ ${ticker}: Not enough data`); return; }

    const slope = data[data.length-1].close - data[data.length-10].close;
    const supports = detectSupportZones(data);
    const currentPrice = data[data.length-1].close;

    const nearby = supports
      .filter(s => Math.abs(currentPrice - s.price)/s.price <= 0.05)
      .sort((a,b) => Math.abs(currentPrice - a.price) - Math.abs(currentPrice - b.price));

    if (!nearby.length) {
      log(`⚪ ${ticker}: No nearby support`);
      return;
    }

    const best = nearby[0];
    const score = scoreSupportMatch(currentPrice, best, slope);

    log(`✅ ${ticker}: Score ${score} | Support ~$${best.price.toFixed(2)} (${best.touches} touches)`);

    const holder = document.getElementById('chartHolder');
    holder.innerHTML = '';
    const chartEl = document.createElement('div');
    chartEl.className = 'chart-container';
    holder.appendChild(chartEl);

    Highcharts.chart(chartEl, {
      chart: { type: 'line', backgroundColor: 'transparent' },
      title: { text: `${ticker} | Score: ${score}`, style: { color: '#fff' } },
      xAxis: { type: 'datetime' },
      yAxis: {
        title: { text: 'Price' },
        plotLines: [{
          value: best.price,
          color: '#16a34a',
          dashStyle: 'ShortDash',
          width: 2,
          label: { text: 'Support', style: { color: '#16a34a' } }
        }]
      },
      series: [{
        name: 'Close',
        data: data.map(p => [p.date.getTime(), p.close]),
        color: '#0ea5e9',
        marker: { enabled: false }
      }],
      credits: { enabled: false }
    });

  } catch (err) {
    log(`❌ ${ticker}: Error - ${err.message}`);
  }
}

async function runScanner(){
  const index = document.getElementById('indexSelect').value;
  const tf = document.getElementById('timeframeSelect').value;
  const months = tf === 'short' ? 4 : tf === 'medium' ? 12 : 24;

  if (!index || !tf) return alert('Please select both index and timeframe.');

  document.getElementById('log').innerHTML = '';
  document.getElementById('chartHolder').innerHTML = '';
  log(`🔎 Running bounce detection on ${index.toUpperCase()} (${months} months)...`);

  const tickers = await loadTickers(index);
  for (let i = 0; i < tickers.length; i++) {
    log(`\n➡️ ${tickers[i]}`);
    await simulateOne(tickers[i], months);
    await sleep(300); // Reduce load
  }

  log(`\n✅ Scan Complete.`);
}

document.getElementById('runBtn').addEventListener('click', runScanner);
</script>

</body>
</html>
