<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Processing Sign-In...</title>
</head>
<body>
  <script>
    // Your token extraction and API call logic here
    const params = new URLSearchParams(window.location.search);
    const token = params.get("credential");
    
    if (token) {
      fetch("/api/verify-google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      })
        .then(res => res.json())
        .then(data => {
          if (data.authorized) {
            window.location.href = "/top5/index.html";
          } else {
            alert("Access denied: Premium membership required.");
            window.location.href = "/";
          }
        })
        .catch(error => {
          console.error("Verification error:", error);
          alert("Error verifying sign-in. Please try again.");
          window.location.href = "/";
        });
    } else {
      alert("No token received.");
      window.location.href = "/";
    }
  </script>
</body>
</html>
