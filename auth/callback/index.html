<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Callback Retired | Intuition Trades</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(100%, 40rem);
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.82);
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    }
    h1 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: clamp(2rem, 5vw, 3rem);
    }
    p {
      color: #cbd5e1;
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      background: #0f766e;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sign-in callback retired</h1>
    <p>
      Google sign-in and premium verification have been removed from Intuition Trades. This legacy
      callback endpoint no longer performs any authorization work.
    </p>
    <a href="/">Return Home</a>
  </main>
</body>
</html>
