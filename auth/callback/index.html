<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("credential");
  
    if (token) {
      // POST the token to your serverless function for verification
      fetch("/api/verify-google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      })
      .then(res => res.json())
      .then(data => {
        if (data.authorized) {
          window.location.href = "/top5/index.html";
        } else {
          alert("Premium access required.");
          window.location.href = "/";
        }
      })
      .catch(() => {
        alert("Failed to verify token.");
        window.location.href = "/";
      });
    } else {
      alert("No token found.");
      window.location.href = "/";
    }
  </script>
