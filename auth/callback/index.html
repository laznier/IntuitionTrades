<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Callback: Verify Premium</title>
</head>
<body>
<script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get("credential");
    if (!token) {
      alert("No token received. Please sign in again.");
      window.location.href = "/";
      return;
    }
    // Send token to your /api/verify-google route
    fetch("/api/verify-google", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token })
    })
    .then(res => res.json())
    .then(data => {
      if (data.authorized) {
        // Premium user => proceed to /top5
        window.location.href = "/top5/index.html";
      } else {
        // Not premium => show error, redirect
        alert("Access denied: Premium membership required.");
        window.location.href = "/";
      }
    })
    .catch(err => {
      console.error("Error verifying token:", err);
      alert("There was a problem verifying your sign in. Please try again.");
      window.location.href = "/";
    });
  })();
</script>
</body>
</html>
