<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Two‐Party Live Transcribe &amp; Translate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /*──────────────────────────────────────────────────────────────────────────
      Basic reset & page styling
    ──────────────────────────────────────────────────────────────────────────*/
    html, body {
      margin: 0;
      height: 100%;
      font-family: sans-serif;
      background: #111;
      color: #eee;
    }

    /* Container for the two speakers */
    #container {
      display: flex;
      height: 100%;
    }

    .speaker {
      flex: 1;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    .speaker:first-child {
      border-left: none;
    }

    /* Header for each speaker: dropdown + button */
    .header {
      padding: 0.75rem;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: space-around;
      border-bottom: 1px solid #333;
    }
    .header select,
    .header button {
      font-size: 1rem;
      padding: 0.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .header select {
      background: #444;
      color: #eee;
    }
    .header button {
      background: #27e835;
      color: #000;
    }
    .header button.listening {
      background: #ff5252;
      color: #fff;
    }

    /* Body area: two panes stacked (Original on top, Translation below) */
    .panes {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      white-space: pre-wrap;
      user-select: text;
      border-bottom: 1px solid #333;
    }
    .pane:last-child {
      border-bottom: none;
    }
    .pane-title {
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .pane-content {
      /* the actual scrollable content */
    }

    /* Highlight style (if you want to add double-click later) */
    .highlight {
      background-color: yellow;
      color: black;
      border-radius: 2px;
      padding: 0 2px;
    }
  </style>
</head>
<body>

  <!--────────────────────────────────────────────────────────────────────────
    Two‐Party Container
  ─────────────────────────────────────────────────────────────────────────-->
  <div id="container">

    <!-- ─── Speaker A Column ─────────────────────────────────────────────────── -->
    <div class="speaker" id="speakerA">
      <div class="header">
        <label>
          Listens for:
          <select id="langA">
            <option value="ru">Russian</option>
            <option value="en">English</option>
          </select>
        </label>
        <button id="toggleA">Start A</button>
      </div>
      <div class="panes">
        <div class="pane">
          <div class="pane-title">A: Original (<span id="origLangA">ru‐RU</span>)</div>
          <div id="origA" class="pane-content"></div>
        </div>
        <div class="pane">
          <div class="pane-title">A: Translation (<span id="transLangA">en‐US</span>)</div>
          <div id="transA" class="pane-content"></div>
        </div>
      </div>
    </div>

    <!-- ─── Speaker B Column ─────────────────────────────────────────────────── -->
    <div class="speaker" id="speakerB">
      <div class="header">
        <label>
          Listens for:
          <select id="langB">
            <option value="en">English</option>
            <option value="ru">Russian</option>
          </select>
        </label>
        <button id="toggleB">Start B</button>
      </div>
      <div class="panes">
        <div class="pane">
          <div class="pane-title">B: Original (<span id="origLangB">en‐US</span>)</div>
          <div id="origB" class="pane-content"></div>
        </div>
        <div class="pane">
          <div class="pane-title">B: Translation (<span id="transLangB">ru‐RU</span>)</div>
          <div id="transB" class="pane-content"></div>
        </div>
      </div>
    </div>

  </div> <!-- /#container -->

  <script>
  /*──────────────────────────────────────────────────────────────────────────
    1) Mirror list for LibreTranslate (no paid key). We’ll auto‐fallback.
  ──────────────────────────────────────────────────────────────────────────*/
  const ENDPOINTS = [
    'https://translate.terraprint.co/translate',
    'https://lt.vern.cc/translate',
    'https://libretranslate.de/translate'
  ];
  let cachedEndpoint = null;

  async function translateText(text, source, target) {
    if (!text.trim()) return '';
    const tryUrls = cachedEndpoint
      ? [cachedEndpoint, ...ENDPOINTS.filter(u => u !== cachedEndpoint)]
      : ENDPOINTS.slice();

    for (const url of tryUrls) {
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            q: text,
            source: source,
            target: target,
            format: 'text'
          })
        });
        if (!res.ok) {
          console.warn(`[translate] ${url} returned ${res.status}`);
          continue;
        }
        const data = await res.json();
        cachedEndpoint = url; // mark this as working
        return data.translatedText || '';
      } catch (err) {
        console.warn(`[translate] ${url} fetch error:`, err);
      }
    }
    return '';
  }

  /*──────────────────────────────────────────────────────────────────────────
    2) Utility: map “en” → “en-US”, “ru” → “ru-RU” for display and recognition
  ──────────────────────────────────────────────────────────────────────────*/
  function codeToSpeechLang(code) {
    return code === 'ru' ? 'ru-RU' : 'en-US';
  }
  function codeToTargetLang(code) {
    return code === 'ru' ? 'en' : 'ru';
  }
  function codeToLabel(code) {
    return code === 'ru' ? 'Russian' : 'English';
  }

  /*──────────────────────────────────────────────────────────────────────────
    3) Speaker‐A Setup
  ──────────────────────────────────────────────────────────────────────────*/
  const langASelect     = document.getElementById('langA');
  const toggleABtn      = document.getElementById('toggleA');
  const origLangALabel  = document.getElementById('origLangA');
  const transLangALabel = document.getElementById('transLangA');
  const origAContent    = document.getElementById('origA');
  const transAContent   = document.getElementById('transA');

  let recogA, listeningA = false, bufferA = '', debounceA = null;

  function initRecognitionA() {
    recogA = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recogA.continuous     = true;
    recogA.interimResults = true;
    updateRecognitionSettingsA(); // sets recogA.lang
    recogA.onresult = async e => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t + ' ';
        else interim += t;
      }
      bufferA += final;
      origAContent.textContent = bufferA + interim;

      clearTimeout(debounceA);
      debounceA = setTimeout(async () => {
        const fullText = bufferA + interim;
        const srcCode = langASelect.value;
        const tgtCode = codeToTargetLang(srcCode);
        const translated = await translateText(fullText, srcCode, tgtCode);
        transAContent.textContent = translated;
      }, 300);
    };
    recogA.onend = () => {
      if (listeningA) recogA.start();
    };
    recogA.onerror = err => console.warn('[recogA.error]', err);
  }

  function updateRecognitionSettingsA() {
    const choice = langASelect.value;            // 'ru' or 'en'
    const speechCode = codeToSpeechLang(choice); // 'ru-RU' or 'en-US'
    const targetLang = codeToTargetLang(choice); // 'en' or 'ru'
    recogA.lang = speechCode;
    origLangALabel.textContent  = speechCode;
    transLangALabel.textContent = codeToSpeechLang(targetLang);
    // Clear buffers when language changes
    bufferA = '';
    origAContent.textContent = '';
    transAContent.textContent = '';
  }

  langASelect.addEventListener('change', () => {
    updateRecognitionSettingsA();
  });

  toggleABtn.addEventListener('click', () => {
    if (!recogA) initRecognitionA();
    if (listeningA) {
      recogA.stop();
      listeningA = false;
      toggleABtn.textContent = 'Start A';
      toggleABtn.classList.remove('listening');
    } else {
      recogA.start();
      listeningA = true;
      toggleABtn.textContent = 'Stop A';
      toggleABtn.classList.add('listening');
    }
  });

  /*──────────────────────────────────────────────────────────────────────────
    4) Speaker‐B Setup (mirror of A)
  ──────────────────────────────────────────────────────────────────────────*/
  const langBSelect     = document.getElementById('langB');
  const toggleBBtn      = document.getElementById('toggleB');
  const origLangBLabel  = document.getElementById('origLangB');
  const transLangBLabel = document.getElementById('transLangB');
  const origBContent    = document.getElementById('origB');
  const transBContent   = document.getElementById('transB');

  let recogB, listeningB = false, bufferB = '', debounceB = null;

  function initRecognitionB() {
    recogB = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recogB.continuous     = true;
    recogB.interimResults = true;
    updateRecognitionSettingsB();
    recogB.onresult = async e => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t + ' ';
        else interim += t;
      }
      bufferB += final;
      origBContent.textContent = bufferB + interim;

      clearTimeout(debounceB);
      debounceB = setTimeout(async () => {
        const fullText = bufferB + interim;
        const srcCode = langBSelect.value;
        const tgtCode = codeToTargetLang(srcCode);
        const translated = await translateText(fullText, srcCode, tgtCode);
        transBContent.textContent = translated;
      }, 300);
    };
    recogB.onend = () => {
      if (listeningB) recogB.start();
    };
    recogB.onerror = err => console.warn('[recogB.error]', err);
  }

  function updateRecognitionSettingsB() {
    const choice = langBSelect.value;
    const speechCode = codeToSpeechLang(choice);
    const targetLang = codeToTargetLang(choice);
    recogB.lang = speechCode;
    origLangBLabel.textContent  = speechCode;
    transLangBLabel.textContent = codeToSpeechLang(targetLang);
    bufferB = '';
    origBContent.textContent = '';
    transBContent.textContent = '';
  }

  langBSelect.addEventListener('change', () => {
    updateRecognitionSettingsB();
  });

  toggleBBtn.addEventListener('click', () => {
    if (!recogB) initRecognitionB();
    if (listeningB) {
      recogB.stop();
      listeningB = false;
      toggleBBtn.textContent = 'Start B';
      toggleBBtn.classList.remove('listening');
    } else {
      recogB.start();
      listeningB = true;
      toggleBBtn.textContent = 'Stop B';
      toggleBBtn.classList.add('listening');
    }
  });

  </script>
</body>
</html>
