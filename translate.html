<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RU → EN Live Transcribe & Translate (sentence‐highlight)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: sans-serif;
      background: #111;
      color: #eee;
    }
    #wrap {
      display: flex;
      height: 100%;
      margin-top: 3.5rem;    /* leave space for header */
      margin-bottom: 3.5rem; /* leave space for footer */
    }
    .pane {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      white-space: pre-wrap;
      user-select: text; /* allow right-click Look Up */
    }
    #en {
      border-right: 1px solid #333;
    }

    /* ─── header + footer for buttons ───────────────────────────────────────── */
    header, footer {
      position: fixed;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
    }
    header {
      top: 0;
      padding: 0.5rem 0;
    }
    footer {
      bottom: 0;
      padding: 0.5rem 0;
    }
    header button, footer button {
      border: none;
      border-radius: 6px;
      background: #27e835;
      color: #000;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
    }
    header button.listening {
      background: #ff5252;
      color: #fff;
    }
    footer button {
      background: #444;
      color: #eee;
      font-size: 0.9rem;
      padding: 0.4rem 0.9rem;
    }

    /* highlight style */
    .highlight {
      background-color: yellow;
      color: black;
      border-radius: 2px;
      padding: 0 2px;
    }
  </style>
</head>
<body>

  <!-- ─── fixed header with Start/Stop ──────────────────────────────────────── -->
  <header>
    <button id="toggle">Start</button>
  </header>

  <!-- ─── main panes: left=EN, right=RU ─────────────────────────────────────── -->
  <div id="wrap">
    <div id="en" class="pane" aria-label="English translation"></div>
    <div id="ru" class="pane" aria-label="Russian transcript"></div>
  </div>


  <script>
    /*────────────────────────────────────────────────────────────────────────
      1) Web Speech Recognition (ru-RU)
    ─────────────────────────────────────────────────────────────────────────*/
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert('Web Speech API not supported in this browser.');
    }

    const recog = new SpeechRecognition();
    recog.lang = 'ru-RU';
    recog.continuous = true;
    recog.interimResults = true;

    const ruPane = document.getElementById('ru');
    const enPane = document.getElementById('en');
    const toggleBtn = document.getElementById('toggle');
    const testBtn = document.getElementById('testBtn');

    let listening = false;
    let plainRU = '';
    let plainEN = '';
    let bufRU = '';
    let debounceId = null;

    toggleBtn.addEventListener('click', () => {
      console.log('[toggleBtn] clicked');
      listening ? stopRecognition() : startRecognition();
    });

    function startRecognition() {
      recog.start();
      listening = true;
      toggleBtn.textContent = 'Stop';
      toggleBtn.classList.add('listening');
    }
    function stopRecognition() {
      recog.stop();
      listening = false;
      toggleBtn.textContent = 'Start';
      toggleBtn.classList.remove('listening');
    }

    recog.onend = () => {
      if (listening) {
        console.log('[recog.onend] restarting recognition');
        recog.start();
      }
    };
    recog.onerror = (err) => console.warn('[recog.onerror]', err);

    /*────────────────────────────────────────────────────────────────────────
      2) Translation with auto‐fallback across mirrors
    ─────────────────────────────────────────────────────────────────────────*/
    const ENDPOINTS = [
      'https://translate.terraprint.co/translate',
      'https://lt.vern.cc/translate',
      'https://libretranslate.de/translate'
    ];
    let goodUrl = null;

    async function translateLang(text, source, target) {
      if (!text.trim()) return '';
      const urls = goodUrl
        ? [goodUrl, ...ENDPOINTS.filter(u => u !== goodUrl)]
        : ENDPOINTS.slice();

      for (const url of urls) {
        try {
          console.log(`[translateLang] trying ${url}`);
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ q: text, source, target, format: 'text' })
          });
          if (!res.ok) {
            console.warn(`[translateLang] ${url} returned ${res.status}`);
            continue;
          }
          const data = await res.json();
          goodUrl = url; // cache working endpoint
          console.log(`[translateLang] success from ${url}`, data);
          return data.translatedText || '';
        } catch (err) {
          console.warn(`[translateLang] ${url} fetch error`, err);
        }
      }
      console.warn('[translateLang] all endpoints failed');
      return '';
    }

    /*────────────────────────────────────────────────────────────────────────
      3) Stream recognition → update panes in real-time
    ─────────────────────────────────────────────────────────────────────────*/
    recog.onresult = e => {
      let interim = '';
      let finalRU = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        const snippet = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalRU += snippet + ' ';
        else interim += snippet;
      }
      bufRU += finalRU;
      ruPane.textContent = bufRU + interim;

      clearTimeout(debounceId);
      debounceId = setTimeout(async () => {
        const fullText = bufRU + interim;
        const translated = await translateLang(fullText, 'ru', 'en');
        enPane.textContent = translated;
        plainRU = ruPane.textContent;
        plainEN = enPane.textContent;
        ruPane.scrollTop = ruPane.scrollHeight;
        enPane.scrollTop = enPane.scrollHeight;
      }, 300);
    };

    /*────────────────────────────────────────────────────────────────────────
      4) Double-click → highlight word or entire sentence & counterpart
    ─────────────────────────────────────────────────────────────────────────*/
    function clearHighlights() {
      ruPane.innerText = plainRU;
      enPane.innerText = plainEN;
    }

    function highlightInPane(pane, fragment) {
      if (!fragment) return false;
      const escaped = fragment.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&');
      const re = new RegExp(`\\b${escaped}\\b`, 'iu');
      const html = pane.innerHTML;
      if (re.test(html)) {
        pane.innerHTML = html.replace(re, match => `<span class="highlight">${match}</span>`);
        return true;
      }
      // fallback to substring match
      const idx = html.toLowerCase().indexOf(fragment.toLowerCase());
      if (idx >= 0) {
        pane.innerHTML =
          html.slice(0, idx) +
          `<span class="highlight">${html.slice(idx, idx + fragment.length)}</span>` +
          html.slice(idx + fragment.length);
        return true;
      }
      return false;
    }

    function findSentence(text, index) {
      const len = text.length;
      // Look backward for punctuation (. ! ?)
      let start = -1;
      ['.', '!', '?'].forEach(p => {
        const pos = text.lastIndexOf(p, index - 1);
        if (pos > start) start = pos;
      });
      const sentenceStart = (start < 0) ? 0 : start + 1;

      // Look forward for punctuation
      let end = len;
      ['.', '!', '?'].forEach(p => {
        const pos = text.indexOf(p, index);
        if (pos !== -1 && pos < end) end = pos;
      });
      const sentenceEnd = (end === len) ? len : end + 1;

      return text.slice(sentenceStart, sentenceEnd).trim();
    }

    async function onPaneDblClick(e) {
      const sel = window.getSelection().toString().trim();
      if (!sel) return;

      const clickedPane = e.currentTarget;
      const isRU = clickedPane.id === 'ru';

      // Determine plain text of clicked pane
      const plainText = isRU ? plainRU : plainEN;
      // Find first occurrence of the exact selected word (case‐insensitive)
      const idx = plainText.toLowerCase().indexOf(sel.toLowerCase());
      if (idx < 0) {
        // Fallback: just highlight the word alone
        clearHighlights();
        if (isRU) {
          highlightInPane(ruPane, sel);
          const enW = await translateLang(sel, 'ru', 'en');
          highlightInPane(enPane, enW);
        } else {
          highlightInPane(enPane, sel);
          const ruW = await translateLang(sel, 'en', 'ru');
          highlightInPane(ruPane, ruW);
        }
        return;
      }

      // Extract the full sentence that contains this index
      const sentence = findSentence(plainText, idx);
      if (!sentence) {
        // If somehow empty, fallback to word
        clearHighlights();
        if (isRU) {
          highlightInPane(ruPane, sel);
          const enW = await translateLang(sel, 'ru', 'en');
          highlightInPane(enPane, enW);
        } else {
          highlightInPane(enPane, sel);
          const ruW = await translateLang(sel, 'en', 'ru');
          highlightInPane(ruPane, ruW);
        }
        return;
      }

      // Now highlight that sentence in the clicked pane
      clearHighlights();
      const targetPane = isRU ? ruPane : enPane;
      highlightInPane(targetPane, sentence);

      // Translate that sentence and highlight its counterpart
      if (isRU) {
        const enSentence = await translateLang(sentence, 'ru', 'en');
        highlightInPane(enPane, enSentence);
      } else {
        const ruSentence = await translateLang(sentence, 'en', 'ru');
        highlightInPane(ruPane, ruSentence);
      }
    }

    ruPane.addEventListener('dblclick', onPaneDblClick);
    enPane.addEventListener('dblclick', onPaneDblClick);

    /*────────────────────────────────────────────────────────────────────────
      5) Test Translation API button
    ─────────────────────────────────────────────────────────────────────────*/
    testBtn.addEventListener('click', async () => {
      console.log('[testBtn] clicked');
      testBtn.textContent = 'Testing…';
      const example = 'Привет, как дела?';
      const result = await translateLang(example, 'ru', 'en');
      if (result) {
        alert(`Success:\n"${example}" → "${result}"`);
        console.log('[testBtn] translation result:', result);
      } else {
        alert('All translation mirrors failed. Check console/network.');
        console.warn('[testBtn] all mirrors failed');
      }
      testBtn.textContent = 'Test Translation API';
    });
  </script>
</body>
</html>
