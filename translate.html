<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RU &rarr; EN Live Transcribe &amp; Translate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /*──────────────────────────────────────────────────────────────────────────
      Split-screen: left = English, right = Russian transcript
    ──────────────────────────────────────────────────────────────────────────*/
    html, body {
      margin: 0;
      height: 100%;
      font-family: sans-serif;
      background: #111;
      color: #eee;
    }
    #wrap {
      display: flex;
      height: 100%;
    }
    .pane {
      flex: 1;
      padding: 1rem;
      box-sizing: border-box;
      overflow-y: auto;
      white-space: pre-wrap;
      user-select: text; /* allow native “Look Up” on right-click */
      position: relative;
    }
    #en {
      border-right: 1px solid #333;
    }
    button {
      position: fixed;
      top: 50rem;
      left: 50%;
      transform: translateX(-50%);
      padding: .6rem 1.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: #27e835;
      color: #000;
      cursor: pointer;
      z-index: 10;
    }
    button.listening {
      background: #ff5252;
      color: #fff;
    }
    .highlight {
      background-color: yellow;
      color: black;
      border-radius: 2px;
      padding: 0 2px;
    }

  </style>
</head>
<body>
  <!-- Start / Stop Listening -->
  <button id="toggle">Start</button>

  <!-- Panes: Left = English, Right = Russian -->
  <div id="wrap">
    <div id="en"  class="pane" aria-label="English translation"></div>
    <div id="ru"  class="pane" aria-label="Russian transcript"></div>
  </div>

  <!-- Test Translation API Reachability -->
  <button id="testBtn">Test Translation API</button>

  <script>
    /*──────────────────────────────────────────────────────────────────────────
      1. Web Speech Recognition (Russian, ru-RU)
    ──────────────────────────────────────────────────────────────────────────*/
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert('Web Speech API not supported in this browser.');
    }

    const recog = new SpeechRecognition();
    recog.lang           = 'ru-RU';
    recog.continuous     = true;
    recog.interimResults = true;

    const ruPane    = document.getElementById('ru');
    const enPane    = document.getElementById('en');
    const toggleBtn = document.getElementById('toggle');
    const testBtn   = document.getElementById('testBtn');

    let listening = false;

    // Keep “clean” text so we can reset highlights:
    let plainRU = '';
    let plainEN = '';

    toggleBtn.onclick = () => {
      listening ? stopRecognition() : startRecognition();
    };

    function startRecognition() {
      recog.start();
      listening = true;
      toggleBtn.textContent = 'Stop';
      toggleBtn.classList.add('listening');
    }
    function stopRecognition() {
      recog.stop();
      listening = false;
      toggleBtn.textContent = 'Start';
      toggleBtn.classList.remove('listening');
    }

    recog.onerror = (err) => console.warn('Speech error:', err);
    recog.onend   = () => {
      // If the mic dropped unexpectedly, keep it alive unless user clicked Stop
      listening && recog.start();
    };

    /*──────────────────────────────────────────────────────────────────────────
      2. Translation via LibreTranslate mirror @ translate.flossboxin.org.in
      (no API key required, public mirror) :contentReference[oaicite:0]{index=0}
    ──────────────────────────────────────────────────────────────────────────*/
    async function translateLang(text, source, target) {
      if (!text.trim()) return '';
      try {
        console.log(`[translateLang] → "${text.slice(0, 50)}..." (${source}→${target})`);
        const res = await fetch('https://translate.flossboxin.org.in/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            q: text,
            source: source,
            target: target,
            format: 'text'
          })
        });
        if (!res.ok) {
          console.warn(`[translateLang] Non-OK: ${res.status} ${res.statusText}`);
          return '';
        }
        const data = await res.json();
        console.log('[translateLang] ←', data);
        return data.translatedText || '';
      } catch (err) {
        console.warn('Translation API error:', err);
        return '';
      }
    }

    /*──────────────────────────────────────────────────────────────────────────
      3. Stream recognition results → update panes
    ──────────────────────────────────────────────────────────────────────────*/
    let bufferRU   = '';
    let debounceId = null;

    recog.onresult = async (e) => {
      let interimRU = '';
      let finalRU   = '';

      for (let i = e.resultIndex; i < e.results.length; ++i) {
        const snippet = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalRU += snippet + ' ';
        else                    interimRU += snippet;
      }

      bufferRU += finalRU;
      const displayRU = bufferRU + interimRU;
      ruPane.textContent = displayRU;

      clearTimeout(debounceId);
      debounceId = setTimeout(async () => {
        const fullText = bufferRU + interimRU;
        const enText   = await translateLang(fullText, 'ru', 'en');
        enPane.textContent = enText;

        // Save “clean” copies so we can reapply highlights later:
        plainRU = ruPane.textContent;
        plainEN = enPane.textContent;

        // Auto-scroll to bottom
        ruPane.scrollTop = ruPane.scrollHeight;
        enPane.scrollTop = enPane.scrollHeight;
      }, 300);
    };

    /*──────────────────────────────────────────────────────────────────────────
      4. Double-click → highlight selected word & its counterpart
    ──────────────────────────────────────────────────────────────────────────*/
    function clearAllHighlights() {
      ruPane.innerText = plainRU;
      enPane.innerText = plainEN;
    }

    function highlightInPane(pane, word) {
      if (!word) return false;
      // Escape regex‐special characters
      const escaped = word.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&');
      // Try whole‐word match
      const re = new RegExp(`\\b${escaped}\\b`, 'iu');
      const html = pane.innerHTML;

      if (re.test(html)) {
        pane.innerHTML = html.replace(re, match => `<span class="highlight">${match}</span>`);
        return true;
      }
      // Fallback: substring match
      const idx = html.toLowerCase().indexOf(word.toLowerCase());
      if (idx >= 0) {
        const before = html.slice(0, idx);
        const match  = html.slice(idx, idx + word.length);
        const after  = html.slice(idx + word.length);
        pane.innerHTML = `${before}<span class="highlight">${match}</span>${after}`;
        return true;
      }
      return false;
    }

    async function onDoubleClickPane(e) {
      const sel = window.getSelection().toString().trim();
      if (!sel) return;

      const clickedPane = e.currentTarget;
      clearAllHighlights();

      if (clickedPane.id === 'ru') {
        // Russian word clicked → translate RU→EN & highlight both
        highlightInPane(ruPane, sel);
        const enWord = await translateLang(sel, 'ru', 'en');
        highlightInPane(enPane, enWord);
      } else {
        // English word clicked → translate EN→RU & highlight both
        highlightInPane(enPane, sel);
        const ruWord = await translateLang(sel, 'en', 'ru');
        highlightInPane(ruPane, ruWord);
      }
    }

    ruPane.addEventListener('dblclick', onDoubleClickPane);
    enPane.addEventListener('dblclick', onDoubleClickPane);

    /*──────────────────────────────────────────────────────────────────────────
      5. “Test Translation” → verify endpoint reachability
    ──────────────────────────────────────────────────────────────────────────*/
    testBtn.onclick = async () => {
      testBtn.textContent = 'Testing…';
      const example = 'Привет, как дела?'; // “Hello, how are you?”
      const result  = await translateLang(example, 'ru', 'en');
      if (result) {
        alert(`Test succeeded:\n"${example}" → "${result}"`);
        console.log('[Test] Success:', result);
      } else {
        alert('Test failed. Check console for errors.');
        console.warn('[Test] Failed or empty response');
      }
      testBtn.textContent = 'Test Translation API';
    };
  </script>
</body>
</html>
