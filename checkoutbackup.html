<!-- checkoutbackup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upgrade to Premium (Backup) | Intuition Trades</title>
  <style>
    :root {
      --font-family: 'Arial', sans-serif;
      --text-color: #fff;
      --primary-bg: #333;
      --section-bg: rgba(0, 0, 0, 0.33);
      --accent-color: #16a34a;
      --accent-hover: #22c55e;
      --border-radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-family);
      background-color: #111;
      color: var(--text-color);
    }
    .background-fixed {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      z-index: -9999;
      transform: translateZ(0);
    }
    body.day .background-fixed {
      background-image: url('/images/day-background.png');
    }
    body.night .background-fixed {
      background-image: url('/images/night-background.png');
    }
    .topnav {
      background-color: var(--primary-bg);
      overflow-x: auto;
      white-space: nowrap;
    }
    .topnav ul {
      display: flex;
      list-style: none;
    }
    .topnav ul li a {
      display: block;
      padding: .875rem 1.25rem;
      color: var(--text-color);
      text-decoration: none;
    }
    .topnav ul li a:hover {
      background-color: #ddd;
      color: #333;
    }
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      min-height: calc(100vh - 50px);
    }
    .plan-box {
      background: #222;
      border-radius: var(--border-radius);
      padding: 2rem;
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: var(--accent-color);
    }
    p {
      margin-bottom: .75rem;
      font-size: 1rem;
      color: #ccc;
    }
    .price {
      font-size: 1.5rem;
      color: var(--accent-color);
      margin: 1rem 0;
    }
    button {
      background: var(--accent-color);
      color: white;
      padding: .75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .3s ease;
    }
    button:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="background-fixed"></div>
  <header>
    <nav class="topnav">
      <ul><li><a href="/">Home</a></li></ul>
    </nav>
  </header>

  <main class="main-content">
    <div class="plan-box">
      <h1>Premium Membership</h1>
      <p>🚀 Unlimited tools</p>
      <p>🔒 No ads, no distractions</p>
      <p>⚡ Cancel anytime</p>
      <div class="price">$9.99 / month</div>
      <button id="subscribeBackupBtn">Subscribe Now</button>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-functions.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
      authDomain: "persuasive-net-456607-g8.firebaseapp.com",
      databaseURL: "https://persuasive-net-456607-g8-default-rtdb.firebaseio.com",
      projectId: "persuasive-net-456607-g8"
    };

    const app       = initializeApp(firebaseConfig);
    const auth      = getAuth(app);
    const functions = getFunctions(app);
    const createSession = httpsCallable(functions, 'createBackupCheckoutSession');

    const priceId = "price_1RGXodFEfvI8pkt9Iy7vN0wU";
    const btn     = document.getElementById("subscribeBackupBtn");

    onAuthStateChanged(auth, user => {
      if (!user) {
        alert("Please sign in first.");
        window.location.href = "/login.html";
        return;
      }

      btn.addEventListener("click", async () => {
        try {
          const { data } = await createSession({
            price:       priceId,
            success_url: window.location.origin + "/success.html",
            cancel_url:  window.location.origin + "/cancel.html"
          });
          window.location.assign(data.url);
        } catch (err) {
          console.error(err);
          alert(err.message);
        }
      }, { once: true });
    });

    // Day/Night background toggle
    document.addEventListener("DOMContentLoaded", () => {
      const hours = new Date().getHours();
      if (hours >= 19 || hours < 6) {
        document.body.classList.add('night');
      } else {
        document.body.classList.add('day');
      }
    });
  </script>
</body>
</html>
