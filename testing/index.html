<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analyst Bullish Score | Intuition Trades</title>
  <!-- Optional: Include Plotly if you want to use a gauge; here we use simple div meters -->
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f3f4f6, #ffffff);
      color: #333;
      margin: 0 auto;
      max-width: 900px;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }
    p, label {
      margin-bottom: 0.75em;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
      transition: border-color 0.3s ease;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #1e3a8a;
    }
    .meter-section {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background-color: #f9fafb;
    }
    .meter-section h2 {
      margin-bottom: 10px;
      font-weight: 600;
    }
    .meter {
      position: relative;
      background: linear-gradient(to right, red, green);
      height: 30px;
      border-radius: 15px;
      margin: 10px 0;
    }
    .marker {
      position: absolute;
      top: 0;
      width: 2px;
      height: 100%;
      background: black;
    }
    .score-text {
      text-align: center;
      font-weight: bold;
      line-height: 30px;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }
    #loading {
      margin-top: 10px;
      font-style: italic;
      color: #f97316;
    }
    /* Back to Home Button */
    #backHome {
      margin-bottom: 20px;
    }
    /* Mobile-specific adjustments */
    @media (max-width: 600px) {
      body {
        padding: 1rem;
        font-size: 0.9rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 10px;
      }
      input[type="text"] {
        padding: 6px;
      }
      button {
        font-size: 0.9rem;
        padding: 8px 16px;
      }
      .meter-section {
        padding: 10px;
        margin-top: 15px;
      }
    }
  </style>
</head>
<body>
  <!-- Back to Home Button -->
  <button id="backHome" onclick="window.location.href='https://www.intuitiontrades.com'">Back to Home</button>

  <h1>Analyst Bullish Score</h1>
  <p>Enter a ticker symbol to compute the analyst bullish score based on analyst recommendations and target premium.</p>

  <label for="ticker">Ticker Symbol (e.g. AAPL):</label>
  <input type="text" id="ticker" value="AAPL">

  <button id="runAnalysis">Run Analysis</button>
  <div id="loading" style="display:none;">Loading data and computing score...</div>

  <!-- Analyst Recommendation Meter -->
  <div class="meter-section" id="recSection" style="display:none;">
    <h2>Analyst Recommendation Score</h2>
    <div class="meter" id="recMeter">
      <div class="marker" id="recMarker"></div>
      <div class="score-text" id="recScoreText"></div>
    </div>
  </div>

  <!-- Price Premium Meter -->
  <div class="meter-section" id="premiumSection" style="display:none;">
    <h2>Target Premium Score</h2>
    <div class="meter" id="premiumMeter">
      <div class="marker" id="premiumMarker"></div>
      <div class="score-text" id="premiumScoreText"></div>
    </div>
  </div>

  <!-- Combined Analyst Bullish Score -->
  <div class="meter-section" id="combinedSection" style="display:none;">
    <h2>Combined Analyst Bullish Score</h2>
    <div class="meter" id="combinedMeter">
      <div class="marker" id="combinedMarker"></div>
      <div class="score-text" id="combinedScoreText"></div>
    </div>
  </div>

  <script>
    // Helper: Logistic function
    function logistic(x, c) {
      return 1 / (1 + Math.exp(-c * x));
    }

    // Compute the normalized recommendation score R.
    // Ratings: Strong Buy = +2, Buy = +1, Hold = 0, Sell = -1, Strong Sell = -2.
    function computeRecommendationScore(data) {
      const SB = parseFloat(data.AnalystRatingStrongBuy) || 0;
      const B  = parseFloat(data.AnalystRatingBuy) || 0;
      const Hold = parseFloat(data.AnalystRatingHold) || 0;
      const S  = parseFloat(data.AnalystRatingSell) || 0;
      const SS = parseFloat(data.AnalystRatingStrongSell) || 0;
      const total = SB + B + Hold + S + SS;
      if(total === 0) return 0.5; // Neutral if no ratings
      // Weighted average ignoring Hold (or treating hold as 0)
      const avgRating = (2 * SB + 1 * B - 1 * S - 2 * SS) / total;
      // Normalize: when avgRating = -2, score=0; when avgRating = +2, score=1; 0 => 0.5.
      return (avgRating + 2) / 4;
    }

    // Compute the price premium score P.
    // Use the target price from the fundamental data and current price from historical data.
    // c is a sensitivity constant (we use 10 as an example).
    function computePremiumScore(targetPrice, currentPrice, c = 10) {
      if(currentPrice === 0) return 0.5;
      const ratio = (parseFloat(targetPrice) / parseFloat(currentPrice)) - 1;
      return logistic(ratio, c);
    }

    // Combined Analyst Bullish Score is the average of R and P.
    function computeCombinedScore(R, P) {
      return (R + P) / 2;
    }

    // Update a meter element: container id, marker id, text id, and score (0-1)
    function updateMeter(meterId, markerId, textId, score) {
      const percent = score * 100;
      document.getElementById(markerId).style.left = percent + "%";
      document.getElementById(textId).innerText = percent.toFixed(1) + "%";
      document.getElementById(meterId).parentElement.style.display = 'block';
    }

    // Hide an element by id
    function hideElement(id) {
      document.getElementById(id).style.display = 'none';
    }

    // Show an element by id
    function showElement(id) {
      document.getElementById(id).style.display = 'block';
    }

    document.getElementById('runAnalysis').addEventListener('click', async () => {
      const ticker = document.getElementById('ticker').value.trim();
      if (!ticker) {
        alert("Please enter a ticker symbol.");
        return;
      }
      showElement('loading');
      hideElement('recSection');
      hideElement('premiumSection');
      hideElement('combinedSection');

      try {
        // Fetch fundamental data
        const fundUrl = `https://www.intuitiontrades.com/api/fundamental?symbol=${ticker}`;
        const fundResp = await fetch(fundUrl);
        const fundData = await fundResp.json();
        if (!fundData || !fundData.Symbol) {
          throw new Error("No fundamental data found.");
        }
        // Fetch historical data for current price
        const histUrl = `https://www.intuitiontrades.com/api/historical?symbol=${ticker}`;
        const histResp = await fetch(histUrl);
        const histData = await histResp.json();
        if (!histData["Time Series (Daily)"]) {
          throw new Error("No historical data found.");
        }
        // Process historical data to get the latest close price
        const dates = Object.keys(histData["Time Series (Daily)"]).sort((a, b) => new Date(a) - new Date(b));
        const latestDate = dates[dates.length - 1];
        const currentPrice = parseFloat(histData["Time Series (Daily)"][latestDate]["5. adjusted close"]);

        // Compute scores
        const R = computeRecommendationScore(fundData); // normalized rating score (0-1)
        const P = computePremiumScore(fundData.AnalystTargetPrice, currentPrice); // normalized premium score (0-1)
        const combined = computeCombinedScore(R, P);

        // Update meters (convert normalized values to percentages)
        updateMeter('recMeter', 'recMarker', 'recScoreText', R);
        updateMeter('premiumMeter', 'premiumMarker', 'premiumScoreText', P);
        updateMeter('combinedMeter', 'combinedMarker', 'combinedScoreText', combined);

        // Optionally, you can also display some textual context:
        // e.g., "Current Price is 3% below Target" etc.
      } catch (err) {
        alert("Error: " + err.message);
        console.error(err);
      }
      hideElement('loading');
    });
  </script>
</body>
</html>
