<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Firestore Minimal Test</title>
  </head>
  <body>
    <h1>Firestore Minimal Test</h1>
    <div id="output">Connecting to Firestore...</div>
    <script type="module">
      // Import necessary functions from the Firebase SDK
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
        enableNetwork
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // Your full Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyBKmeS_j2rYrTo2xd3IZNksdnpOf4ndXmk",
        authDomain: "intuition-trades.firebaseapp.com",
        projectId: "intuition-trades",
        storageBucket: "intuition-trades.firebasestorage.app",
        messagingSenderId: "662507444685",
        appId: "1:662507444685:web:81c8ce875bd522cb748c84"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Optionally force network connection (sometimes helpful if Firestore gets stuck in offline mode)
      enableNetwork(db).catch(err => console.error("Error enabling network:", err));

      // Reference to the output div
      const outputDiv = document.getElementById("output");

      async function testFirestore() {
        try {
          // Create a reference to a test document (in collection "test" with doc id "testDoc")
          const testDocRef = doc(db, "test", "testDoc");

          // Write a test document
          await setDoc(testDocRef, { message: "Hello Firestore!" });

          // Read the document back
          const docSnap = await getDoc(testDocRef);

          if (docSnap.exists()) {
            outputDiv.innerText = "Document data: " + JSON.stringify(docSnap.data());
            console.log("Document data:", docSnap.data());
          } else {
            outputDiv.innerText = "No such document!";
          }
        } catch (error) {
          outputDiv.innerText = "Error: " + error.message;
          console.error("Test Firestore Error:", error);
        }
      }

      // Run the test
      testFirestore();
    </script>
  </body>
</html>
