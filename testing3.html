<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Congress Trading Insights</title>
  <!-- Include Chart.js library if needed for graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary-bg: #111;
      --secondary-bg: #333;
      --accent-color: #16a34a;
      --text-color: #fff;
      --font-family: 'Arial', sans-serif;
      --transition-speed: 0.3s;
    }
    body {
      font-family: var(--font-family);
      background-color: var(--primary-bg);
      color: var(--text-color);
      margin: 0 auto;
      max-width: 900px;
      padding: 2rem;
      line-height: 1.6;
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }
    p, li {
      margin-bottom: 0.75em;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 0.95rem;
      background-color: var(--secondary-bg);
      color: var(--text-color);
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: var(--accent-color);
      color: var(--text-color);
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background var(--transition-speed);
    }
    button:hover {
      background: #1e3a8a;
    }
    .section {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: var(--secondary-bg);
    }
    /* Spinner styles */
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--accent-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* Autocomplete styling */
    #ticker-suggestions {
      position: absolute;
      background-color: var(--secondary-bg);
      border: 1px solid #555;
      width: calc(100% - 20px);
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #ticker-suggestions li {
      padding: 8px;
      cursor: pointer;
    }
    #ticker-suggestions li:hover {
      background-color: var(--accent-color);
      color: var(--text-color);
    }
  </style>
</head>
<body>
  <!-- Back to Main Page Button -->
  <button onclick="window.location.href='https://intuitiontrades.com'">Back to Main Page</button>

  <h1>Interactive Top Congress Trades</h1>
  <p>This page displays congressional trades with filtering and interactive details.</p>

  <!-- Button to load data -->
  <div style="text-align: center;">
    <button id="fetchButton">Load Congress Trades Data</button>
  </div>

  <!-- Spinner with countdown during data load -->
  <div id="loading" style="display:none; text-align:center;">
    <div class="spinner"></div>
    <p>Loading data... (<span id="countdown">15</span> seconds remaining)</p>
  </div>

  <!-- Temporary section to quickly display senator/congressperson names -->
  <div id="senatorsList" class="section" style="display:none;">
    <h2>Importing Data from:</h2>
    <p id="senatorsNames"></p>
  </div>

  <!-- Filter section; hidden until after data is loaded -->
  <div id="filterSection" style="display:none;">
    <label for="filterDays">Filter by days (e.g. 90):</label>
    <input type="number" id="filterDays" value="90" min="1"/>
    <br>
    <label for="filterPolitician">Filter by Politician:</label>
    <input type="text" id="filterPolitician" placeholder="Enter name"/>
    <br>
    <label for="ticker">Ticker Symbol:</label>
    <input type="text" id="ticker" placeholder="e.g. TSLA" />
    <ul id="ticker-suggestions"></ul>
    <div id="company-full-name" style="margin-top:5px; font-size:1rem; color: var(--accent-color);"></div>
    <br>
    <button id="applyFilter">Apply Filter</button>
  </div>

  <!-- Results section with dynamic title and filtered trades -->
  <div id="resultsSection" class="section" style="display:none;">
    <h2 id="resultsTitle"></h2>
    <div id="resultsContainer"></div>
  </div>

  <!-- Details section for a selected stock (if needed) -->
  <div id="detailsSection" class="section" style="display:none;">
    <h2>Stock Details</h2>
    <div id="chartContainer">
      <canvas id="trendChart"></canvas>
    </div>
    <div id="details"></div>
  </div>

  <script>
    // Global declarations
    let debounceTimeout;
    let allData = []; // To store all fetched data

    /* ================= Autocomplete Functions ================= */
    function clearSuggestions() {
      const list = document.getElementById('ticker-suggestions');
      if (list) {
        list.innerHTML = '';
        list.style.display = 'none';
      }
      const fullNameElem = document.getElementById('company-full-name');
      if (fullNameElem) {
        fullNameElem.innerText = '';
      }
    }

    async function fetchTickerSuggestions(searchQuery) {
      try {
        const response = await fetch(`/api/ticker?query=${encodeURIComponent(searchQuery)}`);
        if (!response.ok) throw new Error(`API error: ${response.statusText}`);
        const data = await response.json();
        return data.bestMatches || [];
      } catch (error) {
        console.error("Error fetching ticker suggestions:", error);
        return [];
      }
    }

    function renderTickerSuggestions(suggestions) {
      const list = document.getElementById('ticker-suggestions');
      list.innerHTML = ''; 
      if (!suggestions || suggestions.length === 0) {
        list.style.display = 'none';
        return;
      }
      list.style.display = 'block';
      suggestions.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="ticker-symbol">${item["1. symbol"]}</span> <span class="company-name">(${item["2. name"]})</span>`;
        li.addEventListener('click', () => {
          document.getElementById('ticker').value = item["1. symbol"];
          const fullNameElem = document.getElementById('company-full-name');
          if (fullNameElem) fullNameElem.innerText = item["2. name"];
          clearSuggestions();
        });
        list.appendChild(li);
      });
    }

    // Autocomplete integration for ticker input.
    document.addEventListener("DOMContentLoaded", () => {
      const tickerInput = document.getElementById('ticker');
      tickerInput.addEventListener('input', () => {
        const query = tickerInput.value.trim();
        if (query.length < 2) {
          clearSuggestions();
          return;
        }
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(async () => {
          const suggestions = await fetchTickerSuggestions(query);
          renderTickerSuggestions(suggestions);
        }, 300);
      });
      clearSuggestions();
    });

    /* ================= Data Fetch and UI Initialization ================= */
    document.getElementById('fetchButton').addEventListener('click', async () => {
      document.getElementById('loading').style.display = 'block';
      // Hide previous sections if any.
      document.getElementById('filterSection').style.display = 'none';
      document.getElementById('resultsSection').style.display = 'none';
      document.getElementById('senatorsList').style.display = 'none';
      document.getElementById('detailsSection').style.display = 'none';

      // Start the countdown timer.
      let countdown = 15;
      const countdownEl = document.getElementById('countdown');
      countdownEl.innerText = countdown;
      const timerInterval = setInterval(() => {
        countdown--;
        countdownEl.innerText = countdown;
        if (countdown <= 0) clearInterval(timerInterval);
      }, 1000);

      try {
        const response = await fetch('/api/topcongress');
        if (!response.ok) {
          const text = await response.text();
          throw new Error(`Failed to fetch data: ${response.status} - ${text}`);
        }
        const jsonResponse = await response.json();
        if (!jsonResponse.data || !Array.isArray(jsonResponse.data)) {
          throw new Error("Invalid data format from API. Expected { data: [] }");
        }
        allData = jsonResponse.data;

        // Display the unique names of senators/congresspeople.
        const names = [...new Set(allData.map(item => item.Representative).filter(Boolean))];
        document.getElementById('senatorsNames').innerText = names.join(', ');
        document.getElementById('senatorsList').style.display = 'block';

        // After a brief delay, hide the names section and show the filter section.
        setTimeout(() => {
          document.getElementById('senatorsList').style.display = 'none';
          document.getElementById('filterSection').style.display = 'block';
        }, 2000); // Adjust delay as needed.

      } catch (error) {
        console.error("Error fetching congress data:", error);
        alert("Error: " + error.message);
      } finally {
        clearInterval(timerInterval);
        document.getElementById('loading').style.display = 'none';
      }
    });

    /* ================= Filtering and Dynamic Results Rendering ================= */
    // When user clicks "Apply Filter"
    document.getElementById('applyFilter').addEventListener('click', () => {
      const days = parseInt(document.getElementById('filterDays').value.trim()) || 90;
      const politicianFilter = document.getElementById('filterPolitician').value.trim().toLowerCase();
      const tickerFilter = document.getElementById('ticker').value.trim().toLowerCase();
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - days);
      
      // Filter the global data.
      const filteredData = allData.filter(item => {
        if (!item.TransactionDate) return false;
        const tradeDate = new Date(item.TransactionDate);
        if (isNaN(tradeDate) || tradeDate < cutoff) return false;
        if (politicianFilter && (!item.Representative || item.Representative.toLowerCase().indexOf(politicianFilter) === -1)) return false;
        if (tickerFilter && (!item.Ticker || item.Ticker.toLowerCase().indexOf(tickerFilter) === -1)) return false;
        return true;
      });
      
      renderFilteredTrades(filteredData, { days, tickerFilter, politicianFilter });
    });

    // Render filtered trades with a dynamic title.
    function renderFilteredTrades(filteredData, { days, tickerFilter, politicianFilter }) {
      const resultsSection = document.getElementById('resultsSection');
      const resultsTitle = document.getElementById('resultsTitle');
      const resultsContainer = document.getElementById('resultsContainer');
      
      // Build dynamic title.
      let title = "";
      if (tickerFilter && days) {
        title = `${tickerFilter.toUpperCase()} trades in the last ${days} days`;
      } else if (tickerFilter) {
        title = `${tickerFilter.toUpperCase()} trades`;
      } else if (days) {
        title = `All reported trades in the last ${days} days`;
      } else {
        title = "All reported trades";
      }
      if (politicianFilter) {
        // Look for a matching full name.
        const match = filteredData.find(item => item.Representative && item.Representative.toLowerCase().includes(politicianFilter));
        if (match && match.Representative) {
          title = tickerFilter 
            ? `${tickerFilter.toUpperCase()} trades by ${match.Representative} in the last ${days} days`
            : `Trades by ${match.Representative} in the last ${days} days`;
        }
      }
      resultsTitle.innerText = title;
      
      // Render each trade in a simple list.
      resultsContainer.innerHTML = "";
      if(filteredData.length === 0) {
        resultsContainer.innerHTML = "<p>No trades found matching the filters.</p>";
      } else {
        filteredData.forEach(trade => {
          const div = document.createElement('div');
          div.style.borderBottom = "1px solid #555";
          div.style.padding = "8px 0";
          const rep = trade.Representative || 'N/A';
          const ticker = trade.Ticker || 'N/A';
          const tradeDate = trade.TransactionDate ? new Date(trade.TransactionDate).toLocaleDateString() : 'N/A';
          const trans = trade.Transaction || 'N/A';
          div.innerHTML = `<strong>${ticker}</strong> - ${trans} on ${tradeDate} by ${rep}`;
          resultsContainer.appendChild(div);
        });
      }
      resultsSection.style.display = 'block';
      resultsSection.scrollIntoView({ behavior: 'smooth' });
    }

    /* ================= Detailed Trade Information and Timeline Graph ================= */
    function showDetails(group) {
      const detailsSection = document.getElementById('detailsSection');
      const detailsEl = document.getElementById('details');

      // Render the timeline graph (using all transactions for the ticker).
      renderTimelineGraph(group);

      // Render the list of transactions.
      let html = `
        <p><strong>Ticker:</strong> ${group.ticker}</p>
        <p><strong>Total Trades:</strong> ${group.tradeCount}</p>
        <p><strong>Net Dollars:</strong> $${group.netDollars.toLocaleString(undefined, { maximumFractionDigits: 2 })}</p>
        <h3>All Transactions:</h3>
        <ul>
      `;
      group.trades.forEach(trade => {
        const representative = trade.Representative || 'N/A';
        const party = trade.Party || 'N/A';
        const transactionDate = trade.TransactionDate ? new Date(trade.TransactionDate).toLocaleDateString() : 'N/A';
        const reportDate = trade.ReportDate ? new Date(trade.ReportDate).toLocaleDateString() : 'N/A';
        const amount = trade.Amount || 'N/A';
        const priceRange = trade.Range || 'N/A';
        const transType = trade.Transaction || 'N/A';
        html += `
          <li>
            <strong>Representative:</strong> ${representative}<br>
            <strong>Party:</strong> ${party}<br>
            <strong>Transaction Date:</strong> ${transactionDate}<br>
            <strong>Report Date:</strong> ${reportDate}<br>
            <strong>Amount:</strong> ${amount}<br>
            <strong>Price Range:</strong> ${priceRange}<br>
            <strong>Transaction:</strong> ${transType}
            <hr>
          </li>
        `;
      });
      html += `</ul>`;
      detailsEl.innerHTML = html;
      detailsSection.style.display = 'block';
      detailsSection.scrollIntoView({ behavior: 'smooth' });
    }

    function renderTimelineGraph(group) {
      // Group all trades by TransactionDate.
      const timeline = {};
      group.trades.forEach(trade => {
        if (!trade.TransactionDate) return;
        const dateStr = new Date(trade.TransactionDate).toLocaleDateString();
        const avg = getAverageFromRange(trade.Range);
        const value = (trade.Transaction && trade.Transaction.toLowerCase() === 'purchase') ? avg : -avg;
        if (!timeline[dateStr]) timeline[dateStr] = 0;
        timeline[dateStr] += value;
      });
      const sortedDates = Object.keys(timeline).sort((a, b) => new Date(a) - new Date(b));
      const values = sortedDates.map(date => timeline[date]);

      // Compute symmetric bounds for the Y-axis.
      const minVal = Math.min(...values);
      const maxVal = Math.max(...values);
      const absMax = Math.max(Math.abs(minVal), Math.abs(maxVal));

      // Create or update the chart.
      const chartContainer = document.getElementById('chartContainer');
      chartContainer.innerHTML = '<canvas id="trendChart"></canvas>';
      const ctx = document.getElementById('trendChart').getContext('2d');

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: sortedDates,
          datasets: [{
            label: 'Net Dollars per Day',
            data: values,
            fill: false,
            borderColor: 'blue',
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            title: {
              display: true,
              text: 'Daily Net Dollars Trend'
            }
          },
          scales: {
            y: {
              title: {
                display: true,
                text: 'Dollars'
              },
              min: -absMax,
              max: absMax
            },
            x: {
              title: {
                display: true,
                text: 'Date'
              }
            }
          }
        }
      });
    }

    // Utility: Parse the Range string "$1,001 - $15,000" and compute the average.
    function getAverageFromRange(rangeStr) {
      if (!rangeStr) return 0;
      const cleanStr = rangeStr.replace(/\$/g, '').replace(/,/g, '');
      const parts = cleanStr.split('-').map(s => parseFloat(s.trim()));
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        return (parts[0] + parts[1]) / 2;
      }
      return 0;
    }
  </script>
</body>
</html>
