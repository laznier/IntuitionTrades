<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Firestore Connection Test with Long Polling</title>
  </head>
  <body>
    <h1>Firestore Connection Test</h1>
    <div id="output">Testing Firestore Connection...</div>
    <script type="module">
      // Import necessary functions from Firebase SDK version 10.8.0
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      // Use initializeFirestore to allow extra options
      import { 
        initializeFirestore, 
        doc, 
        setDoc, 
        getDoc, 
        enableNetwork 
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      
      // Your full Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyBKmeS_j2rYrTo2xd3IZNksdnpOf4ndXmk",
        authDomain: "intuition-trades.firebaseapp.com",
        projectId: "intuition-trades",
        storageBucket: "intuition-trades.firebasestorage.app",
        messagingSenderId: "662507444685",
        appId: "1:662507444685:web:81c8ce875bd522cb748c84"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      
      // Initialize Firestore with options to force long polling
      const db = initializeFirestore(app, {
        experimentalForceLongPolling: true,  // Forces long polling instead of WebChannel transport
        useFetchStreams: false               // Disable streaming if needed
      });
      
      // Optionally force the network to ensure Firestore isn't stuck offline
      enableNetwork(db).catch(err => console.error("Error enabling network:", err));
      
      // Minimal test: Write and then read a test document
      const outputDiv = document.getElementById("output");
      
      async function testFirestore() {
        try {
          // Create or reference a document in the "test" collection with ID "testDoc"
          const testDocRef = doc(db, "test", "testDoc");
          
          // Write a simple document
          await setDoc(testDocRef, { message: "Hello Firestore with long polling!" });
          
          // Attempt to read the document back
          const docSnap = await getDoc(testDocRef);
          
          if (docSnap.exists()) {
            outputDiv.innerText = "Document data: " + JSON.stringify(docSnap.data());
            console.log("Document data:", docSnap.data());
          } else {
            outputDiv.innerText = "No such document!";
          }
        } catch (error) {
          outputDiv.innerText = "Error: " + error.message;
          console.error("Error testing Firestore:", error);
        }
      }
      
      // Run the test
      testFirestore();
    </script>
  </body>
</html>
