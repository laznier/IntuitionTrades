<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Full Sentiment Viewer</title>
  <!-- Include Plotly for Charting -->
  <script src="https://cdn.plot.ly/plotly-2.18.2.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f3f4f6, #ffffff);
      color: #333;
      margin: 0 auto;
      max-width: 900px;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }
    p, li {
      margin-bottom: 0.75em;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
      transition: border-color 0.3s ease;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #1e3a8a;
    }
    .section {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background-color: #f9fafb;
    }
    .section h2 {
      margin-bottom: 10px;
      font-weight: 600;
    }
    #sentChart {
      width: 100%;
      height: 400px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      margin-top: 10px;
    }
    #articleSection {
      margin-top: 20px;
      display: none;
    }
    #articleSection h3 {
      margin-bottom: 10px;
    }
    #articleSection p {
      margin-bottom: 1em;
    }
    #loading {
      margin-top: 10px;
      font-style: italic;
      color: #f97316;
    }
  </style>
</head>
<body>
  <!-- Back to Main Page button -->
  <button onclick="window.location.href='https://www.intuitiontrades.com'">Back to Main Page</button>

  <h1>Market Sentiment Viewer</h1>
  <p>Enter a ticker to load all recent news articles, view a trend line, and click on any article point to read it below.</p>

  <label for="tickerInput">Ticker Symbol (e.g. AAPL):</label>
  <input type="text" id="tickerInput" placeholder="AAPL" />

  <button id="loadButton">Load Data</button>
  <div id="loading" style="display:none;">Loading sentiment data...</div>

  <div id="sentimentSection" class="section" style="display:none;">
    <h2>Sentiment Chart</h2>
    <div id="sentChart"></div>
  </div>

  <div id="articleSection" class="section">
    <!-- This will be populated when a user clicks a point on the chart -->
  </div>

  <script>
    // We'll store the articles here so we can reference them when a point is clicked.
    let globalArticles = [];

    // Helper: parseAlphaDate from the previous code
    function parseAlphaDate(str) {
      // Example str: "20230315T000000"
      const year  = str.substring(0, 4);
      const month = str.substring(4, 6);
      const day   = str.substring(6, 8);
      const hour  = str.substring(9, 11) || "00";
      const min   = str.substring(11, 13) || "00";
      const sec   = str.substring(13, 15) || "00";
      return new Date(`${year}-${month}-${day}T${hour}:${min}:${sec}Z`);
    }

    // Function to fetch "all" sentiment data for a ticker
    // We'll do a large periodMonths so we (hopefully) get all data.
    async function fetchAllSentimentData(ticker) {
      const periodMonths = 9999; // Large enough to cover all available data
      const url = `https://www.projectmanagerhelper.com/api/sentiment?symbol=${ticker}&periodMonths=${periodMonths}`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (!data.feed) throw new Error("No sentiment data from server.");
      return data.feed;
    }

    // Compute a simple linear regression on the (x, y) arrays
    // x is numeric (in days from first date), y is sentiment (0..100)
    function computeLinearRegression(xs, ys) {
      const n = xs.length;
      const sumX = xs.reduce((a, b) => a + b, 0);
      const sumY = ys.reduce((a, b) => a + b, 0);
      const sumXY = xs.reduce((acc, x, i) => acc + x * ys[i], 0);
      const sumX2 = xs.reduce((acc, x) => acc + x * x, 0);

      const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
      const intercept = (sumY - slope * sumX) / n;
      return { slope, intercept };
    }

    // Plot the sentiment data and a trend line using Plotly
    function plotSentiment(articles) {
      const sentimentSection = document.getElementById("sentimentSection");
      sentimentSection.style.display = "block";

      // Convert date to a numeric day offset for regression
      const firstDate = articles[0].date;
      const xs = articles.map(a => (a.date - firstDate) / (1000 * 60 * 60 * 24));
      const ys = articles.map(a => a.sentiment);

      // Create the main trace (scatter points + line)
      const tracePoints = {
        x: articles.map(a => a.date),
        y: ys,
        mode: 'markers+lines',
        name: 'Sentiment',
        text: articles.map(a => a.title || ""), // For hover info
        hovertemplate: '%{text}<br>%{y:.2f}<extra></extra>'
      };

      // Compute linear regression for a trend line
      const { slope, intercept } = computeLinearRegression(xs, ys);
      // For the trend line, we only need the min and max date
      const xMin = articles[0].date;
      const xMax = articles[articles.length - 1].date;
      const x0 = 0; // since xMin is the first date, offset=0
      const x1 = (articles[articles.length - 1].date - firstDate) / (1000 * 60 * 60 * 24);
      const y0 = intercept + slope * x0;
      const y1 = intercept + slope * x1;

      const traceTrend = {
        x: [xMin, xMax],
        y: [y0, y1],
        mode: 'lines',
        line: { dash: 'dash', color: 'red' },
        name: 'Trend'
      };

      const layout = {
        title: "Sentiment Over Time",
        xaxis: { title: "Date" },
        yaxis: { title: "Sentiment (0..100)" }
      };

      const config = { responsive: true };
      Plotly.newPlot("sentChart", [tracePoints, traceTrend], layout, config);

      // Add a click event so that when a user clicks a dot, we show the article
      const sentChart = document.getElementById("sentChart");
      sentChart.on('plotly_click', function(data) {
        // data.points is an array of clicked points (usually length=1 for single click)
        const pointIndex = data.points[0].pointIndex;
        const article = globalArticles[pointIndex];
        showArticle(article);
      });
    }

    // Show the article in the bottom section
    function showArticle(article) {
      const articleSection = document.getElementById("articleSection");
      articleSection.style.display = "block";

      // We'll build a simple HTML structure with the article's info
      // The feed might have different fields; adapt as needed.
      // We'll assume there's a 'title', 'summary', and 'url'.
      const title = article.title || "No Title";
      const summary = article.summary || "No Summary Available";
      const url = article.url || "#";

      articleSection.innerHTML = `
        <h3>${title}</h3>
        <p><strong>Published:</strong> ${article.date.toLocaleString()}</p>
        <p>${summary}</p>
        <p><a href="${url}" target="_blank">Read original</a></p>
      `;
    }

    // Main function to load data and display chart
    async function loadSentimentData() {
      const ticker = document.getElementById("tickerInput").value.trim();
      if (!ticker) {
        alert("Please enter a ticker symbol.");
        return;
      }
      document.getElementById("loading").style.display = "block";
      document.getElementById("sentimentSection").style.display = "none";
      document.getElementById("articleSection").style.display = "none";
      document.getElementById("articleSection").innerHTML = "";

      try {
        // Fetch the entire feed
        const feed = await fetchAllSentimentData(ticker);

        // Convert each article into a plot‐friendly format
        // We'll treat each article as an individual point (rather than hourly aggregation).
        // We'll store them in globalArticles for click reference.
        globalArticles = feed.map((article) => {
          const dt = parseAlphaDate(article.time_published);
          let sentimentVal = 0; 
          let title = article.title || "";
          let summary = article.summary || "";
          let url = article.url || "";

          if (article.ticker_sentiment && article.ticker_sentiment.length > 0) {
            // Find the sentiment for the matching ticker
            const tItem = article.ticker_sentiment.find(
              ts => ts.ticker.toUpperCase() === ticker.toUpperCase()
            );
            if (tItem) {
              const raw = parseFloat(tItem.ticker_sentiment_score);
              // normalized to 0..100
              if (!isNaN(raw)) {
                sentimentVal = ((raw + 1) / 2) * 100;
              }
            }
          }

          return {
            date: dt,
            sentiment: sentimentVal,
            title: title,
            summary: summary,
            url: url,
            original: article // Keep the raw article if needed
          };
        })
        .filter(a => !isNaN(a.date) && a.date.getFullYear() > 1970) // filter out invalid dates
        .sort((a, b) => a.date - b.date);

        if (globalArticles.length < 2) {
          alert("Not enough sentiment data for this ticker.");
          return;
        }
        // Plot them
        plotSentiment(globalArticles);
      } catch (err) {
        alert("Error loading sentiment: " + err.message);
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    // Wire up the button
    document.getElementById("loadButton").addEventListener("click", loadSentimentData);

  // Auto-populate the ticker and run sentiment analysis if "symbol" is provided in the URL.
  window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const symbol = urlParams.get('symbol');
    if (symbol) {
      document.getElementById('tickerInput').value = symbol;
      // Delay the click slightly to ensure all elements are loaded.
      setTimeout(() => {
        document.getElementById('loadButton').click();
      }, 100);
    }
  };

  </script>
</body>
</html>
