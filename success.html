<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow" />
  <title>Membership Flow Retired | Intuition Trades</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(100%, 42rem);
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.82);
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    }
    h1 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: clamp(2rem, 5vw, 3rem);
    }
    p {
      color: #cbd5e1;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: bold;
    }
    .primary {
      background: #0f766e;
    }
    .secondary {
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Membership flow retired</h1>
    <p>
      This old success page is no longer part of the active product because subscriptions and
      premium account upgrades are being removed.
    </p>
    <div class="actions">
      <a class="primary" href="/">Return Home</a>
      <a class="secondary" href="/top5/">Open Public Picks</a>
    </div>
  </div>
</body>
</html>
