<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Sentiment Viewer</title>
  <!-- Include Highcharts for charting -->
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <style>
    :root {
      --primary-bg: #111;
      --secondary-bg: #333;
      --accent-color: #16a34a;
      --text-color: #fff;
      --font-family: 'Arial', sans-serif;
      --transition-speed: 0.3s;
    }
    body {
      font-family: var(--font-family);
      background-color: var(--primary-bg);
      color: var(--text-color);
      margin: 0 auto;
      max-width: 900px;
      padding: 2rem;
      line-height: 1.6;
    }
    h1, h2 {
      text-align: center;
      font-weight: 600;
    }
    h1 { margin-bottom: 20px; }
    p, li {
      margin-bottom: 0.75em;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 0.95rem;
      background-color: var(--secondary-bg);
      color: var(--text-color);
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: var(--accent-color);
      color: var(--text-color);
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background var(--transition-speed);
    }
    button:hover {
      background: #1e3a8a;
    }
    .section {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: var(--secondary-bg);
    }
    .section h2 {
      margin-bottom: 10px;
    }
    #sentChart {
      width: 100%;
      height: 400px;
      border: 1px solid #444;
      border-radius: 4px;
      margin-top: 10px;
    }
    #articleSection {
      margin-top: 20px;
      display: none;
    }
    #articleSection h3 {
      margin-bottom: 10px;
    }
    #articleSection p {
      margin-bottom: 1em;
    }
    #loading {
      margin-top: 10px;
      font-style: italic;
      color: var(--accent-color);
      display: none;
    }
    /* Autocomplete styles */
    #tickerForm {
      position: relative;
      margin-bottom: 20px;
    }
    #ticker-suggestions {
      position: absolute;
      background-color: var(--secondary-bg);
      border: 1px solid #555;
      width: calc(100% - 20px);
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      list-style: none;
      padding: 0;
      margin: 0;
      display: none;
    }
    #ticker-suggestions li {
      padding: 8px;
      cursor: pointer;
    }
    #ticker-suggestions li:hover {
      background-color: var(--accent-color);
      color: var(--text-color);
    }
    #company-full-name {
      margin-top: 5px;
      font-size: 1rem;
      color: var(--accent-color);
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Back to Main Page Button -->
  <button onclick="window.location.href='https://www.intuitiontrades.com'">Back to Main Page</button>

  <h1>Market Sentiment Viewer</h1>
  <p>Enter a ticker symbol to load recent news articles, view a sentiment trend chart, and click on any article point to read more below.</p>

  <!-- Ticker Input Form with Autocomplete -->
  <div id="tickerForm">
    <label for="ticker">Ticker Symbol (e.g. AAPL):</label>
    <input type="text" id="ticker" placeholder="e.g. AAPL" />
    <ul id="ticker-suggestions"></ul>
    <div id="company-full-name"></div>
  </div>

  <button id="loadButton">Load Data</button>
  <div id="loading">Loading sentiment data...</div>

  <div id="sentimentSection" class="section" style="display:none;">
    <h2>Sentiment Chart</h2>
    <div id="sentChart"></div>
  </div>

  <div id="articleSection" class="section">
    <!-- Article content will be populated here -->
  </div>

  <script>
    /*******************************************************
     * AUTO-COMPLETE FUNCTIONS & GLOBAL VARIABLES
     *******************************************************/
    let debounceTimeout;
    function clearSuggestions() {
      const list = document.getElementById('ticker-suggestions');
      if (list) {
        list.innerHTML = '';
        list.style.display = 'none';
      }
      const fullNameElem = document.getElementById('company-full-name');
      if (fullNameElem) {
        fullNameElem.innerText = '';
      }
    }
    async function fetchTickerSuggestions(searchQuery) {
      try {
        const response = await fetch(`/api/ticker?query=${encodeURIComponent(searchQuery)}`);
        if (!response.ok) {
          throw new Error(`API error: ${response.statusText}`);
        }
        const data = await response.json();
        return data.bestMatches || [];
      } catch (error) {
        console.error("Error fetching ticker suggestions:", error);
        return [];
      }
    }
    function renderTickerSuggestions(suggestions) {
      const list = document.getElementById('ticker-suggestions');
      list.innerHTML = '';
      if (!suggestions || suggestions.length === 0) {
        list.style.display = 'none';
        return;
      }
      list.style.display = 'block';
      suggestions.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="ticker-symbol">${item["1. symbol"]}</span> <span class="company-name">(${item["2. name"]})</span>`;
        li.addEventListener('click', () => {
          document.getElementById('ticker').value = item["1. symbol"];
          const fullNameElem = document.getElementById('company-full-name');
          if (fullNameElem) {
            fullNameElem.innerText = item["2. name"];
          }
          clearSuggestions();
        });
        list.appendChild(li);
      });
    }
    document.addEventListener("DOMContentLoaded", () => {
      const tickerInput = document.getElementById('ticker');
      tickerInput.addEventListener('input', () => {
        const query = tickerInput.value.trim();
        if (query.length < 2) {
          clearSuggestions();
          return;
        }
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(async () => {
          const suggestions = await fetchTickerSuggestions(query);
          renderTickerSuggestions(suggestions);
        }, 300);
      });
      clearSuggestions();
    });
    
    /*******************************************************
     * SENTIMENT VIEWER FUNCTIONS & VARIABLES
     *******************************************************/
    // Global articles array for reference when a point is clicked
    let globalArticles = [];

    // Helper to parse date strings (example: "20230315T000000")
    function parseAlphaDate(str) {
      const year  = str.substring(0, 4);
      const month = str.substring(4, 6);
      const day   = str.substring(6, 8);
      const hour  = str.substring(9, 11) || "00";
      const min   = str.substring(11, 13) || "00";
      const sec   = str.substring(13, 15) || "00";
      return new Date(`${year}-${month}-${day}T${hour}:${min}:${sec}Z`);
    }

    // Fetch the full sentiment data feed for a ticker
    async function fetchAllSentimentData(ticker) {
      const periodMonths = 9999; // Large enough to cover all available data
      const url = `https://www.projectmanagerhelper.com/api/sentiment?symbol=${ticker}&periodMonths=${periodMonths}`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (!data.feed) throw new Error("No sentiment data from server.");
      return data.feed;
    }

    // Compute linear regression for given arrays xs and ys
    function computeLinearRegression(xs, ys) {
      const n = xs.length;
      const sumX = xs.reduce((a, b) => a + b, 0);
      const sumY = ys.reduce((a, b) => a + b, 0);
      const sumXY = xs.reduce((acc, x, i) => acc + x * ys[i], 0);
      const sumX2 = xs.reduce((acc, x) => acc + x * x, 0);
      const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
      const intercept = (sumY - slope * sumX) / n;
      return { slope, intercept };
    }

    // Plot sentiment data using Highcharts with a trend line and point click events
    function plotSentiment(articles) {
      const sentimentSection = document.getElementById("sentimentSection");
      sentimentSection.style.display = "block";

      // Prepare data points: [timestamp, sentiment]
      const dataPoints = articles.map(a => [a.date.getTime(), a.sentiment]);

      // Prepare for regression: use days offset from the first date
      const firstDate = articles[0].date;
      const xs = articles.map(a => (a.date - firstDate) / (1000 * 60 * 60 * 24));
      const ys = articles.map(a => a.sentiment);
      const { slope, intercept } = computeLinearRegression(xs, ys);
      const lastDate = articles[articles.length - 1].date;
      const x1 = (lastDate - firstDate) / (1000 * 60 * 60 * 24);
      const trendPoints = [
        [firstDate.getTime(), intercept],
        [lastDate.getTime(), intercept + slope * x1]
      ];

      Highcharts.chart('sentChart', {
        chart: {
          type: 'line',
          backgroundColor: 'var(--secondary-bg)'
        },
        title: {
          text: 'Sentiment Over Time'
        },
        xAxis: {
          type: 'datetime',
          title: { text: 'Date' },
          labels: { style: { color: 'var(--text-color)' } }
        },
        yAxis: {
          title: { text: 'Sentiment (0..100)' },
          labels: { style: { color: 'var(--text-color)' } }
        },
        tooltip: {
          xDateFormat: '%Y-%m-%d',
          shared: true
        },
        plotOptions: {
          series: {
            cursor: 'pointer',
            point: {
              events: {
                click: function() {
                  // Use the point index to fetch the corresponding article
                  const article = globalArticles[this.index];
                  showArticle(article);
                }
              }
            }
          }
        },
        series: [{
          name: document.getElementById('ticker').value.toUpperCase(),
          data: dataPoints,
          marker: { radius: 4 },
          lineWidth: 2,
          color: varAccent = 'var(--accent-color)'
        }, {
          name: 'Trend',
          data: trendPoints,
          dashStyle: 'Dash',
          color: 'red',
          marker: { enabled: false },
          enableMouseTracking: false
        }],
        credits: { enabled: false }
      });
    }

    // Display article details when a data point is clicked
    function showArticle(article) {
      const articleSection = document.getElementById("articleSection");
      articleSection.style.display = "block";
      const title = article.title || "No Title";
      const summary = article.summary || "No Summary Available";
      const url = article.url || "#";
      articleSection.innerHTML = `
        <h3>${title}</h3>
        <p><strong>Published:</strong> ${article.date.toLocaleString()}</p>
        <p>${summary}</p>
        <p><a href="${url}" target="_blank">Read Original</a></p>
      `;
      // Scroll to the article section
      articleSection.scrollIntoView({ behavior: 'smooth' });
    }

    // Main function: load sentiment data and render the chart
    async function loadSentimentData() {
      const ticker = document.getElementById("ticker").value.trim();
      if (!ticker) {
        alert("Please enter a ticker symbol.");
        return;
      }
      document.getElementById("loading").style.display = "block";
      document.getElementById("sentimentSection").style.display = "none";
      document.getElementById("articleSection").style.display = "none";
      document.getElementById("articleSection").innerHTML = "";

      try {
        const feed = await fetchAllSentimentData(ticker);

        // Convert feed articles into plot-friendly objects
        globalArticles = feed.map(article => {
          const dt = parseAlphaDate(article.time_published);
          let sentimentVal = 0;
          let title = article.title || "";
          let summary = article.summary || "";
          let url = article.url || "";
          if (article.ticker_sentiment && article.ticker_sentiment.length > 0) {
            const tItem = article.ticker_sentiment.find(ts => ts.ticker.toUpperCase() === ticker.toUpperCase());
            if (tItem) {
              const raw = parseFloat(tItem.ticker_sentiment_score);
              if (!isNaN(raw)) {
                sentimentVal = ((raw + 1) / 2) * 100;
              }
            }
          }
          return {
            date: dt,
            sentiment: sentimentVal,
            title: title,
            summary: summary,
            url: url,
            original: article
          };
        }).filter(a => !isNaN(a.date) && a.date.getFullYear() > 1970)
          .sort((a, b) => a.date - b.date);

        if (globalArticles.length < 2) {
          alert("Not enough sentiment data for this ticker.");
          return;
        }
        plotSentiment(globalArticles);
      } catch (err) {
        alert("Error loading sentiment: " + err.message);
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    // Wire up the load button click event
    document.getElementById("loadButton").addEventListener("click", loadSentimentData);

    // Auto-populate the ticker if "symbol" exists in the URL params, then load data
    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const symbol = urlParams.get('symbol');
      if (symbol) {
        document.getElementById('ticker').value = symbol;
        setTimeout(() => {
          document.getElementById('loadButton').click();
        }, 100);
      }
    };
  </script>
</body>
</html>
