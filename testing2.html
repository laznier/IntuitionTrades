<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StockTwits CORS Proxy Example</title>
  <script src="https://cdn.plot.ly/plotly-2.18.2.min.js"></script>
</head>
<body>
  <h1>StockTwits Sentiment via All Origins</h1>
  <label for="ticker">Ticker:</label>
  <input type="text" id="ticker" value="AAPL">
  <button id="loadBtn">Load StockTwits Data</button>
  <div id="loading" style="display:none;">Loading...</div>
  <div id="result"></div>

  <script>
    async function loadStockTwitsData() {
      const ticker = document.getElementById("ticker").value.trim().toUpperCase();
      if (!ticker) return alert("Enter a ticker.");

      document.getElementById("loading").style.display = "block";
      document.getElementById("result").textContent = "";

      try {
        // Construct the StockTwits URL
        const stocktwitsUrl = `https://api.stocktwits.com/api/2/streams/symbol/${ticker}.json`;
        // Use All Origins to bypass CORS
        // The "raw=true" parameter returns the data as is, without extra HTML-escape
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(stocktwitsUrl)}&raw=true`;

        const resp = await fetch(proxyUrl);
        if (!resp.ok) {
          throw new Error(`All Origins proxy error: ${resp.status}`);
        }

        // Parse the JSON that All Origins returns
        // If raw=true, you'll get the StockTwits JSON directly
        const data = await resp.json();

        // "data.messages" is typically the array of messages
        if (!data.messages) {
          document.getElementById("result").textContent = "No messages found.";
          return;
        }

        document.getElementById("result").textContent =
          `Got ${data.messages.length} messages for ${ticker}. Example:` +
          JSON.stringify(data.messages[0], null, 2);

        // You can now parse data.messages to compute bullish/bearish sentiment, etc.
        // Then plot with Plotly if you want. For brevity, this snippet just shows the data.

      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    document.getElementById("loadBtn").addEventListener("click", loadStockTwitsData);
  </script>
</body>
</html>
