<style>
  /* Updated dark, modern styling similar to main page */
  :root {
    --primary-bg: #111;
    --secondary-bg: #333;
    --accent-color: #16a34a;
    --text-color: #fff;
    --font-family: 'Arial', sans-serif;
    --transition-speed: 0.3s;
  }
  body {
    font-family: var(--font-family);
    background-color: var(--primary-bg);
    color: var(--text-color);
    margin: 0 auto;
    max-width: 900px;
    padding: 2rem;
    line-height: 1.6;
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 600;
  }
  p, li {
    margin-bottom: 0.75em;
  }
  label {
    display: block;
    margin-top: 15px;
    font-weight: 500;
  }
  input[type="text"],
  input[type="number"],
  input[type="date"] {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 0.95rem;
    background-color: var(--secondary-bg);
    color: var(--text-color);
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    background: var(--accent-color);
    color: var(--text-color);
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    cursor: pointer;
    transition: background var(--transition-speed);
  }
  button:hover {
    background: #1e3a8a;
  }
  .section {
    margin-top: 30px;
    padding: 20px;
    border: 1px solid #444;
    border-radius: 4px;
    background-color: var(--secondary-bg);
  }
  .section h2 {
    margin-bottom: 10px;
    font-weight: 600;
  }
  /* Aggregated bar meter styling */
  #aggregateSection {
    display: none;
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #444;
    border-radius: 4px;
    background-color: var(--secondary-bg);
  }
  #aggregateBar {
    position: relative;
    background: linear-gradient(to right, red, var(--accent-color));
    height: 30px;
    border-radius: 15px;
    margin: 10px 0;
  }
  #aggregateMarker {
    position: absolute;
    top: 0;
    width: 2px;
    height: 100%;
    background: #fff;
  }
  #aggregateScoreText {
    position: absolute;
    width: 100%;
    text-align: center;
    line-height: 30px;
    font-weight: bold;
    color: var(--text-color);
    text-shadow: 1px 1px 2px #000;
  }
  /* Chart container styling (Highcharts will render into these divs) */
  .chartContainer {
    margin-top: 20px;
    height: 400px;
    border: 1px solid #444;
    border-radius: 4px;
    background-color: var(--secondary-bg);
  }
  /* New overlay for simulation loading */
  #countdownOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  #countdownOverlay .circle {
    border: 8px solid #444;
    border-top: 8px solid var(--accent-color);
    border-radius: 50%;
    width: 100px;
    height: 100px;
    animation: spin 2s linear infinite;
    margin-bottom: 20px;
  }
  #loadingText {
    font-size: 1.2rem;
    color: var(--accent-color);
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  /* Back button style */
  button.backBtn {
    background: var(--accent-color);
    margin-bottom: 20px;
  }
</style>
