<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Realtime Stock Performance</title>
  <!-- Include Plotly for Charting -->
  <script src="https://cdn.plot.ly/plotly-2.18.2.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f3f4f6, #ffffff);
      color: #333;
      margin: 0 auto;
      max-width: 900px;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }
    p, li {
      margin-bottom: 0.75em;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
      transition: border-color 0.3s ease;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #1e3a8a;
    }
    .chartContainer {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background-color: #f9fafb;
    }
    #backHome {
      margin-bottom: 20px;
    }
    #loading {
      margin-top: 10px;
      font-style: italic;
      color: #f97316;
    }
    /* Mobile-specific adjustments */
    @media (max-width: 600px) {
      body {
        padding: 1rem;
        font-size: 0.9rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 10px;
      }
      .chartContainer {
        padding: 10px;
        margin-top: 15px;
      }
      button {
        font-size: 0.9rem;
        padding: 8px 16px;
      }
      /* Ensure Plotly charts resize on mobile */
      .realtimeChart {
        width: 100% !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>
  <!-- Back to Home Button -->
  <button id="backHome" onclick="window.location.href='https://www.intuitiontrades.com'">Back to Home</button>

  <h1>Realtime Stock Performance</h1>
  <p>Enter one or more comma-separated ticker symbols to track realtime performance. Each stock will appear in its own chart that updates automatically.</p>

  <label for="ticker">Ticker Symbol(s) (default: SPY):</label>
  <input type="text" id="ticker" value="SPY">
  
  <button id="startTracking">Start Tracking</button>
  <div id="loading" style="display:none;">Fetching realtime data...</div>
  
  <!-- Container to hold the charts -->
  <div id="charts"></div>

  <script>
    // Store tracking intervals and data for each ticker
    const trackers = {};

    // Function to fetch realtime data for a given symbol
    async function fetchRealtimeData(symbol) {
      document.getElementById('loading').style.display = 'block';
      try {
        // Call the realtimebulk API endpoint
        const response = await fetch(`/api/realtimebulk?symbol=${symbol}`);
        const data = await response.json();
        if (!data.data || !data.data.length) {
          console.error("No realtime data returned", data);
          return null;
        }
        // In case of multiple results, choose the one that matches symbol
        const quote = data.data.find(q => q.symbol.toUpperCase() === symbol.toUpperCase());
        return quote;
      } catch (err) {
        console.error("Error fetching realtime data for", symbol, err);
        return null;
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    // Function to update a chart for a given symbol using Plotly
    function updateChart(symbol) {
      const tracker = trackers[symbol];
      const trace = {
        x: tracker.times,
        y: tracker.prices,
        mode: 'lines+markers',
        name: symbol,
        line: { color: 'blue' }
      };
      const layout = {
        title: `Realtime Close Price for ${symbol}`,
        xaxis: { title: "Time" },
        yaxis: { title: "Price" },
        dragmode: 'zoom'
      };
      Plotly.react(`chart-${symbol}`, [trace], layout);
    }

    // Function to start tracking a given symbol
    async function startTrackingSymbol(symbol) {
      // Create a new container for this symbol if it doesn't exist
      let chartDiv = document.getElementById(`chart-${symbol}`);
      if (!chartDiv) {
        chartDiv = document.createElement('div');
        chartDiv.id = `chart-${symbol}`;
        chartDiv.className = 'realtimeChart';
        const container = document.createElement('div');
        container.className = 'chartContainer';
        container.appendChild(chartDiv);
        // Optionally, add a header for each chart
        const header = document.createElement('h2');
        header.textContent = symbol;
        container.insertBefore(header, chartDiv);
        document.getElementById('charts').appendChild(container);
      }
      // Initialize tracker for this symbol if it doesn't exist
      if (!trackers[symbol]) {
        trackers[symbol] = { times: [], prices: [], interval: null };
      }
      // Fetch the initial data point
      const quote = await fetchRealtimeData(symbol);
      if (quote) {
        trackers[symbol].times.push(new Date(quote.timestamp));
        trackers[symbol].prices.push(parseFloat(quote.close));
        updateChart(symbol);
      }
      // Set up interval to fetch data every 10 seconds
      trackers[symbol].interval = setInterval(async () => {
        const newQuote = await fetchRealtimeData(symbol);
        if (newQuote) {
          trackers[symbol].times.push(new Date(newQuote.timestamp));
          trackers[symbol].prices.push(parseFloat(newQuote.close));
          updateChart(symbol);
        }
      }, 10000);
    }

    // Function to start tracking all requested symbols
    function startTracking() {
      // Stop any existing intervals and clear charts
      Object.values(trackers).forEach(tracker => {
        if (tracker.interval) clearInterval(tracker.interval);
      });
      for (let key in trackers) delete trackers[key];
      document.getElementById('charts').innerHTML = '';

      // Get ticker input, split by comma, trim whitespace, and filter out empties
      const input = document.getElementById("ticker").value;
      const symbols = input.split(",").map(s => s.trim()).filter(s => s);
      // Default to SPY if no symbols provided
      if (symbols.length === 0) symbols.push("SPY");

      // Start tracking each symbol
      symbols.forEach(symbol => startTrackingSymbol(symbol));
    }

    // Set up button click to start tracking
    document.getElementById("startTracking").addEventListener("click", startTracking);

    // Auto-load tickers from URL parameters (e.g., ?ticker=OXY,TSLA)
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const tickersParam = params.get('ticker');
      if (tickersParam) {
        document.getElementById('ticker').value = tickersParam;
      }
      if (params.get('autoFetch') === 'true') {
        setTimeout(() => {
          startTracking();
        }, 500);
      }
    });
  </script>
</body>
</html>
