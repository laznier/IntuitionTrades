<!DOCTYPE html>

  <!-- Include Math.js for regression calculations -->

  <style>
    :root {
      --primary-bg: #111;
      --secondary-bg: #333;
      --accent-color: #16a34a;

    body {
      font-family: var(--font-family);

      color: var(--text-color);
      margin: 0 auto;
      max-width: 900px;

    }
    h1 {
      text-align: center;
      margin-bottom: 20px;

    }
    p, li, label {
      margin-bottom: 0.75em;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 0.95rem;
      background-color: var(--secondary-bg);
      color: var(--text-color);
      transition: border-color var(--transition-speed);
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: var(--accent-color);
      color: var(--text-color);
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background var(--transition-speed);
    }
    button:hover {
      background: #1e3a8a;
    }
    /* Autocomplete suggestions for ticker */
    #ticker-suggestions {
      position: absolute;
      background-color: var(--secondary-bg);
      border: 1px solid #555;
      width: calc(100% - 20px);
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      list-style: none;
      padding: 0;
      margin-top: 0.5rem;
      display: none;
    }
    #ticker-suggestions li {
      padding: 8px;
      cursor: pointer;
    }
    #ticker-suggestions li:hover {
      background-color: var(--accent-color);
      color: var(--text-color);
    }
    /* Chart and output styling */
    #loading {
      margin-top: 10px;
      font-style: italic;
      color: var(--accent-color);
      display: none;
    }
    #output, #macdChart {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: var(--secondary-bg);
    }
    #macdChart {
      padding: 0;
    }
  </style>
</head>
<body>
  <!-- Back to Home Button -->
  <button id="backHome" onclick="window.location.href='https://www.intuitiontrades.com'">Back to Home</button>
  
  <h1>MACD Score Calculator</h1>
  <p>Enter a ticker symbol and historical period (in months) to compute the MACD score using our enhanced regression‐based gap and momentum methods, and view the MACD histogram chart.</p>
  
  <label for="ticker">Ticker Symbol (e.g. AAPL):</label>
  <input type="text" id="ticker" value="AAPL">
  <!-- Autocomplete suggestions for ticker -->
  <ul id="ticker-suggestions"></ul>
  
  <label for="period">Historical Period (months):</label>
  <input type="number" id="period" value="12" min="1">
  
  <button id="runAnalysis">Run MACD Calculation</button>
  <div id="loading">Loading data and running MACD analysis...</div>
  
  <!-- Output container for scores -->
  <div id="output" style="display:none;"></div>
  <!-- Container for MACD chart -->
  <div id="macdChart" style="height: 500px; display:none;"></div>
  
  <!-- View Detailed Explanation Button -->
  <button id="explanationButton" style="display:none;">View Detailed Explanation</button>
  
  <script type="module">

      storageBucket: "persuasive-net-456607-g8.appspot.com",

      appId: "1:1019332250475:web:3b931ad7fd0a72e1949a2e",

    (async () => {

    /*************** Autocomplete Functions ***************/
    let debounceTimeout;
    function clearSuggestions() {
      const list = document.getElementById('ticker-suggestions');
      if (list) {
        list.innerHTML = '';
        list.style.display = 'none';
      }
    }
    async function fetchTickerSuggestions(query) {
      try {
        const response = await fetch(`/api/ticker?query=${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error('Error fetching ticker suggestions');
        const data = await response.json();
        return data.bestMatches || [];
      } catch (error) {
        console.error("Error fetching ticker suggestions:", error);
        return [];
      }
    }
    function renderTickerSuggestions(suggestions) {
      const list = document.getElementById('ticker-suggestions');
      list.innerHTML = '';
      if (!suggestions || suggestions.length === 0) {
        list.style.display = 'none';
        return;
      }
      list.style.display = 'block';
      suggestions.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${item["1. symbol"]}</span> - <span>${item["2. name"]}</span>`;
        li.addEventListener('click', () => {
          document.getElementById('ticker').value = item["1. symbol"];
          clearSuggestions();
        });
        list.appendChild(li);
      });
    }
    document.addEventListener("DOMContentLoaded", () => {
      const tickerInput = document.getElementById('ticker');
      tickerInput.addEventListener('input', () => {
        const query = tickerInput.value.trim();
        if (query.length < 2) {
          clearSuggestions();
          return;
        }
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(async () => {
          const suggestions = await fetchTickerSuggestions(query);
          renderTickerSuggestions(suggestions);
        }, 300);
      });
      clearSuggestions();
    });
  
    /*************** MACD Analysis Functions ***************/
    function processHistoricalData(timeSeries, periodMonths) {
      const dates = Object.keys(timeSeries).sort((a, b) => new Date(a) - new Date(b));
      const endDate = new Date(dates[dates.length - 1]);
      const startDate = new Date(endDate);
      startDate.setMonth(startDate.getMonth() - periodMonths);
      let prices = [];
      for (let date of dates) {
        const dt = new Date(date);
        if (dt >= startDate && dt <= endDate) {
          prices.push({
            date: dt,
            open: timeSeries[date]["1. open"] ? parseFloat(timeSeries[date]["1. open"]) : parseFloat(timeSeries[date]["5. adjusted close"]),
            close: parseFloat(timeSeries[date]["5. adjusted close"]),
            high: parseFloat(timeSeries[date]["2. high"]),
            low: parseFloat(timeSeries[date]["3. low"])
          });
        }
      }
      prices.sort((a, b) => a.date - b.date);
      return prices;
    }
  
    function computeEMA(prices, period) {
      let ema = [];
      const multiplier = 2 / (period + 1);
      let sum = 0;
      for (let i = 0; i < period; i++) sum += prices[i].close;
      let prevEma = sum / period;
      ema[period - 1] = { date: prices[period - 1].date, ema: prevEma };
      for (let i = period; i < prices.length; i++) {
        const cur = prices[i].close;
        let nextEma = (cur - prevEma) * multiplier + prevEma;
        ema[i] = { date: prices[i].date, ema: nextEma };
        prevEma = nextEma;
      }
      return ema.filter(x => x !== undefined);
    }
  
    function computeMACD(prices, fast = 12, slow = 26, signal = 9) {
      let fastEMA = computeEMA(prices, fast);
      let slowEMA = computeEMA(prices, slow);
      let macdLine = [];
      for (let i = 0; i < slowEMA.length; i++) {
        let date = slowEMA[i].date;
        let match = fastEMA.find(f => f.date.getTime() === date.getTime());
        if (match) macdLine.push({ date, macd: match.ema - slowEMA[i].ema });
      }
      if (macdLine.length < signal) return { macdLine, signalLine: [] };
      let signalLine = [];
      const m = 2 / (signal + 1);
      let sumMacd = 0;
      for (let i = 0; i < signal; i++) sumMacd += macdLine[i].macd;
      let prevSig = sumMacd / signal;
      signalLine[signal - 1] = { date: macdLine[signal - 1].date, signal: prevSig };
      for (let i = signal; i < macdLine.length; i++) {
        let s = (macdLine[i].macd - prevSig) * m + prevSig;
        signalLine[i] = { date: macdLine[i].date, signal: s };
        prevSig = s;
      }
      return {
        macdLine,
        signalLine: signalLine.filter(x => x !== undefined)
      };
    }
  
    function plotMACD(prices) {
      const { macdLine, signalLine } = computeMACD(prices);
      if (macdLine.length === 0 || signalLine.length === 0) return;
  
      const offset = macdLine.length - signalLine.length;
      const histData = signalLine.map((s, i) => {
        const m = macdLine[i + offset];
        return [m.date.getTime(), m.macd - s.signal];
      });
  
      Highcharts.chart('macdChart', {
        chart: { backgroundColor: 'transparent' },
        title: { text: 'MACD Chart' },
        xAxis: { type: 'datetime' },
        yAxis: { title: { text: 'MACD' } },
        series: [
          { type: 'column', name: 'Histogram', data: histData, colorByPoint: true },
          { type: 'line',   name: 'MACD',      data: macdLine.map(item => [item.date.getTime(), item.macd]) },
          { type: 'line',   name: 'Signal',    data: signalLine.map(item => [item.date.getTime(), item.signal]) }
        ],
        credits: { enabled: false }
      });
  
      document.getElementById("macdChart").style.display = "block";
      return { macdLine, signalLine, histData };
    }
  
    function polynomialRegression(x, y, degree) {
      let X = [];
      for (let i = 0; i < x.length; i++) {
        let row = [];
        for (let j = 0; j <= degree; j++) row.push(Math.pow(x[i], j));
        X.push(row);
      }
      const XT = math.transpose(X);
      const XTX = math.multiply(XT, X);
      const XTy = math.multiply(XT, y);
      const coeffsMatrix = math.lusolve(XTX, XTy);
      return coeffsMatrix.map(val => val[0]);
    }
  
    function predictValue(coeffs, x) {
      return coeffs.reduce((sum, coeff, i) => sum + coeff * Math.pow(x, i), 0);
    }
  
    function computeMomentumScoreUsingRegression(histValues) {
      if (histValues.length < 6) return null;
      const recentHist = histValues.slice(-6);
      const x = [1, 2, 3, 4, 5, 6];
      const coeffs    = polynomialRegression(x, recentHist, 1);
      const predicted = predictValue(coeffs, 7);
      const lastValue = recentHist[recentHist.length - 1];
      const delta     = predicted - lastValue;
      const k         = 5;
      return 100 / (1 + Math.exp(-k * delta));
    }
  
    function computeGapTrendScore(macdLine, signalLine) {
      if (macdLine.length < 6 || signalLine.length < 6) return null;
      const recentMACD   = macdLine.slice(-6).map(item => item.macd);
      const recentSignal = signalLine.slice(-6).map(item => item.signal);
      const x             = [1, 2, 3, 4, 5, 6];
      const macdCoeffs    = polynomialRegression(x, recentMACD, 3);
      const signalCoeffs  = polynomialRegression(x, recentSignal, 3);
      const predictedMACD = predictValue(macdCoeffs, 7);
      const predictedSig  = predictValue(signalCoeffs, 7);
      const predictedGap  = predictedMACD - predictedSig;
      const currentGap    = macdLine[macdLine.length - 1].macd - signalLine[signalLine.length - 1].signal;
      const delta         = predictedGap - currentGap;
      const k             = 5;
      return { gapScore: 100 / (1 + Math.exp(-k * delta)), delta, currentGap, predictedGap };
    }
  
    function computeNewMACDScore(prices) {
      const { macdLine, signalLine } = computeMACD(prices);
      if (macdLine.length < 2 || signalLine.length < 2) return null;
  
      // 1) Position Score
      const latestMACD    = macdLine[macdLine.length - 1].macd;
      const positionScore = 100 / (1 + Math.exp(latestMACD));
  
      // 2) Gap Trend Score
      const gapData = computeGapTrendScore(macdLine, signalLine);
      const gapScore = gapData ? gapData.gapScore : null;
  
      // 3) Build and log last 6 histogram entries
      const offset = macdLine.length - signalLine.length;
      const histEntries = signalLine.map((s, i) => {
        const m = macdLine[i + offset];
        return { date: m.date, hist: m.macd - s.signal };
      });
      console.log(
        "Last 6 histogram entries (oldest→newest):",
        histEntries.slice(-6).map(e => `${e.date.toISOString().slice(0,10)} → ${e.hist.toFixed(4)}`)
      );
  
      // 4) Momentum Score
      const histValues    = histEntries.slice(-6).map(e => e.hist);
      const momentumScore = computeMomentumScoreUsingRegression(histValues);
  
      // 5) Final Score
      const finalScore = (positionScore + gapScore + momentumScore) / 3;
      return { positionScore, gapScore, momentumScore, finalScore };
    }
  
    document.getElementById("runAnalysis").addEventListener("click", async () => {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('output').style.display = 'none';
      document.getElementById("macdChart").style.display = "none";
      document.getElementById("explanationButton").style.display = "none";
  
      const ticker        = document.getElementById('ticker').value.trim();
      const periodMonths  = parseInt(document.getElementById('period').value);
      if (!ticker) {
        alert("Please enter a ticker symbol.");
        document.getElementById('loading').style.display = 'none';
        return;
      }
  
      try {
        const histUrl = `https://www.projectmanagerhelper.com/api/historical?symbol=${ticker}`;
        const resp    = await fetch(histUrl);
        const data    = await resp.json();
        if (!data["Time Series (Daily)"]) throw new Error("Unable to retrieve valid historical data.");
  
        const prices = processHistoricalData(data["Time Series (Daily)"], periodMonths);
        if (prices.length < 80) {
          alert("Not enough historical data for the selected period.");
          document.getElementById('loading').style.display = 'none';
          return;
        }
  
        const macdData  = plotMACD(prices);
        const macdScores = computeNewMACDScore(prices);
        if (!macdScores) {
          alert("Not enough MACD data to compute scores.");
          document.getElementById('loading').style.display = 'none';
          return;
        }
  
        document.getElementById('output').innerHTML = `
          <h2>MACD Analysis for ${ticker}</h2>
          <p><strong>Position Score:</strong> ${macdScores.positionScore.toFixed(2)}%</p>
          <p><strong>Gap Trend Score:</strong> ${macdScores.gapScore.toFixed(2)}%</p>
          <p><strong>Momentum Score:</strong> ${macdScores.momentumScore.toFixed(2)}%</p>
          <hr>
          <p><strong>Final MACD Score:</strong> ${macdScores.finalScore.toFixed(2)}%</p>
        `;
        document.getElementById('output').style.display = 'block';
        document.getElementById("explanationButton").style.display = "block";
  
      } catch (err) {
        alert("Error: " + err.message);
      }
      document.getElementById('loading').style.display = 'none';
    });
  
    document.getElementById("explanationButton").addEventListener("click", () => {
      const win = window.open("", "_blank");
      win.document.write(`
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8"><title>Detailed MACD Calculation Explanation</title>

              --primary-bg: #111; --secondary-bg: #333;
              --accent-color: #16a34a; --text-color: #fff;

            body { font-family: var(--font-family); background: var(--primary-bg);
                   color: var(--text-color); max-width:900px; margin:auto; padding:2rem; line-height:1.6; }

            a { color:var(--accent-color); }
          </style>
        </head>
        <body>
          <h1>Detailed MACD Calculation Explanation</h1>
          <section>
            <h2>1. Position Score</h2>
            <p>The Position Score uses the latest MACD value and maps it to a 0–100 range using a logistic function:</p>
            <pre>positionScore = 100 / (1 + Math.exp(latestMACD));</pre>
          </section>
          <section>
            <h2>2. Gap Trend Score</h2>
            <p>The Gap Trend Score measures how the gap between MACD and Signal is expected to change over the next period.</p>
          </section>
          <section>
            <h2>3. Momentum Score</h2>
            <p>The Momentum Score regresses the last 6 histogram values and predicts the 7th, then maps the delta via a logistic function.</p>
          </section>
          <section style="text-align:center;"><p><a href="#" onclick="window.close();return false;">Close</a></p></section>
        </body>
        </html>
      `);
      win.document.close();
