<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MACD Score Calculator</title>
  <!-- Include Highcharts for Charting (Stock) -->
  <script src="https://code.highcharts.com/stock/highstock.js"></script>
  <!-- Include Math.js for regression calculations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.6.4/math.min.js"></script>


  <style>
    :root {
      --primary-bg: #111;
      --secondary-bg: #333;
      --accent-color: #16a34a;
      --text-color: #fff;
      --font-family: 'Arial', sans-serif;
      --transition-speed: 0.3s;
    }
    body {
      font-family: var(--font-family);
      background-color: var(--primary-bg);
      color: var(--text-color);
      margin: 0 auto;
      max-width: 900px;
      padding: 2rem;
      line-height: 1.6;
      position: relative;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }
    p, li, label {
      margin-bottom: 0.75em;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 0.95rem;
      background-color: var(--secondary-bg);
      color: var(--text-color);
      transition: border-color var(--transition-speed);
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: var(--accent-color);
      color: var(--text-color);
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background var(--transition-speed);
    }
    button:hover {
      background: #1e3a8a;
    }
    /* Autocomplete suggestions for ticker */
    #ticker-suggestions {
      position: absolute;
      background-color: var(--secondary-bg);
      border: 1px solid #555;
      width: calc(100% - 20px);
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      list-style: none;
      padding: 0;
      margin-top: 0.5rem;
      display: none;
    }
    #ticker-suggestions li {
      padding: 8px;
      cursor: pointer;
    }
    #ticker-suggestions li:hover {
      background-color: var(--accent-color);
      color: var(--text-color);
    }
    /* Chart and output styling */
    #loading {
      margin-top: 10px;
      font-style: italic;
      color: var(--accent-color);
      display: none;
    }
    #output, #macdChart {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: var(--secondary-bg);
    }
    #macdChart {
      padding: 0;
    }
    @media (max-width: 768px) {
  /* Shift the chart container left by 10px on mobile */
  #macdChart {
    margin-left: -10px;
    margin-right: 10px; /* keep it centered in its parent */
  }
}
  </style>

  
</head>
<body>
  <!-- Back to Home Button -->
  <button id="backHome" onclick="window.location.href='https://www.intuitiontrades.com'">Back to Home</button>
  
  <h1>MACD Score Calculator</h1>
  <p>Enter a ticker symbol and historical period (in months) to compute the MACD score using our enhanced regression‐based gap and momentum methods, and view the MACD histogram chart.</p>
  
  <label for="ticker">Ticker Symbol (e.g. AAPL):</label>
  <input type="text" id="ticker" value="AAPL">
  <!-- Autocomplete suggestions for ticker -->
  <ul id="ticker-suggestions"></ul>
  
  <label for="period">Historical Period (months):</label>
  <input type="number" id="period" value="12" min="1">
  
  <button id="runAnalysis" class="tool-free-run">Run MACD Calculation</button>
  <div id="loading">Loading data and running MACD analysis...</div>
  
  <!-- Output container for scores -->
  <div id="output" style="display:none;"></div>
  <!-- Container for MACD chart -->
  <div id="macdChart" style="height: 500px; display:none;"></div>
  
  <!-- View Detailed Explanation Button -->
  <button id="explanationButton" style="display:none;">View Detailed Explanation</button>
  
  <script>
  
  

    /*************** Autocomplete Functions ***************/
    let debounceTimeout;
    function clearSuggestions() {
      const list = document.getElementById('ticker-suggestions');
      if (list) {
        list.innerHTML = '';
        list.style.display = 'none';
      }
    }
    async function fetchTickerSuggestions(query) {
      try {
        const response = await fetch(`/api/ticker?query=${encodeURIComponent(query)}`);
        if (!response.ok) {
          throw new Error('Error fetching ticker suggestions');
        }
        const data = await response.json();
        return data.bestMatches || [];
      } catch (error) {
        console.error("Error fetching ticker suggestions:", error);
        return [];
      }
    }
    function renderTickerSuggestions(suggestions) {
      const list = document.getElementById('ticker-suggestions');
      list.innerHTML = '';
      if (!suggestions || suggestions.length === 0) {
        list.style.display = 'none';
        return;
      }
      list.style.display = 'block';
      suggestions.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${item["1. symbol"]}</span> - <span>${item["2. name"]}</span>`;
        li.addEventListener('click', () => {
          document.getElementById('ticker').value = item["1. symbol"];
          clearSuggestions();
        });
        list.appendChild(li);
      });
    }
    document.addEventListener("DOMContentLoaded", () => {
      const tickerInput = document.getElementById('ticker');
      tickerInput.addEventListener('input', () => {
        const query = tickerInput.value.trim();
        if (query.length < 2) {
          clearSuggestions();
          return;
        }
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(async () => {
          const suggestions = await fetchTickerSuggestions(query);
          renderTickerSuggestions(suggestions);
        }, 300);
      });
      clearSuggestions();
    });
    
    /*************** MACD Analysis Functions ***************/
    // Process historical data from the API response.
    function processHistoricalData(timeSeries, periodMonths) {
      const dates = Object.keys(timeSeries).sort((a, b) => new Date(a) - new Date(b));
      const endDate = new Date(dates[dates.length - 1]);
      const startDate = new Date(endDate);
      startDate.setMonth(startDate.getMonth() - periodMonths);
      let prices = [];
      for (let date of dates) {
        const dt = new Date(date);
        if (dt >= startDate && dt <= endDate) {
          prices.push({
            date: dt,
            open: timeSeries[date]["1. open"] ? parseFloat(timeSeries[date]["1. open"]) : parseFloat(timeSeries[date]["5. adjusted close"]),
            close: parseFloat(timeSeries[date]["5. adjusted close"]),
            high: parseFloat(timeSeries[date]["2. high"]),
            low: parseFloat(timeSeries[date]["3. low"])
          });
        }
      }
      prices.sort((a, b) => a.date - b.date);
      return prices;
    }
    
    // Exponential Moving Average (EMA) calculation.
    function computeEMA(prices, period) {
      let ema = [];
      const multiplier = 2 / (period + 1);
      let sum = 0;
      for (let i = 0; i < period; i++) {
        sum += prices[i].close;
      }
      let prevEma = sum / period;
      ema[period - 1] = { date: prices[period - 1].date, ema: prevEma };
      for (let i = period; i < prices.length; i++) {
        const cur = prices[i].close;
        let nextEma = (cur - prevEma) * multiplier + prevEma;
        ema[i] = { date: prices[i].date, ema: nextEma };
        prevEma = nextEma;
      }
      return ema.filter(x => x !== undefined);
    }
    
    // Compute MACD and Signal lines.
    function computeMACD(prices, fast = 12, slow = 26, signal = 9) {
      let fastEMA = computeEMA(prices, fast);
      let slowEMA = computeEMA(prices, slow);
      let macdLine = [];
      for (let i = 0; i < slowEMA.length; i++) {
        let date = slowEMA[i].date;
        let match = fastEMA.find(f => f.date.getTime() === date.getTime());
        if (match) {
          macdLine.push({ date: date, macd: match.ema - slowEMA[i].ema });
        }
      }
      if (macdLine.length < signal) return { macdLine: macdLine, signalLine: [] };
      let signalLine = [];
      const m = 2 / (signal + 1);
      let sumMacd = 0;
      for (let i = 0; i < signal; i++) {
        sumMacd += macdLine[i].macd;
      }
      let prevSig = sumMacd / signal;
      signalLine[signal - 1] = { date: macdLine[signal - 1].date, signal: prevSig };
      for (let i = signal; i < macdLine.length; i++) {
        let s = (macdLine[i].macd - prevSig) * m + prevSig;
        signalLine[i] = { date: macdLine[i].date, signal: s };
        prevSig = s;
      }
      signalLine = signalLine.filter(x => x !== undefined);
      return { macdLine: macdLine, signalLine: signalLine };
    }
    
    // Plot MACD Chart using Highcharts.
    function plotMACD(prices) {
      const macdData = computeMACD(prices);
      const macdLine = macdData.macdLine;
      const signalLine = macdData.signalLine;
      if (macdLine.length === 0 || signalLine.length === 0) return;
      
      const offset = macdLine.length - signalLine.length;
let histData = [];
for (let i = 0; i < signalLine.length; i++) {
  const alignedMACD = macdLine[i + offset];
  histData.push([alignedMACD.date.getTime(), alignedMACD.macd - signalLine[i].signal]);
}

      
      Highcharts.chart('macdChart', {
        chart: { backgroundColor: 'transparent' },
        title: { text: 'MACD Chart' },
        xAxis: { type: 'datetime' },
        yAxis: { title: { text: null } },
        series: [{
          type: 'column',
          name: 'Histogram',
          data: histData,
          colorByPoint: true
        }, {
          type: 'line',
          name: 'MACD',
          data: macdLine.map(item => [item.date.getTime(), item.macd]),
          color: 'blue'
        }, {
          type: 'line',
          name: 'Signal',
          data: signalLine.map(item => [item.date.getTime(), item.signal]),
          color: 'orange'
        }],
        credits: { enabled: false }
      });
      
      document.getElementById("macdChart").style.display = "block";
      return { macdLine, signalLine, histData };
    }
    
    // Polynomial regression using a Vandermonde matrix (3rd degree).
    function polynomialRegression(x, y, degree) {
      let X = [];
      for (let i = 0; i < x.length; i++) {
        let row = [];
        for (let j = 0; j <= degree; j++) {
          row.push(Math.pow(x[i], j));
        }
        X.push(row);
      }
      const XT = math.transpose(X);
      const XTX = math.multiply(XT, X);
      const XTy = math.multiply(XT, y);
      const coeffsMatrix = math.lusolve(XTX, XTy);
      const coeffs = coeffsMatrix.map(val => val[0]);
      return coeffs;
    }
    
    // Evaluate a polynomial at a given x.
    function predictValue(coeffs, x) {
      return coeffs.reduce((sum, coeff, i) => sum + coeff * Math.pow(x, i), 0);
    }
    
    function computeMomentumScoreUsingRegression(histValues) {
  if (histValues.length < 6) return null;

  // grab the last 6 histogram bars
  const recentHist = histValues.slice(-6);
  const x = [1, 2, 3, 4, 5, 6];

  // 1st-degree fit
  const coeffs    = polynomialRegression(x, recentHist, 1);
  const predicted = predictValue(coeffs, 7);
  const lastValue = recentHist[recentHist.length - 1];

  // raw change from last bar → future (positive = up-trend)
  const delta = predicted - lastValue;

  // —— Tweak here:
  // increase this sensitivity to stretch the logistic curve
  const sensitivity = 10;  

  // logistic mapping: delta → [0…100]
  const score = 100 / (1 + Math.exp(-sensitivity * delta));

  return score;
}


    
    // Compute the gap trend score using regression on both MACD and Signal lines.
    function computeGapTrendScore(macdLine, signalLine) {
      if (macdLine.length < 6 || signalLine.length < 6) return null;
      const recentMACD = macdLine.slice(-6).map(item => item.macd);
      const recentSignal = signalLine.slice(-6).map(item => item.signal);
      const x = [1, 2, 3, 4, 5, 6];
      const macdCoeffs = polynomialRegression(x, recentMACD, 3);
      const signalCoeffs = polynomialRegression(x, recentSignal, 3);
      const predictedMACD = predictValue(macdCoeffs, 7);
      const predictedSignal = predictValue(signalCoeffs, 7);
      const predictedGap = predictedMACD - predictedSignal;
      const currentGap = macdLine[macdLine.length - 1].macd - signalLine[signalLine.length - 1].signal;
      const delta = predictedGap - currentGap;
      const k = 5; // sensitivity factor
      const gapScore = 100 / (1 + Math.exp(-k * delta));
      return { gapScore, delta, currentGap, predictedGap };
    }
    
    // Compute the overall MACD score using Position Score, Gap Trend Score, and Momentum Score.
    function computeNewMACDScore(prices) {
      const macdData = computeMACD(prices);
      const macdLine = macdData.macdLine;
      const signalLine = macdData.signalLine;
      if (macdLine.length < 2 || signalLine.length < 2) return null;
      
      const len = Math.min(macdLine.length, signalLine.length);
      const latestMACD = macdLine[len - 1].macd;
      
      // 1. Position Score: Map latest MACD relative to zero using a logistic function.
      const positionScore = 100 / (1 + Math.exp(latestMACD));
      
      // 2. Gap Trend Score using regression on both MACD and Signal lines.
      const gapData = computeGapTrendScore(macdLine, signalLine);
      const gapScore = gapData ? gapData.gapScore : null;
      
      
   // 3. Momentum Score: zip macdLine & signalLine, take last 6
const offset     = macdLine.length - signalLine.length;
const histValues = signalLine
  .map((s, i) => macdLine[i + offset].macd - s.signal)
  .slice(-6);
const momentumScore = computeMomentumScoreUsingRegression(histValues);

      const finalScore = (positionScore + gapScore + momentumScore) / 3;
      return { positionScore, gapScore, momentumScore, finalScore };
    }
    
    // Main analysis: fetch historical data, compute scores, and plot the MACD chart.
    document.getElementById("runAnalysis").addEventListener("click", async () => {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('output').style.display = 'none';
      document.getElementById("macdChart").style.display = "none";
      document.getElementById("explanationButton").style.display = "none";
      
      const ticker = document.getElementById('ticker').value.trim();
      const periodMonths = parseInt(document.getElementById('period').value);
      if (!ticker) {
        alert("Please enter a ticker symbol.");
        document.getElementById('loading').style.display = 'none';
        return;
      }
      
      try {
        const histUrl = `https://www.projectmanagerhelper.com/api/historical?symbol=${ticker}`;
        const resp = await fetch(histUrl);
        const data = await resp.json();
        if (!data["Time Series (Daily)"]) {
          throw new Error("Unable to retrieve valid historical data.");
        }
        const prices = processHistoricalData(data["Time Series (Daily)"], periodMonths);
        if (prices.length < 80) { // Ensure sufficient data.
          alert("Not enough historical data for the selected period.");
          document.getElementById('loading').style.display = 'none';
          return;
        }
        
        // Plot the MACD chart using Highcharts.
        const macdData = plotMACD(prices);
        
        // Compute the MACD scores.
        const macdScores = computeNewMACDScore(prices);
        if (!macdScores) {
          alert("Not enough MACD data to compute scores.");
          document.getElementById('loading').style.display = 'none';
          return;
        }
        
        // Display the individual scores and final MACD score.
        document.getElementById('output').innerHTML = `
          <h2>MACD Analysis for ${ticker}</h2>
          <p><strong>Position Score:</strong> ${macdScores.positionScore.toFixed(2)}%</p>
          <p><strong>Gap Trend Score:</strong> ${macdScores.gapScore.toFixed(2)}%</p>
          <p><strong>Momentum Score (Regression based):</strong> ${macdScores.momentumScore.toFixed(2)}%</p>
          <hr>
          <p><strong>Final MACD Score:</strong> ${macdScores.finalScore.toFixed(2)}%</p>
        `;
        document.getElementById('output').style.display = 'block';
        document.getElementById("explanationButton").style.display = "block";
      } catch (err) {
        alert("Error: " + err.message);
      }
      document.getElementById('loading').style.display = 'none';
    });
    
    // View Detailed Explanation: Opens a new window with a detailed explanation.
    document.getElementById("explanationButton").addEventListener("click", () => {
      const explanationWindow = window.open("", "_blank");
      const explanationHTML = `
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>Detailed MACD Calculation Explanation</title>
        <style>
          :root {
            --primary-bg: #111;
            --secondary-bg: #333;
            --accent-color: #16a34a;
            --text-color: #fff;
            --font-family: 'Arial', sans-serif;
            --transition-speed: 0.3s;
          }
          body { 
            font-family: var(--font-family);
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0 auto;
            max-width: 900px;
            padding: 2rem;
            line-height: 1.6;
          }
          h1, h2 { text-align: center; }
          pre { 
            background: var(--secondary-bg); 
            padding: 1rem; 
            border-radius: 4px; 
            overflow-x: auto; 
          }
          a { color: var(--accent-color); }
        </style>
      </head>
      <body>
        <h1>Detailed MACD Calculation Explanation</h1>
        <section>
          <h2>1. Position Score</h2>
          <p>The Position Score uses the latest MACD value and maps it to a 0–100 range using a logistic function. The formula is:</p>
          <pre>positionScore = 100 / (1 + Math.exp(latestMACD));</pre>
          <p>This means that if the latest MACD value is very negative, the score approaches 100 (bullish); if it’s positive, the score tends toward 0 (bearish).</p>
        </section>
        <section>
          <h2>2. Gap Trend Score</h2>
          <p>The Gap Trend Score measures how the gap between the MACD and Signal lines is expected to change. To compute it we:</p>
          <ol>
            <li>Select the last 6 data points from both the MACD and Signal lines.</li>
            <li>Fit a 3st-degree polynomial regression to each series.</li>
            <li>Predict the 7th value for both the MACD and Signal lines.</li>
            <li>Compute the predicted gap (predicted MACD minus predicted Signal) and compare it with the current gap to get a delta.</li>
            <li>Map the delta using a logistic function: <code>gapScore = 100 / (1 + Math.exp(-k * delta));</code></li>
          </ol>
          <p>A positive delta indicates a bullish trend in the gap, increasing the score, while a negative delta lowers it.</p>
        </section>
        <section>
          <h2>3. Momentum Score</h2>
          <p>The Momentum Score examines changes in the MACD histogram (the difference between MACD and Signal) over the last 6 values:</p>
          <ol>
            <li>Gather the last 6 histogram values.</li>
            <li>Fit a 1rd-degree polynomial regression to these values.</li>
            <li>Predict the 7th histogram value.</li>
            <li>Calculate the delta between the predicted and the last observed histogram value.</li>
            <li>Map the delta via a logistic function to obtain the momentum score.</li>
          </ol>
          <p>A positive delta results in a higher momentum score; a negative one reduces the score.</p>
        </section>
        <section>
          <h2>4. Final MACD Score</h2>
          <p>The final MACD Score is the average of the Position, Gap Trend, and Momentum scores:</p>
          <pre>finalScore = (positionScore + gapScore + momentumScore) / 3;</pre>
          <p>This final score provides an overall view of the MACD by capturing current position, anticipated change, and momentum.</p>
        </section>
        <section style="text-align:center;">
          <p><a href="#" onclick="window.close(); return false;">Close Explanation</a></p>
        </section>
      </body>
      </html>
      `;
      explanationWindow.document.write(explanationHTML);
      explanationWindow.document.close();
    });
  </script>
