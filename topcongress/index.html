  transition: background var(--transition-speed), transform 0.2s ease;
}

button:hover {

.item {

}

    async function fetchTickerSuggestions(searchQuery) {
      try {
        const response = await fetch(`/api/ticker?query=${encodeURIComponent(searchQuery)}`);
        if (!response.ok) {
          throw new Error(`API error: ${response.statusText}`);
        }
        const data = await response.json();
        return data.bestMatches || [];
      } catch (error) {
        console.error("Error fetching ticker suggestions:", error);
        return [];
      }

    // Utility: Parse the Range string "$1,001 - $15,000" and compute the average
    function getAverageFromRange(rangeStr) {
      if (!rangeStr) return 0;
      const cleanStr = rangeStr.replace(/\$/g, '').replace(/,/g, '');
      const parts = cleanStr.split('-').map(s => parseFloat(s.trim()));
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        return (parts[0] + parts[1]) / 2;
      }
      return 0;
    }

    // Render the top stocks from the filtered data
    function renderTopStocks(filteredData) {
      function groupByTicker(trades) {
        const map = {};
        trades.forEach(trade => {
          const ticker = trade.Ticker || 'Unknown';
          if (!map[ticker]) {
            map[ticker] = { ticker, trades: [] };
          }
          map[ticker].trades.push(trade);
        });
        return Object.values(map);
      }
      const groups = groupByTicker(filteredData);
      groups.forEach(group => {
        let totalBuy = 0, totalSell = 0;
        group.trades.forEach(trade => {
          const avg = getAverageFromRange(trade.Range);
          if (trade.Transaction && trade.Transaction.toLowerCase() === 'purchase') {
            totalBuy += avg;
          } else if (trade.Transaction && trade.Transaction.toLowerCase() === 'sale') {
            totalSell += avg;
          }
        });
        group.totalBuy = totalBuy;
        group.totalSell = totalSell;
        group.netDollars = totalBuy - totalSell;
        group.tradeCount = group.trades.length;
      });
      const topBuys = groups.filter(group => group.netDollars > 0)
                            .sort((a, b) => b.netDollars - a.netDollars)
                            .slice(0, 5);
      const topSells = groups.filter(group => group.netDollars < 0)
                             .sort((a, b) => a.netDollars - b.netDollars)
                             .slice(0, 5);
      const buyContainer = document.getElementById('buyContainer');
      buyContainer.innerHTML = '';
      topBuys.forEach(group => {
        const div = document.createElement('div');
        div.classList.add('item');
        div.innerHTML = `
          <strong>${group.ticker}</strong><br>
          Trades: ${group.tradeCount}<br>
          Total Dollars Spent: $${group.netDollars.toLocaleString(undefined, { maximumFractionDigits: 2 })}
        `;
        div.addEventListener('click', () => showDetails(group));
        buyContainer.appendChild(div);
      });
      const sellContainer = document.getElementById('sellContainer');
      sellContainer.innerHTML = '';
      topSells.forEach(group => {
        const div = document.createElement('div');
        div.classList.add('item');
        div.innerHTML = `
          <strong>${group.ticker}</strong><br>
          Trades: ${group.tradeCount}<br>
          Total Dollars Acquired: $${Math.abs(group.netDollars).toLocaleString(undefined, { maximumFractionDigits: 2 })}
        `;
        div.addEventListener('click', () => showDetails(group));
        sellContainer.appendChild(div);
      });
      document.getElementById('buyCol').style.display = topBuys.length > 0 ? 'block' : 'none';
      document.getElementById('sellCol').style.display = topSells.length > 0 ? 'block' : 'none';

        }
        searchingEl.innerText = `Searching ${politicianNames[currentIndex]}`;
      }, cycleInterval);

      countdownInterval = setInterval(() => {
        countdown--;
        countdownEl.innerText = countdown;
        if (countdown <= 0) {
          clearInterval(countdownInterval);
          clearInterval(searchingInterval);
        }
      }, 1000);

      // Hide previous sections
      document.getElementById('detailsSection').style.display = 'none';
      document.getElementById('buyContainer').innerHTML = '';
      document.getElementById('sellContainer').innerHTML = '';

      try {
        const response = await fetch('/api/topcongress');
        if (!response.ok) {
          const text = await response.text();
          throw new Error(`Failed to fetch data: ${response.status} - ${text}`);
        }
        const jsonResponse = await response.json();
        if (!jsonResponse.data || !Array.isArray(jsonResponse.data)) {
          throw new Error("Invalid data format from API. Expected { data: [] }");
        }
        allData = jsonResponse.data;
        renderTopStocks(allData);
        // Show filters only after data has loaded
        document.getElementById('filterSection').style.display = 'block';
      } catch (error) {
        console.error("Error:", error);
        alert("Error: " + error.message);
      } finally {
        clearInterval(countdownInterval);
        clearInterval(searchingInterval);
        document.getElementById('loading').style.display = 'none';
      }
    });

    // Apply filter by days, politician, and stock
document.getElementById('applyFilter').addEventListener('click', () => {
  const daysInput = document.getElementById('filterDays').value.trim();
  const days = daysInput === "" ? null : parseInt(daysInput);
  const politicianFilter = document.getElementById('filterPolitician').value.trim().toLowerCase();
  const stockFilter = document.getElementById('ticker').value.trim().toLowerCase();

  const filteredData = allData.filter(item => {
    if (days !== null) {
      if (!item.TransactionDate) return false;
      const tradeDate = new Date(item.TransactionDate);
      let cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - days);
      if (isNaN(tradeDate) || tradeDate < cutoff) return false;
    }
    if (politicianFilter && item.Representative && item.Representative.toLowerCase().indexOf(politicianFilter) === -1) {
      return false;
    }
    if (stockFilter && item.Ticker && item.Ticker.toLowerCase().indexOf(stockFilter) === -1) {
      return false;
    }
    return true;
  });

  // Construct the trades title based on filters:
  let tradesTitle = "";
  if (stockFilter && days && politicianFilter) {
    // If all three filters are applied, try to get the full politician name from the first transaction.
    let repName = "";
    if (filteredData.length > 0 && filteredData[0].Representative) {
      repName = filteredData[0].Representative;
    } else {
      repName = document.getElementById('filterPolitician').value.trim();
    }
    tradesTitle = `${stockFilter.toUpperCase()} trades by ${repName} in the last ${days} days`;
  } else if (stockFilter && days) {
    tradesTitle = `${stockFilter.toUpperCase()} trades in the last ${days} days`;
  } else if (stockFilter) {
    tradesTitle = `${stockFilter.toUpperCase()} trades`;
  } else if (days) {
    tradesTitle = `All reported trades in the last ${days} days`;
  } else {
    tradesTitle = "All reported trades";
  }
  document.getElementById('tradesTitle').innerText = tradesTitle;
  document.getElementById('tradesTitle').style.display = 'block';

  renderTopStocks(filteredData);
  document.getElementById('detailsSection').style.display = 'none';
});


    // Show detailed transactions for a selected ticker and render timeline graph
    function showDetails(group) {
      const detailsSection = document.getElementById('detailsSection');
      const detailsEl = document.getElementById('details');
      renderTimelineGraph(group);
      let html = `
        <p><strong>Ticker:</strong> ${group.ticker}</p>
        <p><strong>Total Trades:</strong> ${group.tradeCount}</p>
        <p><strong>Net Dollars:</strong> $${group.netDollars.toLocaleString(undefined, { maximumFractionDigits: 2 })}</p>
        <h3>All Transactions:</h3>
        <ul>
      `;
      group.trades.forEach(trade => {
        const representative = trade.Representative || 'N/A';
        const party = trade.Party || 'N/A';
        const transactionDate = trade.TransactionDate ? new Date(trade.TransactionDate).toLocaleDateString() : 'N/A';
        const reportDate = trade.ReportDate ? new Date(trade.ReportDate).toLocaleDateString() : 'N/A';
        const amount = trade.Amount || 'N/A';
        const priceRange = trade.Range || 'N/A';
        const transType = trade.Transaction || 'N/A';
        html += `
          <li>
            <strong>Representative:</strong> ${representative}<br>
            <strong>Party:</strong> ${party}<br>
            <strong>Transaction Date:</strong> ${transactionDate}<br>
            <strong>Report Date:</strong> ${reportDate}<br>
            <strong>Amount:</strong> ${amount}<br>
            <strong>Price Range:</strong> ${priceRange}<br>
            <strong>Transaction:</strong> ${transType}
            <hr>
          </li>
        `;
      });
      html += `</ul>`;
      detailsEl.innerHTML = html;
      detailsSection.style.display = 'block';
      detailsSection.scrollIntoView({ behavior: 'smooth' });
    }

    // Render a timeline graph for the selected ticker using Chart.js
    function renderTimelineGraph(group) {
      const timeline = {};
      group.trades.forEach(trade => {
        if (!trade.TransactionDate) return;
        const dateStr = new Date(trade.TransactionDate).toLocaleDateString();
        const avg = getAverageFromRange(trade.Range);
        const value = (trade.Transaction && trade.Transaction.toLowerCase() === 'purchase') ? avg : -avg;
        if (!timeline[dateStr]) {
          timeline[dateStr] = 0;
        }
        timeline[dateStr] += value;
      });
      const sortedDates = Object.keys(timeline).sort((a, b) => new Date(a) - new Date(b));
      const values = sortedDates.map(date => timeline[date]);
      const absMax = Math.max(...values.map(val => Math.abs(val)));
      const chartContainer = document.getElementById('chartContainer');
      chartContainer.innerHTML = '<canvas id="trendChart"></canvas>';
      const ctx = document.getElementById('trendChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: sortedDates,
          datasets: [{
            label: 'Net Dollars per Day',
            data: values,
            fill: false,
            borderColor: 'blue',
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            title: {
              display: true,
              text: 'Daily Net Dollars Trend'
            }
          },
          scales: {
            y: {
              title: {
                display: true,
                text: 'Dollars'
              },
              min: -absMax,
              max: absMax
            },
            x: {
              title: {
                display: true,
                text: 'Date'
              }
            }
          }
        }
      });
    }

    /* ================= Autocomplete Integration ================= */
    document.addEventListener("DOMContentLoaded", () => {
      const tickerInput = document.getElementById('ticker');
      tickerInput.addEventListener('input', () => {
        const query = tickerInput.value.trim();
        if (query.length < 2) {
          clearSuggestions();
          return;
        }
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(async () => {
          const suggestions = await fetchTickerSuggestions(query);
          renderTickerSuggestions(suggestions);
        }, 300);
      });
      clearSuggestions();
    });

</script>
