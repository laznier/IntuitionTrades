<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Congress Trading Insights</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary-bg: #111;
      --secondary-bg: #333;
      --accent-color: #16a34a;
      --text-color: #fff;
      --font-family: 'Arial', sans-serif;
      --transition-speed: 0.3s;
    }
    body {
      font-family: var(--font-family);
      background-color: var(--primary-bg);
      color: var(--text-color);
      margin: 0 auto;
      max-width: 900px;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }
    p, li {
      margin-bottom: 0.75em;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 0.95rem;
      background-color: var(--secondary-bg);
      color: var(--text-color);
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: var(--accent-color);
      color: var(--text-color);
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background var(--transition-speed), transform 0.2s ease;
    }
    button:hover {
      background: #1e3a8a;
      transform: scale(1.05);
    }
    .item {
      border: 1px solid #555;
      border-radius: 4px;
      padding: 8px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background var(--transition-speed), transform 0.2s ease;
    }
    .item:hover {
      background-color: var(--accent-color);
      transform: scale(1.03);
      color: var(--text-color);
    }
    .section {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: var(--secondary-bg);
    }
    .section h2 {
      margin-bottom: 10px;
      font-weight: 600;
    }
    #loading {
      margin-top: 10px;
      font-style: italic;
      color: var(--accent-color);
      display: none;
      text-align: center;
    }
    .two-column {
      display: flex;
      gap: 2rem;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .column {
      flex: 1;
      min-width: 300px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: var(--secondary-bg);
      padding: 1rem;
    }
    .column h2 {
      text-align: center;
      margin-bottom: 10px;
    }
    #ticker-suggestions,
    #politician-suggestions {
      position: absolute;
      background-color: var(--secondary-bg);
      border: 1px solid #555;
      width: calc(100% - 20px);
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      list-style: none;
      padding: 0;
      margin: 0;
      display: none;
    }
    #ticker-suggestions li,
    #politician-suggestions li {
      padding: 8px;
      cursor: pointer;
    }
    #ticker-suggestions li:hover,
    #politician-suggestions li:hover {
      background-color: var(--accent-color);
      color: var(--text-color);
    }
    #company-full-name {
      margin-top: 5px;
      font-size: 1rem;
      color: var(--accent-color);
    }
  </style>
</head>
<body id="app" style="display:none">
  <button onclick="window.location.href='https://intuitiontrades.com'">Back to Main Page</button>
  <h1>Interactive Top Congress Trades</h1>
  <p>This page displays the top 5 stocks bought and sold by Congress with filtering and interactive details.</p>

  <div style="text-align: center;">
    <button id="fetchButton">Load Congress Trades Data</button>
  </div>

  <div id="loading">
    <p>Loading data... (<span id="countdown">15</span> seconds remaining)</p>
    <p id="searchingText">Searching...</p>
  </div>

  <div id="filterSection" style="display:none;">
    <label for="filterDays">Filter by days:</label>
    <input type="number" id="filterDays" placeholder="e.g. 90" min="1"/>
    <label for="filterPolitician">Filter by Politician:</label>
    <input type="text" id="filterPolitician" placeholder="Enter name"/>
    <ul id="politician-suggestions"></ul>
    <label for="ticker">Ticker Symbol:</label>
    <input type="text" id="ticker" placeholder="e.g. TSLA" />
    <ul id="ticker-suggestions"></ul>
    <div id="company-full-name"></div>
    <button id="applyFilter">Apply Filter</button>
  </div>

  <div id="tradesTitle" style="display:none; text-align:center; margin-top:20px; font-weight:600; font-size:1.2rem;"></div>

  <div class="two-column">
    <div id="buyCol" class="column" style="display:none;">
      <h2>Top 5 Buying</h2>
      <div id="buyContainer"></div>
    </div>
    <div id="sellCol" class="column" style="display:none;">
      <h2>Top 5 Selling</h2>
      <div id="sellContainer"></div>
    </div>
  </div>

  <div id="detailsSection" class="section" style="display:none;">
    <h2>Stock Details</h2>
    <div id="chartContainer"><canvas id="trendChart"></canvas></div>
    <div id="details"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    // 1) Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCw3AOOCQhYz1gn5-R8xxqdXFYMMEoPPH8",
      authDomain: "persuasive-net-456607-g8.firebaseapp.com",
      projectId: "persuasive-net-456607-g8",
      storageBucket: "persuasive-net-456607-g8.appspot.com",
      messagingSenderId: "1019332250475",
      appId: "1:1019332250475:web:3b931ad7fd0a72e1949a2e",
      databaseURL: "https://persuasive-net-456607-g8-default-rtdb.firebaseio.com/"
    };

    // 2) Init Firebase
    initializeApp(firebaseConfig);
    const auth = getAuth();

    // 3) Wait for auth state
    function waitForAuth(timeoutMs = 10000) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("Auth timeout")), timeoutMs);
        onAuthStateChanged(auth, user => {
          clearTimeout(timer);
          if (user) resolve(user);
          else reject(new Error("User not signed in"));
        });
      });
    }

    // 4) Retrieve token with retries
    async function getVerifiedToken(user, retries = 3) {
      let delay = 1000;
      for (let i = 0; i < retries; i++) {
        try {
          const token = await user.getIdToken(true);
          if (token) return token;
        } catch (e) {
          console.warn(`Token fetch retry ${i+1}:`, e.message);
        }
        await new Promise(r => setTimeout(r, delay));
      }
      throw new Error("Could not retrieve valid ID token");
    }

    // 5) Control flow: verify premium, then init UI
    let cachedToken = "";
    async function verifyUserIsPremium() {
      try {
        const user = await waitForAuth();
        cachedToken = await getVerifiedToken(user);

        const res = await fetch("/api/verify-google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: cachedToken, requirePremium: true })
        });

        if (!res.ok) {
          const err = await res.text();
          alert(`Access Denied (${res.status}): ${err}`);
          return window.location.href = "/upgrade.html";
        }

        // Show the app UI
        document.getElementById("app").style.display = "block";
        initializeCongressTool();

      } catch (e) {
        console.error("Premium check failed:", e.message);
        alert("Please sign in again: " + e.message);
        window.location.href = "/login.html";
      }
    }
    verifyUserIsPremium();

    // 6) All your UI logic in one place
    function initializeCongressTool() {
      // Helpers & state
      let debounceTimeout, countdownInterval, searchingInterval;
      let allData = [];
      const politicianNames = [
        "Alma Adams","Robert Aderholt","Pete Aguilar","Mark Alford","Rick Allen",
        /* … all names … */ "Ryan Zinke"
      ];
      const totalCycleTime = 15000;
      const cycleInterval = totalCycleTime / politicianNames.length;

      // Autocomplete ticker
      async function fetchTickerSuggestions(q) {
        try {
          const r = await fetch(`/api/ticker?query=${encodeURIComponent(q)}`);
          if (!r.ok) throw new Error(r.statusText);
          const d = await r.json();
          return d.bestMatches || [];
        } catch {
          return [];
        }
      }
      function clearSuggestions() {
        const ul = document.getElementById("ticker-suggestions");
        ul.innerHTML = ""; ul.style.display = "none";
        document.getElementById("company-full-name").innerText = "";
      }
      function renderTickerSuggestions(s) {
        const ul = document.getElementById("ticker-suggestions");
        ul.innerHTML = "";
        if (!s.length) return void (ul.style.display = "none");
        ul.style.display = "block";
        s.forEach(item => {
          const li = document.createElement("li");
          li.textContent = `${item["1. symbol"]} (${item["2. name"]})`;
          li.addEventListener("click", () => {
            document.getElementById("ticker").value = item["1. symbol"];
            document.getElementById("company-full-name").innerText = item["2. name"];
            clearSuggestions();
          });
          ul.appendChild(li);
        });
      }

      // Autocomplete politician
      function clearPoliticianSuggestions() {
        const ul = document.getElementById("politician-suggestions");
        ul.innerHTML = ""; ul.style.display = "none";
      }
      function renderPoliticianSuggestions(list) {
        const ul = document.getElementById("politician-suggestions");
        ul.innerHTML = "";
        if (!list.length) return void (ul.style.display = "none");
        ul.style.display = "block";
        list.forEach(name => {
          const li = document.createElement("li");
          li.textContent = name;
          li.addEventListener("click", () => {
            document.getElementById("filterPolitician").value = name;
            clearPoliticianSuggestions();
          });
          ul.appendChild(li);
        });
      }
      document.getElementById("filterPolitician").addEventListener("input", e => {
        const q = e.target.value.trim().toLowerCase();
        if (!q) return clearPoliticianSuggestions();
        renderPoliticianSuggestions(politicianNames.filter(n => n.toLowerCase().includes(q)));
      });

      // Utility: parse range
      function getAverageFromRange(r) {
        if (!r) return 0;
        const nums = r.replace(/\$|,/g, "").split("-").map(x => parseFloat(x.trim()));
        return nums.length === 2 ? (nums[0] + nums[1]) / 2 : 0;
      }

      // Render stocks
      function renderTopStocks(data) {
        const map = {};
        data.forEach(t => {
          const tk = t.Ticker || "Unknown";
          if (!map[tk]) map[tk] = { ticker: tk, trades: [] };
          map[tk].trades.push(t);
        });
        const groups = Object.values(map).map(g => {
          let buy=0, sell=0;
          g.trades.forEach(t => {
            const avg = getAverageFromRange(t.Range);
            t.Transaction.toLowerCase() === "purchase" ? buy += avg : sell += avg;
          });
          return {
            ...g,
            netDollars: buy - sell,
            tradeCount: g.trades.length
          };
        });
        const buys = groups.filter(g => g.netDollars>0).sort((a,b)=>b.netDollars-a.netDollars).slice(0,5);
        const sells= groups.filter(g => g.netDollars<0).sort((a,b)=>a.netDollars-b.netDollars).slice(0,5);

        const buyC = document.getElementById("buyContainer");
        buyC.innerHTML = "";
        buys.forEach(g=>{
          const div = document.createElement("div");
          div.className = "item";
          div.innerHTML = `<strong>${g.ticker}</strong><br>Trades: ${g.tradeCount}<br>Total Spent: $${g.netDollars.toLocaleString()}`;
          div.addEventListener("click", ()=>showDetails(g));
          buyC.appendChild(div);
        });
        document.getElementById("buyCol").style.display = buys.length ? "block":"none";

        const sellC = document.getElementById("sellContainer");
        sellC.innerHTML = "";
        sells.forEach(g=>{
          const div = document.createElement("div");
          div.className = "item";
          div.innerHTML = `<strong>${g.ticker}</strong><br>Trades: ${g.tradeCount}<br>Total Acquired: $${Math.abs(g.netDollars).toLocaleString()}`;
          div.addEventListener("click", ()=>showDetails(g));
          sellC.appendChild(div);
        });
        document.getElementById("sellCol").style.display = sells.length ? "block":"none";
      }

      // Details + chart
      function showDetails(group) {
        const sec = document.getElementById("detailsSection");
        const det = document.getElementById("details");
        det.innerHTML = `
          <p><strong>Ticker:</strong> ${group.ticker}</p>
          <p><strong>Total Trades:</strong> ${group.tradeCount}</p>
          <p><strong>Net Dollars:</strong> $${group.netDollars.toLocaleString()}</p>
          <h3>All Transactions:</h3><ul>
          ${group.trades.map(t=>`
            <li>
              <strong>Rep:</strong> ${t.Representative||"N/A"}<br>
              <strong>Party:</strong> ${t.Party||"N/A"}<br>
              <strong>Txn Date:</strong> ${new Date(t.TransactionDate).toLocaleDateString()}<br>
              <strong>Report Date:</strong> ${new Date(t.ReportDate).toLocaleDateString()}<br>
              <strong>Range:</strong> ${t.Range||"N/A"}<br>
              <strong>Type:</strong> ${t.Transaction||"N/A"}
            </li>
          `).join("")}
          </ul>
        `;
        renderTimelineChart(group);
        sec.style.display = "block";
        sec.scrollIntoView({ behavior:"smooth" });
      }
      function renderTimelineChart(group) {
        const timeline = {};
        group.trades.forEach(t => {
          const d = new Date(t.TransactionDate).toLocaleDateString();
          const val = (t.Transaction.toLowerCase()==="purchase"?1:-1)*getAverageFromRange(t.Range);
          timeline[d] = (timeline[d]||0) + val;
        });
        const dates = Object.keys(timeline).sort((a,b)=>new Date(a)-new Date(b));
        const values = dates.map(d=>timeline[d]);
        const max = Math.max(...values.map(v=>Math.abs(v)));
        document.getElementById("chartContainer").innerHTML = '<canvas id="trendChart"></canvas>';
        new Chart(
          document.getElementById("trendChart").getContext("2d"),
          {
            type: "line",
            data: { labels: dates, datasets:[{ label:"Net $/day", data:values, fill:false, tension:0.1 }] },
            options:{
              scales:{
                y: { min:-max, max },
                x: {}
              }
            }
          }
        );
      }

      // Fetch & filter logic
      document.getElementById("fetchButton").addEventListener("click", async () => {
        document.getElementById("loading").style.display = "block";
        let cd=15;
        document.getElementById("countdown").innerText = cd;
        let idx=0;
        document.getElementById("searchingText").innerText = `Searching ${politicianNames[0]}`;
        searchingInterval = setInterval(()=>{
          idx=(idx+1)%politicianNames.length;
          document.getElementById("searchingText").innerText = `Searching ${politicianNames[idx]}`;
        }, cycleInterval);
        countdownInterval = setInterval(()=>{
          if (--cd<=0) clearInterval(countdownInterval)&&clearInterval(searchingInterval);
          document.getElementById("countdown").innerText = cd;
        },1000);

        try {
          const resp = await fetch("/api/topcongress", {
            headers: { Authorization: `Bearer ${cachedToken}` }
          });
          if (!resp.ok) throw new Error(await resp.text());
          const json = await resp.json();
          allData = json.data;
          renderTopStocks(allData);
          document.getElementById("filterSection").style.display = "block";
        } catch (e) {
          alert("Error loading data: " + e.message);
        } finally {
          clearInterval(countdownInterval);
          clearInterval(searchingInterval);
          document.getElementById("loading").style.display = "none";
        }
      });

      document.getElementById("applyFilter").addEventListener("click", () => {
        const daysVal = document.getElementById("filterDays").value;
        const days = daysVal? parseInt(daysVal) : null;
        const pol = document.getElementById("filterPolitician").value.toLowerCase();
        const tk = document.getElementById("ticker").value.toLowerCase();

        const filtered = allData.filter(item => {
          if (days) {
            const td = new Date(item.TransactionDate);
            const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
            if (isNaN(td) || td < cutoff) return false;
          }
          if (pol && !item.Representative.toLowerCase().includes(pol)) return false;
          if (tk && !item.Ticker.toLowerCase().includes(tk)) return false;
          return true;
        });

        let title;
        if (tk && days && pol) {
          title = `${tk.toUpperCase()} trades by ${filtered[0]?.Representative||pol} in last ${days} days`;
        } else if (tk && days) {
          title = `${tk.toUpperCase()} trades in last ${days} days`;
        } else if (tk) {
          title = `${tk.toUpperCase()} trades`;
        } else if (days) {
          title = `All reported trades in last ${days} days`;
        } else {
          title = "All reported trades";
        }
        document.getElementById("tradesTitle").innerText = title;
        document.getElementById("tradesTitle").style.display = "block";
        renderTopStocks(filtered);
        document.getElementById("detailsSection").style.display = "none";
      });

      // Autocomplete wiring
      document.getElementById("ticker").addEventListener("input", e => {
        const q = e.target.value.trim();
        if (q.length < 2) return clearSuggestions();
        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(async () => {
          const list = await fetchTickerSuggestions(q);
          renderTickerSuggestions(list);
        }, 300);
      });
      clearSuggestions();
    }
  </script>
</body>
</html>
